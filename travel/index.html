<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0E7">
<title>Travel Desk · RK Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0E7;
  --paper-2:#F7F8F2;
  --ink:#13262C;
  --ink-soft:#4A5B5F;
  --rule:#C3CCBD;
  --stamp:#A93226;
  --go:#1E6B5C;
  --shadow:0 1px 0 rgba(19,38,44,.10), 0 8px 24px -18px rgba(19,38,44,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Karla',system-ui,sans-serif;color:var(--ink);background:var(--paper);
  padding:18px 14px calc(56px + env(safe-area-inset-bottom));line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
input,select,textarea,button{font-size:16px;font-family:inherit}
*:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto}

.back{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);text-decoration:none;display:inline-block;margin-bottom:14px}
.back:hover{color:var(--ink)}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.head h1{font-family:'Newsreader',serif;font-weight:500;font-size:30px;margin:0;letter-spacing:-.01em}
.head .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:4px}

.tripbar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.tripbar select{flex:1;min-width:140px;padding:9px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--paper-2);color:var(--ink)}
.iconbtn{border:1px solid var(--rule);background:var(--paper-2);color:var(--ink);border-radius:3px;padding:9px 12px;cursor:pointer}
.iconbtn:hover{border-color:var(--ink-soft)}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);margin-bottom:18px}
.tab{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:10px 4px;margin-right:22px;border:none;background:none;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--stamp)}

.card{background:var(--paper-2);border:1px solid var(--rule);border-radius:5px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:4px}
input[type=date],input[type=text],input[type=time],select,textarea{
  width:100%;padding:9px 10px;border:1px solid var(--rule);border-radius:3px;background:#fff;color:var(--ink);
}
textarea{resize:vertical;min-height:44px;font-family:inherit}

/* ---- Board ---- */
.sector{position:relative;padding-left:20px}
.sector::before{content:"";position:absolute;left:6px;top:6px;bottom:-14px;width:1px;background:var(--rule)}
.sector:last-child::before{display:none}
.sector::after{content:"";position:absolute;left:2px;top:2px;width:9px;height:9px;border-radius:50%;background:var(--go)}
.sector .city{font-family:'Newsreader',serif;font-size:21px;font-weight:500}
.sector .dates{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin:2px 0 10px}
.grid2{display:grid;grid-template-columns:1fr 90px;gap:8px;margin-bottom:10px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
.actions a,.actions button{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.04em;text-decoration:none;
  border:1px solid var(--rule);border-radius:3px;padding:7px 10px;color:var(--ink);background:#fff;cursor:pointer;
}
.actions a:hover,.actions button:hover{border-color:var(--ink-soft)}
.rm{margin-left:auto;color:var(--stamp)!important;border-color:transparent!important;background:none!important}
.addsector{width:100%;padding:11px;border:1px dashed var(--rule);border-radius:4px;background:none;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-top:6px}
.addsector:hover{border-color:var(--ink-soft);color:var(--ink)}
.homefly{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:6px;padding-left:20px}

/* ---- Binder ---- */
.day{margin-bottom:14px}
.day .dhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:6px;margin-bottom:10px}
.day .dhead .dtitle{font-family:'Newsreader',serif;font-size:19px}
.day .dhead .dcity{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em}
.entry{display:flex;gap:10px;padding:9px 0;border-bottom:1px dotted var(--rule)}
.entry:last-of-type{border-bottom:none}
.entry .etype{font-size:17px;flex:none;width:22px;text-align:center}
.entry .ebody{flex:1;min-width:0}
.entry .etitle{font-weight:700;font-size:14px}
.entry .emeta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);margin-top:2px}
.entry .enote{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.entry .edel{flex:none;background:none;border:none;color:var(--stamp);cursor:pointer;font-size:16px;padding:0 2px}
.entry .ebell{flex:none;background:none;border:none;cursor:pointer;font-size:16px;padding:0 6px;opacity:1}
.entry .ebell[disabled]{opacity:.3;cursor:default}
.addentry label.remrow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);margin-bottom:8px}
.addentry .remrow input[type=checkbox]{width:auto}
.addentry .remrow input[type=number]{width:64px;padding:6px 8px}
.addentry{border:1px dashed var(--rule);border-radius:4px;padding:10px;margin-top:4px}
.addentry .row{margin-bottom:8px}
.addentry .row:last-child{margin-bottom:0}
.f-type{width:118px;flex:none}
.f-time{width:96px;flex:none}
.f-title{flex:2;min-width:130px}
.f-ref{flex:1;min-width:110px}
.mini{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:3px;padding:8px 14px;cursor:pointer}
.empty{font-size:12.5px;color:var(--ink-soft);font-style:italic;padding:4px 0}

.toolbar{display:flex;justify-content:flex-end;margin-bottom:10px}
.saved{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--go);height:14px;text-align:right;margin-top:-4px;margin-bottom:8px}

@media print{
  body{background:#fff;padding:0}
  .back,.tripbar,.tabs,.addsector,.actions,.addentry,.toolbar,.edel{display:none!important}
  .card{box-shadow:none;border:none;padding:0;margin-bottom:22px}
  #board{display:none!important}
  .day .dhead{border-bottom:1px solid #000}
}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Tracker</a>
  <div class="head">
    <div>
      <h1>Travel Desk</h1>
      <div class="sub">board · booking links · trip binder</div>
    </div>
  </div>

  <div class="tripbar">
    <select id="tripSel"></select>
    <button class="iconbtn" id="btnNew" title="New trip">+ New</button>
    <button class="iconbtn" id="btnDup" title="Duplicate trip">⧉</button>
    <button class="iconbtn" id="btnDel" title="Delete trip">🗑</button>
    <button class="iconbtn" id="btnReload" title="Reload the latest itinerary into this trip">↻ Latest</button>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="board">Board</button>
    <button class="tab" data-tab="binder">Binder</button>
    <button class="tab" data-tab="vault">Vault</button>
    <button class="tab" data-tab="packing">Packing</button>
    <button class="tab" data-tab="money">Money</button>
  </div>
  <div class="saved" id="saved"></div>

  <div id="board">
    <div class="card">
      <div class="row">
        <div style="flex:1;min-width:140px">
          <label class="f">Departs</label>
          <input type="date" id="tripStart">
        </div>
        <div style="flex:1;min-width:140px">
          <label class="f">Travellers</label>
          <input type="text" id="tripPax" placeholder="3">
        </div>
      </div>
    </div>
    <div id="sectors"></div>
    <button class="addsector" id="btnAddSector">+ Add a place</button>
    <div class="homefly" id="homefly"></div>
  </div>

  <div id="binder" style="display:none">
    <div class="toolbar"><button class="iconbtn" id="btnPrint">🖨 Print binder</button></div>
    <div id="days"></div>
  </div>

  <div id="vault" style="display:none">
    <div class="card">
      <div class="f" style="margin-bottom:6px">Research vault — dump screenshots of fares, hotels, anything. Tap <b>Analyse</b> and it reads the details out for you.</div>
      <div class="row">
        <label class="mini" style="display:inline-block;cursor:pointer">🖼 Photos<input type="file" id="vaultPhotos" accept="image/*" multiple style="display:none"></label>
        <label class="mini" style="display:inline-block;cursor:pointer">📄 Files / PDFs<input type="file" id="vaultFile" accept="application/pdf,image/*" multiple style="display:none"></label>
        <button class="mini" id="vaultAnalyseAll">✨ Analyse all</button>
      </div>
      <div class="f" style="margin-top:6px;opacity:.7">Pick several at once — on iPhone use <b>Photos</b> for screenshots, it lets you multi-select.</div>
      <input type="text" id="vaultSearch" placeholder="Search vault — airline, city, price…" style="width:100%;margin-top:8px;padding:9px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--paper-2);color:var(--ink)">
    </div>
    <div id="vaultList"></div>
  </div>

  <div id="packing" style="display:none">
    <div class="card">
      <div class="row">
        <input type="text" id="packNew" placeholder="Add an item…" style="flex:1">
        <select id="packCat" style="min-width:120px;padding:9px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--paper-2);color:var(--ink)">
          <option value="Clothes">Clothes</option>
          <option value="Loungewear">Loungewear</option>
          <option value="Tech">Tech</option>
          <option value="Documents">Documents</option>
          <option value="Health">Health</option>
          <option value="Misc">Misc</option>
        </select>
        <button class="mini" id="packAdd">Add</button>
      </div>
      <div class="f" id="packCount" style="margin-top:8px"></div>
      <button class="iconbtn" id="packSeed" style="margin-top:8px">↻ Load suggested list for this trip</button>
    </div>
    <div id="packList"></div>
  </div>

  <div id="money" style="display:none">
    <div class="card">
      <div class="row">
        <select id="expDay" style="flex:1;min-width:150px;padding:9px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--paper-2);color:var(--ink)"></select>
        <select id="expCat" style="min-width:120px;padding:9px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--paper-2);color:var(--ink)">
          <option>Food</option><option>Transport</option><option>Hotel</option>
          <option>Tickets</option><option>Shopping</option><option>Tips</option><option>Other</option>
        </select>
      </div>
      <div class="row">
        <input type="text" id="expWhat" placeholder="What was it?" style="flex:1">
        <input type="number" id="expAmt" placeholder="Amount" style="width:110px">
        <select id="expCur" style="width:90px;padding:9px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--paper-2);color:var(--ink)">
          <option>INR</option><option>CHF</option><option>EUR</option><option>USD</option><option>EGP</option>
        </select>
      </div>
      <button class="mini" id="expAdd">Add expense</button>
      <div class="f" id="expTotal" style="margin-top:10px"></div>
    </div>
    <div id="expList"></div>
  </div>
</div>

<script>
(function(){
  var KEY = 'rk_travel_desk_v1';
  var trips = {};
  var activeId = null;
  var tab = 'board';

  function uid(){ return 't' + Math.random().toString(36).slice(2,9); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function pad(n){ return n<10?'0'+n:''+n; }
  function toISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function fromISO(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function addDays(iso, n){ var d=fromISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
  function fmt(iso){
    var d=fromISO(iso);
    var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var mons=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return days[d.getDay()]+' '+d.getDate()+' '+mons[d.getMonth()];
  }

  function defaultTrip(name){
    return {
      id: uid(), name: name || 'Switzerland, Italy & Egypt 2026',
      start: '2026-09-23', pax: '3',
      sectors: [
        {id:uid(), city:'Zürich',   nights:1, mode:'flight'},
        {id:uid(), city:'Venice',   nights:2, mode:'train'},
        {id:uid(), city:'Rome',     nights:3, mode:'train'},
        {id:uid(), city:'Naples',   nights:2, mode:'train'},
        {id:uid(), city:'Luxor',    nights:5, mode:'flight'},
        {id:uid(), city:'Cairo',    nights:2, mode:'flight'}
      ],
      homeCity:'Bengaluru',
      binder: seedBinder(),
      vault: [], packing: [], expenses: []
    };
  }

  // The real, currently-booked plan — carried over from the itinerary already
  // worked out on the day it was planned, not re-guessed. Times are as
  // researched; anything not yet ticketed says so rather than inventing one.
  function seedBinder(){
    const e = (type,time,title,ref,note,remindMin) => {
      var o = {id:uid(),type,time,title,ref:ref||'',note:note||''};
      if(remindMin!=null && time){ o.remind = true; o.remindMin = remindMin; }
      return o;
    };
    return {
      '2026-09-23': [
        e('other','','PENDING before you fly — Egypt: WhatsApp Kamel','https://visa2egypt.gov.eg','Ask: is he authorised to issue the Letter of Guarantee, does the US visa exemption apply, will he/staff meet at the airport, fee, and documents needed. This gates the Egypt e-visa application.'),
        e('other','','PENDING — Egypt e-visa application','https://visa2egypt.gov.eg','Apply once Kamel confirms the guarantee-letter situation. Needs passport copy, 2 photos, bank statement, flight + hotel proof.'),
        e('other','','PENDING — Turkey e-visa (if transiting Istanbul)','https://www.evisa.gov.tr/en/','Eligible via Schengen/US visa. 1–3 day processing — apply early, not last-minute.'),
        e('other','','PENDING — multi-country travel insurance','','One policy covering the whole trip incl. Egypt (Egypt mandates insurance; Schengen needs \u20AC30,000 min medical cover). Compare ICICI Lombard / Tata AIG / Care Health.'),
        e('other','','PENDING — cards & cash','','Forex card loaded EUR+CHF; 1 backup card, different bank; notify banks of CH/IT/EG travel dates; carry small USD bills for Egypt tipping; withdraw EGP on arrival via ATM.'),
        e('flight','04:35','EY 233 Bengaluru (BLR T2) → Abu Dhabi (AUH T A)','77AXKM','CONFIRMED. Lands 07:00. Airbus A321, 3h55m nonstop. Cabin 7kg, checked 30kg. Tickets: Ravi Kiran 607 2418550334 · Brunda 607 2418550335 · Tassmai 607 2418550336. ₹25,598 each, ₹76,794 for 3. NON ENDO/NONREF.', 180),
        e('flight','08:25','EY 139 Abu Dhabi (AUH T A) → Zürich (ZRH)','77AXKM','CONFIRMED. Lands 13:20. Airbus A321neo, 6h55m nonstop. Only 1h25m to connect at AUH — same terminal A, but do not dawdle.', 60),
        e('hotel','14:30','Zürich — Old Town 3-star','','\u20B918\u201320k/night budget: Hotel Rössli or Hotel Adler, Altstadt — walkable to everything.'),
        e('taxi','14:00','Airport train to Zürich HB, then walk to hotel','','13 min train + 8 min walk. You land 13:20, so allow for immigration first.')
      ],
      '2026-09-24': [
        e('train','09:09','EuroCity Zürich HB → Milano Centrale','','Arrive 12:50. Change ~75 min in Milan.', 45),
        e('train','14:05','Frecciarossa Milano Centrale → Venezia S. Lucia','','Arrive 16:22. Vaporetto Line 1 or 2 to hotel.'),
        e('hotel','','Venice — near train station','','\u20AC150\u2013190/night: Hotel Carlton Capri or Hotel Principe, Lista di Spagna — both across the Grand Canal from Santa Lucia station, breakfast included.')
      ],
      '2026-09-25': [
        e('activity','09:30','Basilica di San Marco',''),
        e('activity','11:00','Doge\u2019s Palace — timed entry',''),
        e('activity','14:00','Rialto + Murano via Vaporetto Line 12','','Sightseeing tickets ~\u20B924,000 total for 3.')
      ],
      '2026-09-26': [
        e('train','09:25','Frecciarossa Venezia S. Lucia → Roma Termini (direct)','','Arrive 13:12.', 45),
        e('hotel','','Rome — near Termini','','\u20AC150\u2013180/night: UNA Hotels Decò Roma (4-star, right by the station) or Hotel Nazionale / Best Western Plus Universo.')
      ],
      '2026-09-27': [
        e('activity','08:30','Colosseum — timed entry','','Metro B, Termini→Colosseo, 2 stops. Forum + Palatine on the same ticket.')
      ],
      '2026-09-28': [
        e('activity','08:00','Vatican Museums','','Metro A, Termini→Ottaviano. Allow 3 hours, then St Peter\u2019s. Tickets ~\u20B921,600 total.')
      ],
      '2026-09-29': [
        e('train','09:00','Frecciarossa Roma Termini → Napoli Centrale','','Arrive 10:10.', 45),
        e('hotel','','Naples — city centre','','\u20AC100\u2013130/night: UNA Hotels Napoli or Gentile Suite Decumani — cheapest stop on the trip.')
      ],
      '2026-09-30': [
        e('activity','09:00','Free day in Naples / optional Pompeii day trip','','Circumvesuviana to Pompei Scavi, ~30 min ride, allow 3 hours on site.')
      ],
      '2026-10-01': [
        e('other','','Onward to Egypt — routing not locked yet','','easyJet Milan\u2013Luxor is seasonal and only starts 24 Nov, so it will not work for these dates. Two options to decide between: (1) Naples → Milan by Frecciarossa (~4h15m), overnight near MXP, then Neos nonstop MXP→Luxor next morning (₹22,362/person, 8:00a\u20131:10p); or (2) fly Milan → Cairo → Luxor via EgyptAir (₹31,500\u201342,000/person, connecting) and see the pyramids on the way in instead of on the way back. Confirm exact Neos/EgyptAir schedule before booking.'),
        e('flight','','Milan (MXP) → Luxor (LXR)','','Neos nonstop, ~4h10m, ₹22,362/person — or EgyptAir via Cairo, ₹31,500\u201342,000/person, 1 stop. Book once the Naples→Milan connection above is settled.'),
        e('other','','Nile cruise Luxor ⇄ Aswan','','4\u20135 nights, $500\u20131,200/person, most packages include accommodation, meals, guided tours (Karnak, Valley of the Kings, Philae, Edfu, Kom Ombo). Domestic transfers usually extra.')
      ],
      '2026-10-06': [
        e('flight','','Luxor (LXR) → Cairo (CAI)','','Cheapest: Air Cairo ₹4,700\u20139,800/person. EgyptAir ₹9,500\u201314,000/person, more frequent.'),
        e('train','','Alternative: Cairo sleeper train','https://www.abelatrains.com','Abela Trains, overnight 10\u201312h, Bashtil Station (Giza) — not Ramses anymore. Single cabin ~$94.50, double ~$150, incl. dinner + breakfast. Book ahead, site can be glitchy.'),
        e('activity','','Pyramids of Giza + Egyptian Museum','','Dedicated Cairo stop on the way back, as planned — see the pyramids properly rather than just transiting.'),
        e('flight','','Cairo → BLR','','Not yet booked — return routing still open.')
      ]
    };
  }

  function computeDates(trip){
    var out = []; var cur = trip.start;
    trip.sectors.forEach(function(s){
      var arr = cur, dep = addDays(cur, Number(s.nights)||0);
      out.push({sector:s, arrive:arr, depart:dep});
      cur = dep;
    });
    return out;
  }
  function tripEnd(trip){ var c=computeDates(trip); return c.length?c[c.length-1].depart:trip.start; }

  /* ---------- links ---------- */
  function flightLink(from, to, date){
    return 'https://www.google.com/travel/flights?q=' + encodeURIComponent('Flights from '+from+' to '+to+' on '+date);
  }
  function trainLink(from, to, date){
    return 'https://www.google.com/search?q=' + encodeURIComponent(from+' to '+to+' train tickets '+date);
  }
  function hotelLink(city, checkin, checkout, pax){
    var p = new URLSearchParams({ss:city, checkin:checkin, checkout:checkout, group_adults:pax||'2', no_rooms:'1', group_children:'0'});
    return 'https://www.booking.com/searchresults.html?' + p.toString();
  }
  function taxiLink(city){
    return 'https://m.uber.com/ul/?action=setPickup&dropoff%5Bformatted_address%5D=' + encodeURIComponent(city);
  }

  /* ---------- persistence — Supabase is the source of truth.
     localStorage stays only as an instant paint cache so the page is not blank
     while the network round-trip happens. Every write goes to Supabase. ---------- */
  var saveTimer;
  function flash(msg){
    var el = document.getElementById('saved');
    el.textContent = msg;
    clearTimeout(flash._t);
    flash._t = setTimeout(function(){ el.textContent=''; }, 2200);
  }
  function save(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async function(){
      var payload = {active:activeId, trips:trips};
      try{ localStorage.setItem(KEY, JSON.stringify(payload)); }catch(e){}
      var r = await dbAPI('savePortfolio', {key:'travel_desk', data:payload});
      if(r && (r.ok || r.saved)) flash('Saved'); else flash('Saved on this device only');
    }, 400);
  }
  async function boot(){
    // 1. instant paint from cache
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var data = JSON.parse(raw);
        if(data && data.trips && Object.keys(data.trips).length){
          trips = data.trips; activeId = data.active;
        }
      }
    }catch(e){}

    // 2. durable load from Supabase — wins if present

        renderAll();
        flash('Synced');

  async function syncEntryReminder(dateISO, entry){
    var tag = 'tg_travel_' + entry.id;
    var res = await dbAPI('getPortfolio', {key:'tg_scheduled'});
    var list = (res && res.ok && res.data && Array.isArray(res.data.scheduled)) ? res.data.scheduled : [];
    list = list.filter(function(m){ return m.id !== tag; });

    if(entry.remind && entry.time){
      var when = fromISO(dateISO);
      var parts = entry.time.split(':');
      when.setHours(parseInt(parts[0],10)||0, parseInt(parts[1],10)||0, 0, 0);
      when.setMinutes(when.getMinutes() - (Number(entry.remindMin)||0));
      list.push({
        id: tag,
        text: (TYPE_ICON[entry.type]||'📄') + ' <b>' + esc(entry.title||'Reminder') + '</b>' + (entry.note? '\n'+esc(entry.note) : ''),
        chatIds: [OWNER_CHAT_ID],
        when: when.toISOString(),
        repeat: 'once',
        entryId: entry.id, owner: 'main',
        created: new Date().toISOString()
      });
    }
    await dbAPI('savePortfolio', {key:'tg_scheduled', data:{scheduled:list}});
  }

  async function cancelEntryReminder(entry){
    var tag = 'tg_travel_' + entry.id;
    var res = await dbAPI('getPortfolio', {key:'tg_scheduled'});
    var list = (res && res.ok && res.data && Array.isArray(res.data.scheduled)) ? res.data.scheduled : [];
    list = list.filter(function(m){ return m.id !== tag; });
    await dbAPI('savePortfolio', {key:'tg_scheduled', data:{scheduled:list}});
  }

  /* ---------- weather (Open-Meteo — free, no key).
     Inside the 16-day window we show the real forecast; beyond it we show what
     that city actually did on the same dates last year, labelled as such so the
     two are never confused. Cached per city+date on the trip. ---------- */
  var wxCache = {};
  async function geo(city){
    if(wxCache['geo_'+city]) return wxCache['geo_'+city];
    var r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(city));
    var j = await r.json();
    var hit = j && j.results && j.results[0];
    if(!hit) throw new Error('no geo');
    wxCache['geo_'+city] = {lat:hit.latitude, lon:hit.longitude};
    return wxCache['geo_'+city];
  }
  async function weatherFor(city, iso){
    var ck = city+'|'+iso;
    if(wxCache[ck]) return wxCache[ck];
    var g = await geo(city);
    var today = toISO(new Date());
    var daysOut = Math.round((fromISO(iso) - fromISO(today)) / 86400000);
    var out;
    if(daysOut >= 0 && daysOut <= 15){
      var r = await fetch('https://api.open-meteo.com/v1/forecast?latitude='+g.lat+'&longitude='+g.lon+
        '&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto&start_date='+iso+'&end_date='+iso);
      var j = await r.json();
      var d = j && j.daily;
      if(d && d.time && d.time.length) out = {kind:'forecast', hi:d.temperature_2m_max[0], lo:d.temperature_2m_min[0], rain:d.precipitation_sum[0]};
    }
    if(!out){
      var ly = (fromISO(iso).getFullYear()-1) + iso.slice(4);
      var r2 = await fetch('https://archive-api.open-meteo.com/v1/archive?latitude='+g.lat+'&longitude='+g.lon+
        '&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto&start_date='+ly+'&end_date='+ly);
      var j2 = await r2.json();
      var d2 = j2 && j2.daily;
      if(d2 && d2.time && d2.time.length) out = {kind:'lastyear', hi:d2.temperature_2m_max[0], lo:d2.temperature_2m_min[0], rain:d2.precipitation_sum[0]};
    }
    if(!out) throw new Error('no wx');
    wxCache[ck] = out;
    return out;
  }
  function wxText(w){
    if(w.hi==null) return '';
    var t = Math.round(w.lo)+'–'+Math.round(w.hi)+'°C';
    if(w.rain > 1) t += ' · rain '+w.rain.toFixed(1)+'mm';
    return (w.kind==='forecast' ? '🌤 Forecast ' : '🗓 Last year ') + t;
  }
  function paintWeather(){
    Array.prototype.forEach.call(document.querySelectorAll('.wx'), function(el){
      var city = el.getAttribute('data-city'), iso = el.getAttribute('data-iso');
      if(!city || city==='—') return;
      weatherFor(city, iso).then(function(w){ el.textContent = wxText(w); })
        .catch(function(){ el.textContent = ''; });
    });
  }

  async function analyseVaultItem(v){
    var isPdf = (v.mime||'').indexOf('pdf') !== -1;
    var prompt = 'This is a travel research screenshot or document (a fare search, booking, hotel listing or similar). '+
      'Return ONLY valid JSON, no markdown, with keys: title (short, e.g. "Milan→Luxor Neos ₹22,362"), '+
      'summary (one or two plain sentences of the key facts: route, dates, airline/hotel, price, any conditions), '+
      'tags (array of short lowercase strings: cities, airlines, "flight"/"hotel"/"train", month).';
    var txt = await claudeAPI(prompt, 'You extract travel booking details accurately. Return ONLY valid JSON.',
      isPdf ? '' : v.b64, isPdf ? '' : v.mime, isPdf ? v.b64 : '');
    var j = JSON.parse(String(txt).replace(/```json|```/g,'').trim());
    v.title = j.title || v.name; v.summary = j.summary || ''; v.tags = j.tags || [];
    delete v.b64; // keep the row small once it is read
  }

  async function addVaultFiles(files){
    files = Array.prototype.slice.call(files||[]);
    if(!files.length) return;
    var t = active(); t.vault = t.vault || [];
    var added = 0;
    for(var i=0;i<files.length;i++){
      var f = files[i];
      flash('Uploading '+(i+1)+' of '+files.length+'…');
      try{
        var b64 = await new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){res(r.result);}; r.onerror=rej; r.readAsDataURL(f); });
        var resp = await dbAPI('uploadFile', {file:{name:f.name, type:f.type, data:b64}});
        var url = resp && (resp.url || resp.link || (resp.data && String(resp.data).indexOf('http')===0 ? resp.data : null));
        if(!url) throw new Error('upload failed');
        t.vault.unshift({id:uid(), name:f.name, url:url, mime:f.type,
          b64:String(b64).split(',')[1], added:fmt(toISO(new Date())), tags:[]});
        added++;
        renderVault(); // show them arriving one by one
      }catch(e){ flash('Failed: '+f.name); }
    }
    renderVault(); save();
    flash(added+' added to vault');
  }

  /* ---------- research vault ---------- */
  function renderVault(){
    var t = active();
    t.vault = t.vault || [];
    var q = (document.getElementById('vaultSearch').value||'').toLowerCase();
    var items = t.vault.filter(function(v){
      if(!q) return true;
      return ((v.name||'')+' '+(v.summary||'')+' '+(v.tags||[]).join(' ')).toLowerCase().indexOf(q) !== -1;
    });
    document.getElementById('vaultList').innerHTML = items.length ? items.map(function(v){
      return '<div class="card">' +
        '<div class="etitle">'+esc(v.title || v.name)+'</div>' +
        '<div class="emeta">'+esc(v.added||'')+(v.tags&&v.tags.length?' · '+esc(v.tags.join(', ')):'')+'</div>' +
        (v.summary ? '<div class="enote">'+esc(v.summary)+'</div>' : '') +
        '<div class="actions" style="margin-top:8px">' +
          '<a href="'+esc(v.url)+'" target="_blank" rel="noopener">📎 Open</a>' +
          (v.summary ? '' : '<button class="mini vanalyse" data-id="'+v.id+'">✨ Analyse</button>') +
          '<button class="rm vdel" data-id="'+v.id+'">Remove</button>' +
        '</div>' +
      '</div>';
    }).join('') : '<div class="empty">Nothing in the vault yet. Screenshots you add here stay searchable long after the chat is gone.</div>';

    Array.prototype.forEach.call(document.querySelectorAll('.vdel'), function(b){
      b.addEventListener('click', function(){
        active().vault = active().vault.filter(function(x){return x.id!==b.getAttribute('data-id')});
        renderVault(); save();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.vanalyse'), function(b){
      b.addEventListener('click', async function(){
        var v = active().vault.find(function(x){return x.id===b.getAttribute('data-id')});
        if(!v) return;
        b.disabled = true; b.textContent = 'Reading…';
        try{
          await analyseVaultItem(v);
          renderVault(); save(); flash('Analysed');
        }catch(e){
          b.disabled = false; b.textContent = '✨ Analyse';
          flash('Could not read that one');
        }
      });
    });
  }
  document.getElementById('vaultAnalyseAll').addEventListener('click', async function(){
    var btn = this;
    var pending = (active().vault||[]).filter(function(v){ return !v.summary && v.b64; });
    if(!pending.length){ flash('Nothing left to analyse'); return; }
    btn.disabled = true;
    var ok = 0;
    for(var i=0;i<pending.length;i++){
      flash('Reading '+(i+1)+' of '+pending.length+'…');
      try{ await analyseVaultItem(pending[i]); ok++; renderVault(); }catch(e){}
    }
    btn.disabled = false;
    save(); renderVault();
    flash(ok+' of '+pending.length+' analysed');
  });
  document.getElementById('vaultSearch').addEventListener('input', renderVault);
  document.getElementById('vaultFile').addEventListener('change', async function(){
    await addVaultFiles(this.files); this.value = '';
  });
  document.getElementById('vaultPhotos').addEventListener('change', async function(){
    await addVaultFiles(this.files); this.value = '';
  });

  /* ---------- packing ---------- */
  var PACK_SEED = [
    ['Documents','Passports (all 3) + photocopies'],['Documents','Schengen visa printout'],
    ['Documents','Egypt e-visa + Letter of Guarantee'],['Documents','Travel insurance certificate'],
    ['Documents','Flight tickets (77AXKM) + hotel confirmations'],['Documents','Forex card + backup card'],
    ['Clothes','Light layers — Europe mornings are cold, Egypt days are hot'],
    ['Clothes','1 warm jacket / fleece for Zürich'],['Clothes','Comfortable walking shoes (worn in)'],
    ['Clothes','Modest cover — shoulders & knees, for churches and mosques'],
    ['Clothes','Sun hat + sunglasses for Luxor/Cairo'],
    ['Loungewear','Sleepwear'],['Loungewear','Slippers / hotel flip-flops'],
    ['Tech','Phone + charger'],['Tech','Universal travel adapter (CH type J is its own shape)'],
    ['Tech','Power bank (in cabin bag, never checked)'],['Tech','Camera + spare card'],
    ['Health','Regular medicines + a spare few days'],['Health','Sunscreen SPF50'],
    ['Health','ORS sachets / electrolytes for Egypt'],['Health','Basic first aid + motion sickness tablets'],
    ['Misc','Refillable water bottle'],['Misc','Small daypack'],
    ['Misc','Small USD notes for Egypt tipping'],['Misc','Snacks — vegetarian options can be thin in transit']
  ];
  function renderPacking(){
    var t = active(); t.packing = t.packing || [];
    var done = t.packing.filter(function(p){return p.done}).length;
    document.getElementById('packCount').textContent = t.packing.length ? (done+' of '+t.packing.length+' packed') : '';
    var cats = {};
    t.packing.forEach(function(p){ (cats[p.cat]=cats[p.cat]||[]).push(p); });
    document.getElementById('packList').innerHTML = Object.keys(cats).length ? Object.keys(cats).map(function(c){
      return '<div class="card"><div class="dtitle" style="margin-bottom:8px">'+esc(c)+'</div>' +
        cats[c].map(function(p){
          return '<label class="remrow" style="display:flex;gap:8px;align-items:center;padding:3px 0">' +
            '<input type="checkbox" class="pchk" data-id="'+p.id+'"'+(p.done?' checked':'')+'>' +
            '<span style="flex:1'+(p.done?';opacity:.45;text-decoration:line-through':'')+'">'+esc(p.item)+'</span>' +
            '<button class="rm pdel" data-id="'+p.id+'">✕</button></label>';
        }).join('') + '</div>';
    }).join('') : '<div class="empty">No packing list yet — tap “Load suggested list” above.</div>';

    Array.prototype.forEach.call(document.querySelectorAll('.pchk'), function(c){
      c.addEventListener('change', function(){
        var p = active().packing.find(function(x){return x.id===c.getAttribute('data-id')});
        if(p){ p.done = c.checked; renderPacking(); save(); }
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.pdel'), function(b){
      b.addEventListener('click', function(){
        active().packing = active().packing.filter(function(x){return x.id!==b.getAttribute('data-id')});
        renderPacking(); save();
      });
    });
  }
  document.getElementById('packAdd').addEventListener('click', function(){
    var inp = document.getElementById('packNew'), v = inp.value.trim();
    if(!v) return;
    var t = active(); t.packing = t.packing || [];
    t.packing.push({id:uid(), item:v, cat:document.getElementById('packCat').value, done:false});
    inp.value=''; renderPacking(); save();
  });
  document.getElementById('packSeed').addEventListener('click', function(){
    var t = active(); t.packing = t.packing || [];
    var have = t.packing.map(function(p){return p.item});
    PACK_SEED.forEach(function(row){
      if(have.indexOf(row[1])===-1) t.packing.push({id:uid(), cat:row[0], item:row[1], done:false});
    });
    renderPacking(); save(); flash('List loaded');
  });

  /* ---------- expenses ---------- */
  var RATES = {INR:1, CHF:106, EUR:99, USD:88, EGP:1.85}; // rough, editable
  function renderMoney(){
    var t = active(); t.expenses = t.expenses || [];
    var days = [];
    var cur = t.start, end = tripEnd(t);
    while(cur <= end){ days.push(cur); cur = addDays(cur,1); }
    var sel = document.getElementById('expDay');
    if(sel.options.length !== days.length){
      sel.innerHTML = days.map(function(d){ return '<option value="'+d+'">'+fmt(d)+' · '+esc(cityForDay(t,d))+'</option>'; }).join('');
    }
    var total = t.expenses.reduce(function(a,e){ return a + (e.amt * (RATES[e.cur]||1)); }, 0);
    var byCity = {};
    t.expenses.forEach(function(e){
      var c = cityForDay(t, e.day) || '—';
      byCity[c] = (byCity[c]||0) + e.amt * (RATES[e.cur]||1);
    });
    document.getElementById('expTotal').innerHTML =
      '<b>Trip total ≈ ₹'+Math.round(total).toLocaleString('en-IN')+'</b>' +
      (Object.keys(byCity).length ? '<br>' + Object.keys(byCity).map(function(c){
        return esc(c)+' ₹'+Math.round(byCity[c]).toLocaleString('en-IN');
      }).join(' · ') : '');

    var grouped = {};
    t.expenses.forEach(function(e){ (grouped[e.day]=grouped[e.day]||[]).push(e); });
    document.getElementById('expList').innerHTML = Object.keys(grouped).sort().map(function(d){
      var dayTotal = grouped[d].reduce(function(a,e){ return a + e.amt*(RATES[e.cur]||1); },0);
      return '<div class="card">' +
        '<div class="dhead"><div class="dtitle">'+fmt(d)+' · '+esc(cityForDay(t,d))+'</div>' +
        '<div class="dcity">₹'+Math.round(dayTotal).toLocaleString('en-IN')+'</div></div>' +
        grouped[d].map(function(e){
          return '<div class="entry"><div class="ebody">' +
            '<div class="etitle">'+esc(e.what)+'</div>' +
            '<div class="emeta">'+esc(e.cat)+' · '+e.cur+' '+e.amt+(e.cur!=='INR'?' ≈ ₹'+Math.round(e.amt*(RATES[e.cur]||1)).toLocaleString('en-IN'):'')+'</div>' +
            '</div><button class="edel xdel" data-id="'+e.id+'">✕</button></div>';
        }).join('') + '</div>';
    }).join('') || '<div class="empty">No expenses logged yet.</div>';

    Array.prototype.forEach.call(document.querySelectorAll('.xdel'), function(b){
      b.addEventListener('click', function(){
        active().expenses = active().expenses.filter(function(x){return x.id!==b.getAttribute('data-id')});
        renderMoney(); save();
      });
    });
  }
  document.getElementById('expAdd').addEventListener('click', function(){
    var what = document.getElementById('expWhat'), amt = document.getElementById('expAmt');
    if(!what.value.trim() || !amt.value) { what.focus(); return; }
    var t = active(); t.expenses = t.expenses || [];
    t.expenses.push({id:uid(), day:document.getElementById('expDay').value,
      cat:document.getElementById('expCat').value, what:what.value.trim(),
      amt:parseFloat(amt.value)||0, cur:document.getElementById('expCur').value});
    what.value=''; amt.value='';
    renderMoney(); save();
  });

  function renderAll(){
    renderTripSel();
    renderBoard();
    if(tab==='binder') renderBinder();
    if(tab==='vault') renderVault();
    if(tab==='packing') renderPacking();
    if(tab==='money') renderMoney();
  }

  boot();
})();
</script>
</body>
</html>
