<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0E7">
<title>Travel Desk · RK Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0E7;
  --paper-2:#F7F8F2;
  --ink:#13262C;
  --ink-soft:#4A5B5F;
  --rule:#C3CCBD;
  --stamp:#A93226;
  --go:#1E6B5C;
  --shadow:0 1px 0 rgba(19,38,44,.10), 0 8px 24px -18px rgba(19,38,44,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Karla',system-ui,sans-serif;color:var(--ink);background:var(--paper);
  padding:18px 14px calc(56px + env(safe-area-inset-bottom));line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
input,select,textarea,button{font-size:16px;font-family:inherit}
*:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto}

.back{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);text-decoration:none;display:inline-block;margin-bottom:14px}
.back:hover{color:var(--ink)}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.head h1{font-family:'Newsreader',serif;font-weight:500;font-size:30px;margin:0;letter-spacing:-.01em}
.head .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:4px}

.tripbar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.tripbar select{flex:1;min-width:140px;padding:9px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--paper-2);color:var(--ink)}
.iconbtn{border:1px solid var(--rule);background:var(--paper-2);color:var(--ink);border-radius:3px;padding:9px 12px;cursor:pointer}
.iconbtn:hover{border-color:var(--ink-soft)}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);margin-bottom:18px}
.tab{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:10px 4px;margin-right:22px;border:none;background:none;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--stamp)}

.card{background:var(--paper-2);border:1px solid var(--rule);border-radius:5px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:4px}
input[type=date],input[type=text],input[type=time],select,textarea{
  width:100%;padding:9px 10px;border:1px solid var(--rule);border-radius:3px;background:#fff;color:var(--ink);
}
textarea{resize:vertical;min-height:44px;font-family:inherit}

/* ---- Board ---- */
.sector{position:relative;padding-left:20px}
.sector::before{content:"";position:absolute;left:6px;top:6px;bottom:-14px;width:1px;background:var(--rule)}
.sector:last-child::before{display:none}
.sector::after{content:"";position:absolute;left:2px;top:2px;width:9px;height:9px;border-radius:50%;background:var(--go)}
.sector .city{font-family:'Newsreader',serif;font-size:21px;font-weight:500}
.sector .dates{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin:2px 0 10px}
.grid2{display:grid;grid-template-columns:1fr 90px;gap:8px;margin-bottom:10px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
.actions a,.actions button{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.04em;text-decoration:none;
  border:1px solid var(--rule);border-radius:3px;padding:7px 10px;color:var(--ink);background:#fff;cursor:pointer;
}
.actions a:hover,.actions button:hover{border-color:var(--ink-soft)}
.rm{margin-left:auto;color:var(--stamp)!important;border-color:transparent!important;background:none!important}
.addsector{width:100%;padding:11px;border:1px dashed var(--rule);border-radius:4px;background:none;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-top:6px}
.addsector:hover{border-color:var(--ink-soft);color:var(--ink)}
.homefly{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:6px;padding-left:20px}

/* ---- Binder ---- */
.day{margin-bottom:14px}
.day .dhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:6px;margin-bottom:10px}
.day .dhead .dtitle{font-family:'Newsreader',serif;font-size:19px}
.day .dhead .dcity{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em}
.entry{display:flex;gap:10px;padding:9px 0;border-bottom:1px dotted var(--rule)}
.entry:last-of-type{border-bottom:none}
.entry .etype{font-size:17px;flex:none;width:22px;text-align:center}
.entry .ebody{flex:1;min-width:0}
.entry .etitle{font-weight:700;font-size:14px}
.entry .emeta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);margin-top:2px}
.entry .enote{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.entry .edel{flex:none;background:none;border:none;color:var(--stamp);cursor:pointer;font-size:16px;padding:0 2px}
.entry .ebell{flex:none;background:none;border:none;cursor:pointer;font-size:16px;padding:0 6px;opacity:1}
.entry .ebell[disabled]{opacity:.3;cursor:default}
.addentry label.remrow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);margin-bottom:8px}
.addentry .remrow input[type=checkbox]{width:auto}
.addentry .remrow input[type=number]{width:64px;padding:6px 8px}
.addentry{border:1px dashed var(--rule);border-radius:4px;padding:10px;margin-top:4px}
.addentry .row{margin-bottom:8px}
.addentry .row:last-child{margin-bottom:0}
.f-type{width:118px;flex:none}
.f-time{width:96px;flex:none}
.f-title{flex:2;min-width:130px}
.f-ref{flex:1;min-width:110px}
.mini{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:3px;padding:8px 14px;cursor:pointer}
.empty{font-size:12.5px;color:var(--ink-soft);font-style:italic;padding:4px 0}

.toolbar{display:flex;justify-content:flex-end;margin-bottom:10px}
.saved{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--go);height:14px;text-align:right;margin-top:-4px;margin-bottom:8px}

@media print{
  body{background:#fff;padding:0}
  .back,.tripbar,.tabs,.addsector,.actions,.addentry,.toolbar,.edel{display:none!important}
  .card{box-shadow:none;border:none;padding:0;margin-bottom:22px}
  #board{display:none!important}
  .day .dhead{border-bottom:1px solid #000}
}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Tracker</a>
  <div class="head">
    <div>
      <h1>Travel Desk</h1>
      <div class="sub">board · booking links · trip binder</div>
    </div>
  </div>

  <div class="tripbar">
    <select id="tripSel"></select>
    <button class="iconbtn" id="btnNew" title="New trip">+ New</button>
    <button class="iconbtn" id="btnDup" title="Duplicate trip">⧉</button>
    <button class="iconbtn" id="btnDel" title="Delete trip">🗑</button>
    <button class="iconbtn" id="btnReload" title="Reload the latest itinerary into this trip">↻ Latest</button>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="board">Board</button>
    <button class="tab" data-tab="binder">Binder</button>
  </div>
  <div class="saved" id="saved"></div>

  <div id="board">
    <div class="card">
      <div class="row">
        <div style="flex:1;min-width:140px">
          <label class="f">Departs</label>
          <input type="date" id="tripStart">
        </div>
        <div style="flex:1;min-width:140px">
          <label class="f">Travellers</label>
          <input type="text" id="tripPax" placeholder="3">
        </div>
      </div>
    </div>
    <div id="sectors"></div>
    <button class="addsector" id="btnAddSector">+ Add a place</button>
    <div class="homefly" id="homefly"></div>
  </div>

  <div id="binder" style="display:none">
    <div class="toolbar"><button class="iconbtn" id="btnPrint">🖨 Print binder</button></div>
    <div id="days"></div>
  </div>
</div>

<script>
(function(){
  var KEY = 'rk_travel_desk_v1';
  var trips = {};
  var activeId = null;
  var tab = 'board';

  function uid(){ return 't' + Math.random().toString(36).slice(2,9); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function pad(n){ return n<10?'0'+n:''+n; }
  function toISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function fromISO(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function addDays(iso, n){ var d=fromISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
  function fmt(iso){
    var d=fromISO(iso);
    var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var mons=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return days[d.getDay()]+' '+d.getDate()+' '+mons[d.getMonth()];
  }

  function defaultTrip(name){
    return {
      id: uid(), name: name || 'Switzerland & Italy 2026',
      start: '2026-09-25', pax: '3',
      sectors: [
        {id:uid(), city:'Zürich',   nights:1, mode:'flight'},
        {id:uid(), city:'Venice',   nights:2, mode:'train'},
        {id:uid(), city:'Rome',     nights:3, mode:'train'},
        {id:uid(), city:'Sorrento', nights:2, mode:'train'}
      ],
      homeCity:'Bengaluru',
      binder: seedBinder()
    };
  }

  // The real, currently-booked plan — carried over from the itinerary already
  // worked out on the day it was planned, not re-guessed. Times are as
  // researched; anything not yet ticketed says so rather than inventing one.
  function seedBinder(){
    const e = (type,time,title,ref,note,remindMin) => {
      var o = {id:uid(),type,time,title,ref:ref||'',note:note||''};
      if(remindMin!=null && time){ o.remind = true; o.remindMin = remindMin; }
      return o;
    };
    return {
      '2026-09-25': [
        e('flight','10:00','Etihad BLR → Abu Dhabi → Zürich','','Round-trip fare, ₹1,26,526 total for 3 — covers the return leg too. Lands ZRH 18:55.', 180),
        e('taxi','19:10','Airport train to Zürich HB, then walk to hotel','','13 min train + 8 min walk. Hotel Alexander, Niederdorf — ask for a triple room.')
      ],
      '2026-09-26': [
        e('train','09:09','EuroCity Zürich HB → Milano Centrale','','Arrive 12:50. Change ~75 min in Milan.', 45),
        e('train','14:05','Frecciarossa Milano Centrale → Venezia S. Lucia','','Arrive 16:22. Vaporetto Line 1 or 2 to Hotel Antico Trovatore, San Marco.')
      ],
      '2026-09-27': [
        e('activity','09:30','Basilica di San Marco',''),
        e('activity','11:00','Doge\u2019s Palace — timed entry',''),
        e('activity','14:00','Rialto + Murano via Vaporetto Line 12','','Sightseeing tickets ~\u20B924,000 total for 3.')
      ],
      '2026-09-28': [
        e('train','09:25','Frecciarossa Venezia S. Lucia → Roma Termini (direct)','','Arrive 13:12. Yes Hotel — 2 min walk from the Via Marsala exit.', 45)
      ],
      '2026-09-29': [
        e('activity','08:30','Colosseum — timed entry','','Metro B, Termini→Colosseo, 2 stops. Forum + Palatine on the same ticket.')
      ],
      '2026-09-30': [
        e('activity','08:00','Vatican Museums','','Metro A, Termini→Ottaviano. Allow 3 hours, then St Peter\u2019s. Tickets ~\u20B921,600 total.')
      ],
      '2026-10-01': [
        e('train','09:00','Frecciarossa Roma Termini → Napoli Centrale','','Arrive 10:10.', 45),
        e('train','10:40','Campania Express Napoli Centrale → Sorrento','','Arrive 11:45. Hotel Plaza — 3 min from the station.')
      ],
      '2026-10-02': [
        e('activity','09:00','Circumvesuviana to Pompei Scavi','','30 min ride, site opens 09:00, allow 3 hours. Capri ferry (25 min from Marina Piccola) is optional — two nights covers one or the other, not both comfortably.')
      ],
      '2026-10-03': [
        e('taxi','06:30','Curreri coach: Sorrento Piazza Tasso → Naples Capodichino','','Arrives 07:50. Tightest morning of the trip — leave the hotel by 06:15.', 45),
        e('flight','09:45','Naples → Zürich (easyJet/SWISS)','','Arrive ZRH 11:35. Separate ticket from the Etihad leg — leave at least 4 hours at Zürich for the connection.', 150),
        e('flight','','Zürich → Abu Dhabi → BLR (Etihad)','','Departure time not yet confirmed on the ticket — check and update once booked.')
      ]
    };
  }

  function computeDates(trip){
    var out = []; var cur = trip.start;
    trip.sectors.forEach(function(s){
      var arr = cur, dep = addDays(cur, Number(s.nights)||0);
      out.push({sector:s, arrive:arr, depart:dep});
      cur = dep;
    });
    return out;
  }
  function tripEnd(trip){ var c=computeDates(trip); return c.length?c[c.length-1].depart:trip.start; }

  /* ---------- links ---------- */
  function flightLink(from, to, date){
    return 'https://www.google.com/travel/flights?q=' + encodeURIComponent('Flights from '+from+' to '+to+' on '+date);
  }
  function trainLink(from, to, date){
    return 'https://www.google.com/search?q=' + encodeURIComponent(from+' to '+to+' train tickets '+date);
  }
  function hotelLink(city, checkin, checkout, pax){
    var p = new URLSearchParams({ss:city, checkin:checkin, checkout:checkout, group_adults:pax||'2', no_rooms:'1', group_children:'0'});
    return 'https://www.booking.com/searchresults.html?' + p.toString();
  }
  function taxiLink(city){
    return 'https://m.uber.com/ul/?action=setPickup&dropoff%5Bformatted_address%5D=' + encodeURIComponent(city);
  }

  /* ---------- persistence ---------- */
  var saveTimer;
  function flash(msg){
    var el = document.getElementById('saved');
    el.textContent = msg;
    clearTimeout(flash._t);
    flash._t = setTimeout(function(){ el.textContent=''; }, 2200);
  }
  function save(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try{
        localStorage.setItem(KEY, JSON.stringify({active:activeId, trips:trips}));
        flash('Saved');
      }catch(e){ flash('Could not save on this device'); }
    }, 250);
  }
  function boot(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var data = JSON.parse(raw);
        if(data && data.trips && Object.keys(data.trips).length){
          trips = data.trips; activeId = data.active;
        }
      }
    }catch(e){}
    if(!activeId || !trips[activeId]){
      var t = defaultTrip();
      trips[t.id] = t; activeId = t.id;
    }
  }

  function active(){ return trips[activeId]; }

  /* ---------- trip switcher ---------- */
  function renderTripSel(){
    var sel = document.getElementById('tripSel');
    sel.innerHTML = Object.keys(trips).map(function(id){
      return '<option value="'+id+'"'+(id===activeId?' selected':'')+'>'+esc(trips[id].name)+'</option>';
    }).join('');
  }
  document.getElementById('tripSel').addEventListener('change', function(e){
    activeId = e.target.value; renderAll(); save();
  });
  document.getElementById('btnNew').addEventListener('click', function(){
    var name = prompt('Name this trip:', 'New trip'); if(!name) return;
    var t = defaultTrip(name); t.sectors = [{id:uid(), city:'', nights:1, mode:'flight'}];
    trips[t.id]=t; activeId=t.id; renderAll(); save();
  });
  document.getElementById('btnDup').addEventListener('click', function(){
    var t = JSON.parse(JSON.stringify(active())); t.id = uid(); t.name = t.name + ' (copy)';
    trips[t.id]=t; activeId=t.id; renderAll(); save();
  });
  document.getElementById('btnDel').addEventListener('click', function(){
    var ids = Object.keys(trips); if(ids.length<2){ flash('Keep at least one trip'); return; }
    if(!confirm('Delete "'+active().name+'"? This cannot be undone.')) return;
    delete trips[activeId]; activeId = Object.keys(trips)[0]; renderAll(); save();
  });
  document.getElementById('btnReload').addEventListener('click', function(){
    if(!confirm('Replace this trip\'s dates and day-by-day plan with the latest version? Anything you typed in yourself will be lost.')) return;
    var fresh = defaultTrip(active().name);
    fresh.id = activeId;
    trips[activeId] = fresh;
    renderAll(); save();
    Object.keys(fresh.binder).forEach(function(iso){
      fresh.binder[iso].forEach(function(entry){ if(entry.remind) syncEntryReminder(iso, entry); });
    });
    flash('Reloaded');
  });

  /* ---------- tabs ---------- */
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(btn){
    btn.addEventListener('click', function(){
      tab = btn.getAttribute('data-tab');
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){ b.classList.toggle('on', b===btn); });
      document.getElementById('board').style.display = tab==='board' ? '' : 'none';
      document.getElementById('binder').style.display = tab==='binder' ? '' : 'none';
      if(tab==='binder') renderBinder();
    });
  });
  document.getElementById('btnPrint').addEventListener('click', function(){ window.print(); });

  /* ---------- board render ---------- */
  document.getElementById('tripStart').addEventListener('change', function(e){
    active().start = e.target.value; renderBoard(); save();
  });
  document.getElementById('tripPax').addEventListener('input', function(e){
    active().pax = e.target.value; save();
  });
  document.getElementById('btnAddSector').addEventListener('click', function(){
    active().sectors.push({id:uid(), city:'', nights:1, mode:'train'});
    renderBoard(); save();
  });

  function renderBoard(){
    var t = active();
    document.getElementById('tripStart').value = t.start;
    document.getElementById('tripPax').value = t.pax || '';
    var rows = computeDates(t);
    var prevCity = t.homeCity || 'home';
    var html = rows.map(function(r, i){
      var s = r.sector;
      var modeIcon = s.mode==='flight' ? '✈️' : (s.mode==='train' ? '🚆' : '🚌');
      var block =
        '<div class="sector" data-id="'+s.id+'">' +
          '<div class="grid2">' +
            '<div><label class="f">City</label><input type="text" class="in-city" value="'+esc(s.city)+'" placeholder="City"></div>' +
            '<div><label class="f">Nights</label><input type="text" class="in-nights" inputmode="numeric" value="'+esc(s.nights)+'"></div>' +
          '</div>' +
          '<div class="row" style="margin-bottom:8px">' +
            '<div style="flex:1;min-width:120px"><label class="f">Arrive by</label>' +
              '<select class="in-mode"><option value="flight"'+(s.mode==='flight'?' selected':'')+'>✈️ Flight</option><option value="train"'+(s.mode==='train'?' selected':'')+'>🚆 Train</option><option value="bus"'+(s.mode==='bus'?' selected':'')+'>🚌 Bus/ferry</option></select>' +
            '</div>' +
          '</div>' +
          '<div class="dates">'+ modeIcon +' arrive '+fmt(r.arrive)+' · depart '+fmt(r.depart)+'</div>' +
          '<div class="actions">' +
            '<a target="_blank" rel="noopener" href="'+flightLink(prevCity, s.city||'city', r.arrive)+'">✈️ Flights</a>' +
            '<a target="_blank" rel="noopener" href="'+trainLink(prevCity, s.city||'city', r.arrive)+'">🚆 Trains</a>' +
            '<a target="_blank" rel="noopener" href="'+hotelLink(s.city||'city', r.arrive, r.depart, t.pax)+'">🏨 Hotel</a>' +
            '<a target="_blank" rel="noopener" href="'+taxiLink(s.city||'city')+'">🚕 Taxi</a>' +
            '<button class="rm" data-rm="'+s.id+'">Remove</button>' +
          '</div>' +
        '</div>';
      prevCity = s.city || prevCity;
      return block;
    }).join('');
    document.getElementById('sectors').innerHTML = html;

    var end = tripEnd(t);
    document.getElementById('homefly').innerHTML =
      '↳ fly home to '+esc(t.homeCity||'—')+' on '+fmt(end)+' — ' +
      '<a href="'+flightLink(prevCity, t.homeCity||'home', end)+'" target="_blank" rel="noopener" style="color:var(--ink-soft)">search flights</a>';

    Array.prototype.forEach.call(document.querySelectorAll('.in-city'), function(inp){
      inp.addEventListener('input', function(){
        var id = inp.closest('.sector').dataset.id;
        var s = t.sectors.find(function(x){return x.id===id});
        s.city = inp.value; renderBoard(); save();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.in-nights'), function(inp){
      inp.addEventListener('change', function(){
        var id = inp.closest('.sector').dataset.id;
        var s = t.sectors.find(function(x){return x.id===id});
        s.nights = Math.max(0, parseInt(inp.value,10)||0); renderBoard(); save();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.in-mode'), function(sel){
      sel.addEventListener('change', function(){
        var id = sel.closest('.sector').dataset.id;
        var s = t.sectors.find(function(x){return x.id===id});
        s.mode = sel.value; renderBoard(); save();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-rm]'), function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-rm');
        t.sectors = t.sectors.filter(function(x){return x.id!==id});
        renderBoard(); save();
      });
    });
  }

  /* ---------- Telegram reminders (shared queue with the main tracker) ---------- */
  // Same bot, same Netlify function, same owner chat — this just adds travel
  // entries into the queue the tracker already polls every 5 minutes. Tagged
  // tg_travel_<entryId> so it can never touch an Orders reminder.
  var OWNER_CHAT_ID = "8632288596";
  var DEFAULT_LEAD = {flight:180, train:45, taxi:15, activity:30, hotel:30, other:30};

  async function dbAPI(action, extra){
    try{
      var r = await fetch('/.netlify/functions/db', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(Object.assign({action:action, user:'main'}, extra||{}))
      });
      return await r.json();
    }catch(e){ return {ok:false, error:String(e)}; }
  }

  async function syncEntryReminder(dateISO, entry){
    var tag = 'tg_travel_' + entry.id;
    var res = await dbAPI('getPortfolio', {key:'tg_scheduled'});
    var list = (res && res.ok && res.data && Array.isArray(res.data.scheduled)) ? res.data.scheduled : [];
    list = list.filter(function(m){ return m.id !== tag; });

    if(entry.remind && entry.time){
      var when = fromISO(dateISO);
      var parts = entry.time.split(':');
      when.setHours(parseInt(parts[0],10)||0, parseInt(parts[1],10)||0, 0, 0);
      when.setMinutes(when.getMinutes() - (Number(entry.remindMin)||0));
      list.push({
        id: tag,
        text: (TYPE_ICON[entry.type]||'📄') + ' <b>' + esc(entry.title||'Reminder') + '</b>' + (entry.note? '\n'+esc(entry.note) : ''),
        chatIds: [OWNER_CHAT_ID],
        when: when.toISOString(),
        repeat: 'once',
        entryId: entry.id, owner: 'main',
        created: new Date().toISOString()
      });
    }
    await dbAPI('savePortfolio', {key:'tg_scheduled', data:{scheduled:list}});
  }

  async function cancelEntryReminder(entry){
    var tag = 'tg_travel_' + entry.id;
    var res = await dbAPI('getPortfolio', {key:'tg_scheduled'});
    var list = (res && res.ok && res.data && Array.isArray(res.data.scheduled)) ? res.data.scheduled : [];
    list = list.filter(function(m){ return m.id !== tag; });
    await dbAPI('savePortfolio', {key:'tg_scheduled', data:{scheduled:list}});
  }

  /* ---------- binder render ---------- */
  var TYPE_ICON = {flight:'✈️', train:'🚆', hotel:'🏨', taxi:'🚕', activity:'📍', other:'📄'};

  function cityForDay(t, iso){
    var rows = computeDates(t);
    for(var i=0;i<rows.length;i++){
      if(iso >= rows[i].arrive && iso < rows[i].depart) return rows[i].sector.city || '—';
    }
    if(rows.length && iso === rows[rows.length-1].depart) return t.homeCity || '—';
    return '—';
  }

  function renderBinder(){
    var t = active();
    var start = t.start, end = tripEnd(t);
    var days = []; var cur = start;
    while(cur <= end){ days.push(cur); cur = addDays(cur,1); }

    var html = days.map(function(iso){
      var entries = (t.binder[iso] || []).slice().sort(function(a,b){ return (a.time||'').localeCompare(b.time||''); });
      var entryHtml = entries.length ? entries.map(function(e){
        var bellOn = !!e.remind;
        var bellTitle = e.time ? (bellOn ? (e.remindMin||0)+' min before, via Telegram — tap to turn off' : 'Remind me before this, via Telegram') : 'Add a time first to set a reminder';
        return '<div class="entry">' +
          '<div class="etype">'+ (TYPE_ICON[e.type]||'📄') +'</div>' +
          '<div class="ebody">' +
            '<div class="etitle">'+esc(e.title||'Untitled')+'</div>' +
            '<div class="emeta">'+ (e.time?esc(e.time)+' · ':'') + (e.ref?'Ref '+esc(e.ref):'') +'</div>' +
            (e.note?'<div class="enote">'+esc(e.note)+'</div>':'') +
            (bellOn ? '<div class="enote" style="color:var(--go)">🔔 Telegram '+ (e.remindMin||0) +' min before</div>' : '') +
          '</div>' +
          '<button class="ebell" data-day="'+iso+'" data-eid="'+e.id+'" title="'+esc(bellTitle)+'" '+(e.time?'':'disabled')+'>'+(bellOn?'🔔':'🔕')+'</button>' +
          '<button class="edel" data-day="'+iso+'" data-eid="'+e.id+'">✕</button>' +
        '</div>';
      }).join('') : '<div class="empty">Nothing added yet.</div>';

      return '<div class="card day" data-day="'+iso+'">' +
        '<div class="dhead"><div class="dtitle">'+fmt(iso)+'</div><div class="dcity">'+esc(cityForDay(t,iso))+'</div></div>' +
        entryHtml +
        '<div class="addentry">' +
          '<div class="row">' +
            '<select class="f-type ae-type"><option value="flight">✈️ Flight</option><option value="train">🚆 Train</option><option value="hotel">🏨 Hotel</option><option value="taxi">🚕 Taxi/transfer</option><option value="activity">📍 Activity</option><option value="other">📄 Other</option></select>' +
            '<input type="time" class="f-time ae-time">' +
          '</div>' +
          '<div class="row">' +
            '<input type="text" class="f-title ae-title" placeholder="e.g. Frecciarossa to Venice">' +
            '<input type="text" class="f-ref ae-ref" placeholder="Confirmation / PNR">' +
          '</div>' +
          '<div class="row"><textarea class="ae-note" placeholder="Address, notes…"></textarea></div>' +
          '<label class="remrow"><input type="checkbox" class="ae-remind"> 🔔 Remind me <input type="number" class="ae-remindmin" value="30" min="0"> min before (Telegram)</label>' +
          '<button class="mini ae-add">Add to '+fmt(iso).split(' ').slice(0,2).join(' ')+'</button>' +
        '</div>' +
      '</div>';
    }).join('');
    document.getElementById('days').innerHTML = html || '<div class="empty">Set a departure date on the Board tab first.</div>';

    Array.prototype.forEach.call(document.querySelectorAll('.edel'), function(btn){
      btn.addEventListener('click', function(){
        var day = btn.getAttribute('data-day'), eid = btn.getAttribute('data-eid');
        var doomed = (t.binder[day]||[]).find(function(e){return e.id===eid});
        t.binder[day] = (t.binder[day]||[]).filter(function(e){return e.id!==eid});
        renderBinder(); save();
        if(doomed && doomed.remind) cancelEntryReminder(doomed);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.ebell'), function(btn){
      if(btn.disabled) return;
      btn.addEventListener('click', function(){
        var day = btn.getAttribute('data-day'), eid = btn.getAttribute('data-eid');
        var entry = (t.binder[day]||[]).find(function(e){return e.id===eid});
        if(!entry) return;
        if(entry.remind){
          entry.remind = false;
          renderBinder(); save();
          cancelEntryReminder(entry);
        } else {
          var def = DEFAULT_LEAD[entry.type] || 30;
          var mins = prompt('Remind how many minutes before '+(entry.time||'this')+'?', def);
          if(mins===null) return;
          entry.remind = true; entry.remindMin = Math.max(0, parseInt(mins,10)||0);
          renderBinder(); save();
          syncEntryReminder(day, entry);
        }
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.day'), function(dayEl){
      var iso = dayEl.getAttribute('data-day');
      var typeSel = dayEl.querySelector('.ae-type');
      var minInp = dayEl.querySelector('.ae-remindmin');
      typeSel.addEventListener('change', function(){ minInp.value = DEFAULT_LEAD[typeSel.value] || 30; });
      var btn = dayEl.querySelector('.ae-add');
      btn.addEventListener('click', function(){
        var title = dayEl.querySelector('.ae-title').value.trim();
        if(!title){ dayEl.querySelector('.ae-title').focus(); return; }
        var wantsRemind = dayEl.querySelector('.ae-remind').checked;
        var time = dayEl.querySelector('.ae-time').value;
        var entry = {
          id: uid(),
          type: typeSel.value,
          time: time,
          title: title,
          ref: dayEl.querySelector('.ae-ref').value.trim(),
          note: dayEl.querySelector('.ae-note').value.trim(),
          remind: wantsRemind && !!time,
          remindMin: Math.max(0, parseInt(minInp.value,10)||0)
        };
        t.binder[iso] = t.binder[iso] || [];
        t.binder[iso].push(entry);
        renderBinder(); save();
        if(entry.remind) syncEntryReminder(iso, entry);
      });
    });
  }

  function renderAll(){
    renderTripSel();
    renderBoard();
    if(tab==='binder') renderBinder();
  }

  boot();
  renderAll();
})();
</script>
</body>
</html>
