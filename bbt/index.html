<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>BBT · Zerodha login</title>
<style>
  :root{--bg:#f5f7fa;--card:#fff;--ink:#14202b;--muted:#5d6b78;--line:#dde3ea;--accent:#1f6feb;--ok:#1f9d55;--warn:#b54708;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1418;--card:#182028;--ink:#e8edf2;--muted:#9aa7b3;--line:#2a3540;--accent:#4c8dff;--ok:#3cc47a;--warn:#f0a35e;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:560px;margin:0 auto 14px}
  h1{font-size:20px;margin:0 0 6px}
  .muted{color:var(--muted);font-size:14px}
  .tok{font:600 17px/1.4 ui-monospace,Menlo,monospace;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}
  .btn{display:block;width:100%;border:0;border-radius:10px;padding:14px;font:600 16px inherit;background:var(--accent);color:#fff;margin-top:10px;text-align:center;text-decoration:none;cursor:pointer}
  .btn.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink)}
  .ok{color:var(--ok);font-weight:600}.warn{color:var(--warn);font-weight:600}
</style>
</head>
<body>
<div class="card" id="main"></div>
<div class="card">
  <h1 style="font-size:16px">Settings (this phone only)</h1>
  <label class="muted">BBT API key (not the secret)</label>
  <input id="key" autocomplete="off" placeholder="paste API key">
  <label class="muted" style="display:block;margin-top:10px">Friend's WhatsApp number (with country code, e.g. 919845012345)</label>
  <input id="wa" inputmode="tel" autocomplete="off" placeholder="optional">
  <button class="btn alt" id="save">Save</button>
  <div class="muted" style="margin-top:10px">Never enter the API secret or your Zerodha password here.</div>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  var get=function(k){try{return localStorage.getItem(k)||"";}catch(e){return "";}};
  var set=function(k,v){try{localStorage.setItem(k,v);}catch(e){}};
  var p=new URLSearchParams(location.search), tok=p.get("request_token"), status=p.get("status");
  var key=get("bbt_key"), wa=get("bbt_wa");
  $("key").value=key; $("wa").value=wa;
  $("save").onclick=function(){ set("bbt_key",$("key").value.trim()); set("bbt_wa",$("wa").value.replace(/\D/g,"")); location.href=location.pathname; };
  var loginUrl=key?"https://kite.zerodha.com/connect/login?api_key="+encodeURIComponent(key)+"&v=3":"";
  var h="";
  if(tok&&status!=="error"){
    var t=new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
    var msg="BBT request_token ("+t+"): "+tok;
    h='<h1 class="ok">✓ Logged in to Zerodha</h1><div class="muted">Today\'s request token — send it to BBT now. It works once and expires in a few minutes.</div>'+
      '<div class="tok" id="tok">'+tok.replace(/[^A-Za-z0-9]/g,"")+'</div>'+
      '<button class="btn" id="copy">Copy token</button>'+
      '<a class="btn alt" href="https://wa.me/'+(wa||"")+'?text='+encodeURIComponent(msg)+'">Send on WhatsApp</a>'+
      '<button class="btn alt" id="share">Share…</button>';
    $("main").innerHTML=h;
    $("copy").onclick=function(){ var b=this; (navigator.clipboard?navigator.clipboard.writeText(tok):Promise.reject()).then(function(){b.textContent="✓ Copied";},function(){ var r=document.createRange(); r.selectNodeContents($("tok")); var s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent="Selected — tap Copy"; }); };
    $("share").onclick=function(){ if(navigator.share) navigator.share({text:msg}); else $("copy").click(); };
  } else if(status==="error"||p.get("error")){
    $("main").innerHTML='<h1 class="warn">Login was not completed</h1><div class="muted">Zerodha did not return a token. Try again.</div>'+(loginUrl?'<a class="btn" href="'+loginUrl+'">Log in to Zerodha</a>':'');
  } else {
    $("main").innerHTML='<h1>BBT · Zerodha daily login</h1><div class="muted">Tap below each morning. After you log in, Zerodha brings you back here with the day\'s token to send to BBT.</div>'+
      (loginUrl?'<a class="btn" href="'+loginUrl+'">Log in to Zerodha</a>':'<div class="warn" style="margin-top:10px">Add the BBT API key in Settings below first.</div>');
  }
})();
</script>
</body>
</html>
