name: bb-lab
on:
  push:
    branches: [research]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: research }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q pandas numpy numba openpyxl pyarrow gdown
      - name: download data
        id: dl
        continue-on-error: true
        run: |
          mkdir -p /tmp/data out && cd /tmp/data
          ID=18KtQirmBkgixLznApjzUyNi8_1nXphZV
          echo start > $GITHUB_WORKSPACE/out/download_log.txt
          if true; then
            curl -sL -o symbols.zip "https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t" -w "curl http %{http_code} size %{size_download}\n" >> $GITHUB_WORKSPACE/out/download_log.txt
          fi
          ls -la >> $GITHUB_WORKSPACE/out/download_log.txt; file symbols.zip >> $GITHUB_WORKSPACE/out/download_log.txt
          python3 - >> $GITHUB_WORKSPACE/out/download_log.txt 2>&1 <<'PY'
import zipfile, itertools
z = zipfile.ZipFile('symbols.zip')
L = z.infolist(); print('entries', len(L), 'total_uncompressed_GB', round(sum(i.file_size for i in L)/1e9, 2))
for i in L[:15]: print(i.filename, i.file_size, i.compress_type)
with z.open(L[0]) as f:
    for line in itertools.islice(f, 8): print(line[:300])
z.extractall('x'); print('extracted ok')
PY
          du -sh x >> $GITHUB_WORKSPACE/out/download_log.txt
      - name: run job
        if: steps.dl.outcome == 'success'
        continue-on-error: true
        run: python lab_job.py /tmp/data/x out 2>&1 | tail -200 > out/run_tail.txt; exit ${PIPESTATUS[0]}
      - name: save results
        if: always()
        run: |
          git config user.name lab-bot; git config user.email lab@bot
          git add out; git commit -m "results $(date -u +%H%M)" || true
          git pull --rebase origin research || true
          git push origin HEAD:research
