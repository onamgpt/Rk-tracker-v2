[build]
  command = ""
  functions = "netlify/functions"

  [build.environment]
    # An Angel One MPIN is only four digits, so that exact run of digits turns
    # up by coincidence inside unrelated dependency files (caniuse region data,
    # a TypeScript scanner table). Netlify's secret scanner cannot tell those
    # apart from a real leak and fails the build. Nothing in this repo ever
    # writes the MPIN — angel.js reads it from process.env at request time —
    # so the scan is excluded for this one key only. Every other secret is
    # still scanned.
    SECRETS_SCAN_OMIT_KEYS = "ANGEL_PASSWORD"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# The whole application is one HTML file, so a cached copy means the user is
# running old code no matter how many times they reload. Never cache it.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

# Run the Telegram scheduler every 5 minutes
[functions."telegram-scheduler"]
  schedule = "*/5 * * * *"

# reorder-nudge-background declares its own schedule in the function file.
