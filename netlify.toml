[build]
  command = ""
  functions = "netlify/functions"

# Netlify's secrets scanner was failing the build on APPS_SCRIPT_ID.
# That value is a Google Apps Script *web app deployment URL* — an endpoint,
# not a credential. It is necessarily present in client-side index.html and is
# therefore public regardless. Excluding this one key only; every real
# credential (ANTHROPIC_API_KEY, GITHUB_TOKEN, GOOGLE_APPS_SCRIPT_REFRESH_TOKEN,
# Google_oauth_client_secret) remains scanned.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "APPS_SCRIPT_ID"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# The whole application is one HTML file (~1.1MB), so no-store meant a full
# re-download on every open — the app felt like it reloaded on every tap.
# Now: serve from cache instantly, treat it as fresh for a day, and after that
# still serve the cached copy immediately while fetching the new one in the
# background. Consequence: a freshly deployed change lands on the *next* open,
# not the current one.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Run the Telegram scheduler every 5 minutes
[functions."telegram-scheduler"]
  schedule = "*/5 * * * *"

# Drain the WhatsApp scheduled queue every 15 minutes.
# Declared here rather than in the function file: wa-scheduler.js is CommonJS,
# and Netlify only reads an in-file schedule from an ESM `export const config`.
[functions."wa-scheduler"]
  schedule = "*/15 * * * *"

# reorder-nudge-background declares its own schedule in the function file.
