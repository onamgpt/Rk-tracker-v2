<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b1220">
<meta name="robots" content="noindex, nofollow">
<title>Wedding Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Mukta:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --silk:#fbf5ea; --paper:#fffdf8; --ink:#2b1a14; --muted:#7a6457; --line:#ead9c0;
  --kumkum:#8a1c2b; --kumkum-d:#5b1220; --haldi:#d79a1e; --haldi-l:#f7e3b5; --leaf:#2f6b3a;
  --shadow:0 2px 10px rgba(91,18,32,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--silk);color:var(--ink);font-family:'Mukta',system-ui,sans-serif;font-size:16px;line-height:1.5}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{background:var(--kumkum-d);color:#fff4dc;padding:18px 16px 14px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;
  border:14px double rgba(215,154,30,.35)}
.top h1{font-size:34px;letter-spacing:.3px}
.top .sub{color:#e9c98a;font-size:14px;margin-top:2px}
.top .who{position:absolute;right:14px;top:16px;font-size:13px;background:rgba(255,255,255,.12);padding:3px 10px;border-radius:20px;z-index:1}
.bar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:14px}
.btn.p{background:var(--kumkum);border-color:var(--kumkum);color:#fff}
.btn.g{background:var(--haldi-l);border-color:var(--haldi)}
.btn:disabled{opacity:.5}
.search{flex:1;min-width:140px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 0}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px;font-size:13px}
.chip.on{background:var(--kumkum);color:#fff;border-color:var(--kumkum)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:14px;max-width:1200px;margin:0 auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);position:relative}
.card .ph{aspect-ratio:4/3;background:linear-gradient(135deg,var(--haldi-l),#f3d2c4);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:54px;color:var(--kumkum)}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .bd{padding:10px 12px 12px}
.card h3{font-size:24px}
.card .meta{color:var(--muted);font-size:14px}
.card .sel{position:absolute;left:8px;top:8px;width:26px;height:26px;accent-color:var(--kumkum)}
.pill{display:inline-block;font-size:12px;border-radius:20px;padding:1px 9px;background:var(--haldi-l);color:#6b4a00;margin-top:6px}
.pill.yes{background:#dcefdc;color:var(--leaf)} .pill.no{background:#eee;color:#777}
.stars{color:var(--haldi);letter-spacing:1px;font-size:14px}
.rates{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
.sheet{position:fixed;inset:0;background:var(--silk);z-index:20;overflow:auto;display:none}
.sheet.on{display:block}
.sheet .head{position:sticky;top:0;background:var(--kumkum-d);color:#fff4dc;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));z-index:2}
.sheet .head h2{flex:1;font-size:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .head .btn{background:rgba(255,255,255,.12);color:#fff4dc;border-color:rgba(255,255,255,.25)}
.wrap{max-width:820px;margin:0 auto;padding:14px}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec h3{font-size:22px;color:var(--kumkum);margin-bottom:8px}
.kv{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:4px 12px;font-size:15px}
.kv .k{color:var(--muted)}
.kv input,.kv textarea,.kv select{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
.gal{display:flex;gap:8px;overflow-x:auto}
.gal .im{position:relative;flex:0 0 auto}
.gal img{height:180px;border-radius:10px;display:block}
.gal .x{position:absolute;right:4px;top:4px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%;width:24px;height:24px;font-size:13px}
.files a{display:block;color:var(--kumkum);padding:4px 0}
.notes{display:grid;gap:10px}
.note{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
.note .nm{font-weight:700}
.note textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;padding:8px}
.starpick button{border:0;background:none;font-size:24px;color:#d8c8a8;padding:0 2px}
.starpick button.on{color:var(--haldi)}
.list li{margin:2px 0}
.addrow{display:flex;gap:6px;margin-top:6px}
.addrow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.cmt{border-left:3px solid var(--haldi);padding:4px 10px;margin:6px 0}
.cmt .w{font-size:12px;color:var(--muted)}
.status{display:flex;gap:6px;flex-wrap:wrap}
.status button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 11px;font-size:13px}
.status button.on{background:var(--kumkum);color:#fff;border-color:var(--kumkum)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;z-index:50;display:none}
.cmp{overflow-x:auto}
.cmp table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px;background:var(--paper)}
.cmp th,.cmp td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.cmp th{background:var(--haldi-l)}
.cmp td.k{color:var(--muted);white-space:nowrap}
.cmp img{width:110px;height:110px;object-fit:cover;border-radius:8px}
.ai{background:#fff;border:1px dashed var(--haldi);border-radius:12px;padding:12px}
.ai textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:8px}
.muted{color:var(--muted);font-size:13px}
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;left:0;top:0;width:100%;padding:10mm;color:#000}
  #printArea h1{font-size:28px;color:#5b1220}
  #printArea .kv{grid-template-columns:40% 1fr;font-size:12px}
  #printArea img{max-height:220px;margin:4px}
  #printArea h3{font-size:16px;color:#5b1220;margin:10px 0 4px}
}
</style>
</head>
<body>
<div class="top">
  <div class="who" id="who"></div>
  <h1>Wedding Desk</h1>
  <div class="sub">Proposals for Tassmai · shared by Ravi, Brunda &amp; Tassmai</div>
</div>
<div class="bar">
  <button class="btn p" id="bAdd">+ New proposal</button>
  <button class="btn g" id="bAI">✨ Add from biodata</button>
  <button class="btn" id="bCmp">⚖️ Compare</button>
  <input class="search" id="q" placeholder="Search name, code, star, college…">
</div>
<div class="chips" id="chips"></div>
<div id="cmpHint" class="muted" style="padding:6px 14px 0;display:none">Tick 2–3 cards, then tap Compare again.</div>
<div class="grid" id="grid"></div>

<div class="sheet" id="sheet"></div>
<div id="printArea"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" style="display:none">

<script>
(function(){
  'use strict';
  // ---------- who is looking ----------
  var RAW = (new URLSearchParams(location.search).get('user') || 'main').toLowerCase();
  var ALIAS = {brunda:'wife', tassmai:'daughter', ravi:'main'};
  var USER = ALIAS[RAW] || RAW;
  var NAMES = {main:'Ravi', wife:'Brunda', daughter:'Tassmai'};
  var PEOPLE = ['main','wife','daughter'];
  var KEY = 'wedding_desk';
  var STATUSES = ['New','Shortlisted','Jathaka matched','Families met','Yes','Not proceeding'];

  var FIELDS = [
    ['Basics', [['code','Code'],['name','Name'],['dob','Date of birth','dd/mm/yyyy'],['tob','Time of birth'],['pob','Place of birth'],['height','Height']]],
    ['Horoscope', [['nakshatra','Nakshatra & Pada'],['rashi','Rashi'],['lagna','Lagna'],['gothra','Swagothra'],['mGothra','Mother\u2019s Gothra']]],
    ['Education', [['puc','PUC'],['ug','UG'],['pg','PG']]],
    ['Occupation', [['occupation','Occupation / Company'],['income','His income']]],
    ['Father', [['fOcc','Occupation'],['fIncome','Income'],['fFamily','Family name'],['fNative','Native place']]],
    ['Mother', [['mOcc','Occupation'],['mFamily','Family name'],['mNative','Native place']]],
    ['Family & assets', [['siblings','Siblings'],['ownHouse','Own house'],['rental','Rental income'],['assets','Other assets','long']]],
    ['Proposal came from', [['srcName','Sent by (broker / relative)'],['srcPhone','Phone'],['extra','Other details','long']]]
  ];

  var DATA = {profiles:[], deleted:[]};
  var filter = 'All', cmpMode = false, picked = [], openId = null, editing = false;

  // ---------- helpers ----------
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function toast(t, ms){ var el=$('toast'); el.textContent=t; el.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){el.style.display='none';}, ms||2200); }
  function uid(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function now(){ return new Date().toISOString(); }
  function fmtTime(iso){ try{ return new Date(iso).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}); }catch(e){ return ''; } }
  function parseDob(s){
    s=String(s||'').trim(); var m;
    if((m=s.match(/^(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{4})$/))) return new Date(+m[3], +m[2]-1, +m[1]);
    if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return new Date(+m[1], +m[2]-1, +m[3]);
    return null;
  }
  function age(s){ var d=parseDob(s); if(!d||isNaN(d)) return ''; var t=new Date(), a=t.getFullYear()-d.getFullYear();
    if(t.getMonth()<d.getMonth()||(t.getMonth()===d.getMonth()&&t.getDate()<d.getDate())) a--; return a>0&&a<100?a:''; }
  function stars(n){ n=+n||0; return n? '\u2605'.repeat(n)+'\u2606'.repeat(5-n) : ''; }
  function find(id){ return DATA.profiles.filter(function(p){return p.id===id;})[0]; }

  // ---------- server ----------
  async function dbAPI(action, extra){
    try{
      var r = await fetch('/.netlify/functions/db', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(Object.assign({action:action, user:'main'}, extra||{}))});
      return await r.json();
    }catch(e){ return {ok:false, error:String(e)}; }
  }
  async function claudeAPI(prompt, system, imageBase64, imageType, pdfBase64){
    var r = await fetch('/.netlify/functions/claude', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({prompt:prompt, system:system||'', imageBase64:imageBase64||'', imageType:imageType||'', pdfBase64:pdfBase64||''})});
    var j = await r.json(); if(j.error) throw new Error(j.error); return j.text||'';
  }
  function norm(d){ d = d && typeof d==='object' ? d : {}; return {profiles:Array.isArray(d.profiles)?d.profiles:[], deleted:Array.isArray(d.deleted)?d.deleted:[]}; }
  async function load(){ var r=await dbAPI('getPortfolio',{key:KEY}); if(r && r.ok===false && r.error) throw new Error(r.error); return norm(r && r.data); }

  // Merge with whatever is on the server right now, so two people editing
  // different proposals (or notes) at the same time never overwrite each other.
  function merge(server, local){
    var del = {}; server.deleted.concat(local.deleted).forEach(function(id){ del[id]=1; });
    var map = {};
    server.profiles.concat(local.profiles).forEach(function(p){
      if(!p || !p.id || del[p.id]) return;
      var a = map[p.id];
      if(!a){ map[p.id] = p; return; }
      var newer = String(p.updatedAt||'') >= String(a.updatedAt||'') ? p : a, older = newer===p ? a : p;
      var m = Object.assign({}, newer);
      m.notes = Object.assign({}, older.notes||{});
      Object.keys(newer.notes||{}).forEach(function(k){ var x=newer.notes[k], y=m.notes[k]; if(!y || String(x.at||'')>=String(y.at||'')) m.notes[k]=x; });
      // photos, files, pros, cons and messages can be added from WhatsApp and the page
      // at the same time, so they are combined; anything someone removed stays removed.
      var gone = {}; (older.removed||[]).concat(newer.removed||[]).forEach(function(k){ gone[k]=1; });
      m.removed = Object.keys(gone);
      function uni(field, keyOf, sort){
        var seen={}, outA=[]; (newer[field]||[]).concat(older[field]||[]).forEach(function(x){ var k=keyOf(x); if(!x||seen[k]||gone[k]) return; seen[k]=1; outA.push(x); });
        if(sort) outA.sort(function(x,y){ return String(x.at||'').localeCompare(String(y.at||'')); });
        m[field]=outA;
      }
      uni('photos', function(x){ return x.url; });
      uni('files', function(x){ return x.url; });
      uni('pros', function(x){ return 'pc:'+x.at+'|'+x.by+'|'+x.text; }, true);
      uni('cons', function(x){ return 'pc:'+x.at+'|'+x.by+'|'+x.text; }, true);
      uni('comments', function(x){ return x.at+'|'+x.by+'|'+x.text; }, true);
      map[p.id] = m;
    });
    var out = Object.keys(map).map(function(k){ return map[k]; });
    out.sort(function(a,b){ return String(b.createdAt||'').localeCompare(String(a.createdAt||'')); });
    return {profiles:out, deleted:Object.keys(del)};
  }
  var saving = Promise.resolve();
  function save(){
    saving = saving.then(async function(){
      try{
        var server = await load();
        DATA = merge(server, DATA);
        var r = await dbAPI('savePortfolio',{key:KEY, data:DATA});
        if(!r || !r.ok) throw new Error((r&&r.error)||'not saved');
        toast('\u2713 Saved');
      }catch(e){ toast('Could not save \u2014 check internet and try again', 4000); }
    });
    return saving;
  }
  function touch(p){ p.updatedAt = now(); }

  async function fileToB64(file){ return await new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){ res(String(r.result)); }; r.onerror=rej; r.readAsDataURL(file); }); }
  async function shrinkImage(file, maxPx, q){
    var url = await fileToB64(file);
    var img = await new Promise(function(res,rej){ var i=new Image(); i.onload=function(){res(i);}; i.onerror=rej; i.src=url; });
    var sc = Math.min(1, maxPx/Math.max(img.width,img.height));
    var c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg', q||0.85);
  }
  async function upload(file){
    var isImg = /^image\//.test(file.type) && !/heic|heif/i.test(file.type);
    var data, type=file.type, name=file.name;
    if(isImg){ data = await shrinkImage(file, 2000, 0.86); type='image/jpeg'; name=name.replace(/\.\w+$/,'')+'.jpg'; }
    else { if(file.size>4.2e6){ throw new Error('File too big (max ~4 MB)'); } data = await fileToB64(file); }
    var r = await dbAPI('uploadFile',{file:{name:name, type:type, data:data}});
    if(!r || !r.url) throw new Error((r&&(r.detail||r.error))||'upload failed');
    return {url:r.url, name:name, type:type};
  }
  function pickFile(accept, multiple){
    return new Promise(function(res){
      var inp=$('fileIn'); inp.value=''; inp.accept=accept||''; inp.multiple=!!multiple;
      inp.onchange=function(){ res(Array.from(inp.files||[])); }; inp.click();
    });
  }

  // ---------- list ----------
  function counts(){ var c={All:DATA.profiles.length}; STATUSES.forEach(function(s){c[s]=0;}); DATA.profiles.forEach(function(p){ c[p.status||'New']=(c[p.status||'New']||0)+1; }); return c; }
  function renderChips(){
    var c=counts();
    $('chips').innerHTML=['All'].concat(STATUSES).map(function(s){ return '<button class="chip'+(s===filter?' on':'')+'" data-s="'+esc(s)+'">'+esc(s)+' ('+(c[s]||0)+')</button>'; }).join('');
    Array.from($('chips').children).forEach(function(b){ b.onclick=function(){ filter=b.dataset.s; renderList(); }; });
  }
  function renderList(){
    renderChips();
    var q=$('q').value.trim().toLowerCase();
    var list = DATA.profiles.filter(function(p){
      if(filter!=='All' && (p.status||'New')!==filter) return false;
      if(!q) return true;
      return JSON.stringify([p.name,p.code,p.nakshatra,p.rashi,p.ug,p.pg,p.occupation,p.fNative,p.fFamily,p.srcName]).toLowerCase().indexOf(q)>=0;
    });
    if(!list.length){ $('grid').innerHTML='<div class="empty">'+(DATA.profiles.length?'Nothing matches.':'No proposals yet. Tap \u201c+ New proposal\u201d or \u201c\u2728 Add from biodata\u201d.')+'</div>'; return; }
    $('grid').innerHTML = list.map(function(p){
      var ph = (p.photos||[])[0];
      var a = age(p.dob), st=p.status||'New';
      var rates = PEOPLE.map(function(u){ var n=p.notes&&p.notes[u]; return n&&n.rating? NAMES[u]+' <span class="stars">'+stars(n.rating)+'</span>' : ''; }).filter(Boolean).join(' ');
      return '<div class="card" data-id="'+p.id+'">'+
        (cmpMode?'<input type="checkbox" class="sel" data-id="'+p.id+'"'+(picked.indexOf(p.id)>=0?' checked':'')+'>':'')+
        '<div class="ph">'+(ph?'<img loading="lazy" src="'+esc(ph.url)+'" alt="">':esc((p.name||'?').trim().charAt(0).toUpperCase()))+'</div>'+
        '<div class="bd"><h3>'+esc(p.name||'(no name)')+'</h3>'+
        '<div class="meta">'+[a?a+' yrs':'', p.nakshatra, p.rashi].filter(Boolean).map(esc).join(' \u00b7 ')+'</div>'+
        '<div class="meta">'+esc([p.pg||p.ug, p.occupation].filter(Boolean).join(' \u00b7 '))+'</div>'+
        '<span class="pill'+(st==='Yes'?' yes':st==='Not proceeding'?' no':'')+'">'+esc(st)+'</span>'+
        (p.followUp?' <span class="pill">\u23f0 '+esc(p.followUp)+'</span>':'')+
        (rates?'<div class="rates">'+rates+'</div>':'')+
        '</div></div>';
    }).join('');
    Array.from(document.querySelectorAll('.card')).forEach(function(el){
      el.onclick=function(ev){
        var id=el.dataset.id;
        if(cmpMode){ var i=picked.indexOf(id); if(i>=0) picked.splice(i,1); else if(picked.length<3) picked.push(id); else toast('Compare up to 3'); renderList(); return; }
        openProfile(id);
      };
    });
  }

  // ---------- detail ----------
  function openProfile(id, edit){ openId=id; editing=!!edit; renderSheet(); $('sheet').classList.add('on'); $('sheet').scrollTop=0; history.pushState({p:id},''); }
  function closeSheet(){ $('sheet').classList.remove('on'); $('sheet').innerHTML=''; openId=null; renderList(); }
  window.addEventListener('popstate', function(){ if($('sheet').classList.contains('on')) closeSheet(); });

  function renderSheet(){
    var p=find(openId); if(!p){ closeSheet(); return; }
    var a=age(p.dob);
    var h='<div class="head"><button class="btn" id="sBack">\u2190</button><h2>'+esc(p.name||'New proposal')+'</h2>'+
      '<button class="btn" id="sEdit">'+(editing?'\u2713 Done':'\u270f\ufe0f Edit')+'</button><button class="btn" id="sPdf">\ud83d\udcc4 PDF</button></div><div class="wrap">';

    // status
    h+='<div class="sec"><h3>Status</h3><div class="status">'+STATUSES.map(function(s){ return '<button data-s="'+esc(s)+'" class="'+((p.status||'New')===s?'on':'')+'">'+esc(s)+'</button>'; }).join('')+'</div>'+
       '<div class="kv" style="margin-top:10px"><div class="k">Follow-up date</div><div><input type="date" id="fu" value="'+esc(p.followUp||'')+'"></div></div></div>';

    // photos
    h+='<div class="sec"><h3>Photos</h3><div class="gal">'+(p.photos||[]).map(function(f,i){ return '<div class="im"><a href="'+esc(f.url)+'" target="_blank"><img loading="lazy" src="'+esc(f.url)+'" alt=""></a>'+(editing?'<button class="x" data-i="'+i+'" data-t="photos">\u2715</button>':'')+'</div>'; }).join('')+'</div>'+
       '<div class="addrow"><button class="btn" id="addPhoto">+ Add photos</button></div></div>';

    // details
    FIELDS.forEach(function(g){
      var rows = g[1].map(function(f){
        var v=p[f[0]]||'';
        if(!editing && !v) return '';
        var val = editing ? (f[2]==='long' ? '<textarea data-f="'+f[0]+'" rows="2">'+esc(v)+'</textarea>' : '<input data-f="'+f[0]+'" value="'+esc(v)+'" placeholder="'+esc(f[2]&&f[2]!=='long'?f[2]:'')+'">')
                          : esc(v)+(f[0]==='dob'&&a?' <span class="muted">('+a+' yrs)</span>':'');
        return '<div class="k">'+esc(f[1])+'</div><div>'+val+'</div>';
      }).join('');
      if(rows) h+='<div class="sec"><h3>'+esc(g[0])+'</h3><div class="kv">'+rows+'</div></div>';
    });

    // files
    h+='<div class="sec"><h3>Biodata &amp; Jathaka</h3><div class="files">'+(p.files||[]).map(function(f,i){ return '<div><a href="'+esc(f.url)+'" target="_blank">\ud83d\udcce '+esc((f.kind?f.kind+' \u2014 ':'')+f.name)+(f.addedBy?' \u00b7 via WhatsApp from '+esc(NAMES[f.addedBy]||f.addedBy):'')+'</a>'+(editing?' <button class="btn x2" data-i="'+i+'" data-t="files">Remove</button>':'')+'</div>'; }).join('')+
       ((p.files||[]).length?'':'<div class="muted">None yet.</div>')+'</div>'+
       '<div class="addrow"><button class="btn" id="addBio">+ Biodata</button><button class="btn" id="addJat">+ Jathaka</button><button class="btn" id="addOther">+ Other file</button></div></div>';

    // notes
    h+='<div class="sec"><h3>Our deciding notes</h3><div class="notes">'+PEOPLE.map(function(u){
      var n=(p.notes&&p.notes[u])||{}; var mine = u===USER;
      return '<div class="note"><div class="nm">'+NAMES[u]+(mine?' (you)':'')+' '+(n.at?'<span class="muted">\u00b7 '+fmtTime(n.at)+'</span>':'')+'</div>'+
        (mine ? '<div class="starpick" id="sp">'+[1,2,3,4,5].map(function(i){ return '<button data-r="'+i+'" class="'+(i<=(n.rating||0)?'on':'')+'">\u2605</button>'; }).join('')+'</div>'+
                '<textarea id="myNote" placeholder="Your thoughts \u2014 what you liked, what worries you\u2026">'+esc(n.text||'')+'</textarea>'+
                '<div class="addrow"><button class="btn p" id="saveNote">Save my note</button></div>'
              : '<div class="stars">'+(stars(n.rating)||'<span class="muted">No rating yet</span>')+'</div><div style="white-space:pre-wrap">'+(esc(n.text)||'<span class="muted">No note yet</span>')+'</div>')+
        '</div>';
    }).join('')+'</div></div>';

    // pros / cons
    ['pros','cons'].forEach(function(t){
      h+='<div class="sec"><h3>'+(t==='pros'?'\ud83d\udc4d Pros':'\ud83d\udc4e Cons')+'</h3><ul class="list">'+(p[t]||[]).map(function(x,i){ return '<li>'+esc(x.text)+' <span class="muted">\u2014 '+esc(NAMES[x.by]||x.by)+'</span> <button class="btn" style="padding:0 6px" data-del="'+t+'" data-i="'+i+'">\u2715</button></li>'; }).join('')+'</ul>'+
         '<div class="addrow"><input id="in_'+t+'" placeholder="Add a '+(t==='pros'?'pro':'con')+'"><button class="btn" data-add="'+t+'">Add</button></div></div>';
    });

    // discussion
    h+='<div class="sec"><h3>Family discussion</h3>'+((p.comments||[]).map(function(c){ return '<div class="cmt"><div class="w">'+esc(NAMES[c.by]||c.by)+' \u00b7 '+fmtTime(c.at)+'</div><div style="white-space:pre-wrap">'+esc(c.text)+'</div></div>'; }).join('')||'<div class="muted">No messages yet.</div>')+
       '<div class="addrow"><input id="cmtIn" placeholder="Write to the family\u2026"><button class="btn p" id="cmtGo">Send</button></div></div>';

    h+='<div style="text-align:center;margin:20px 0 40px"><button class="btn" id="sDel" style="color:#a00">Delete this proposal</button></div></div>';
    $('sheet').innerHTML=h;
    wireSheet(p);
  }

  function wireSheet(p0){
    // Always act on the live record: a save may have swapped DATA for a merged copy.
    function P(){ return find(openId)||p0; }
    $('sBack').onclick=function(){ history.back(); };
    $('sEdit').onclick=function(){
      if(editing){ Array.from(document.querySelectorAll('[data-f]')).forEach(function(el){ P()[el.dataset.f]=el.value.trim(); }); touch(P()); save(); }
      editing=!editing; renderSheet();
    };
    $('sPdf').onclick=function(){ printProfile(P()); };
    Array.from(document.querySelectorAll('.status button')).forEach(function(b){ b.onclick=function(){ P().status=b.dataset.s; touch(P()); save(); renderSheet(); }; });
    $('fu').onchange=function(){ P().followUp=this.value; touch(P()); save(); };
    $('addPhoto').onclick=async function(){
      var fs=await pickFile('image/*', true); if(!fs.length) return; toast('Uploading '+fs.length+' photo'+(fs.length>1?'s':'')+'\u2026', 60000);
      for(var i=0;i<fs.length;i++){ try{ (P().photos=P().photos||[]).push(await upload(fs[i])); }catch(e){ toast('Upload failed: '+e.message, 4000); } }
      touch(P()); await save(); renderSheet();
    };
    function addFile(kind){ return async function(){
      var fs=await pickFile('image/*,application/pdf', true); if(!fs.length) return; toast('Uploading\u2026', 60000);
      for(var i=0;i<fs.length;i++){ try{ var f=await upload(fs[i]); f.kind=kind; (P().files=P().files||[]).push(f); }catch(e){ toast('Upload failed: '+e.message, 4000); } }
      touch(P()); await save(); renderSheet();
    }; }
    $('addBio').onclick=addFile('Biodata'); $('addJat').onclick=addFile('Jathaka'); $('addOther').onclick=addFile('');
    Array.from(document.querySelectorAll('.gal .x, .x2')).forEach(function(b){ b.onclick=function(ev){ ev.preventDefault(); if(!confirm('Remove this?')) return; var q=P(), it=q[b.dataset.t][+b.dataset.i]; if(it&&it.url) (q.removed=q.removed||[]).push(it.url); q[b.dataset.t].splice(+b.dataset.i,1); touch(q); save(); renderSheet(); }; });
    var rating=((P().notes||{})[USER]||{}).rating||0;
    if($('sp')) Array.from($('sp').children).forEach(function(b){ b.onclick=function(){ rating=+b.dataset.r; Array.from($('sp').children).forEach(function(x){ x.className=(+x.dataset.r<=rating)?'on':''; }); }; });
    if($('saveNote')) $('saveNote').onclick=function(){ P().notes=P().notes||{}; P().notes[USER]={text:$('myNote').value.trim(), rating:rating, at:now()}; touch(P()); save(); renderSheet(); };
    Array.from(document.querySelectorAll('[data-add]')).forEach(function(b){ b.onclick=function(){ var t=b.dataset.add, v=$('in_'+t).value.trim(); if(!v) return; (P()[t]=P()[t]||[]).push({text:v, by:USER, at:now()}); touch(P()); save(); renderSheet(); }; });
    Array.from(document.querySelectorAll('[data-del]')).forEach(function(b){ b.onclick=function(){ var q=P(), it=q[b.dataset.del][+b.dataset.i]; if(it) (q.removed=q.removed||[]).push('pc:'+it.at+'|'+it.by+'|'+it.text); q[b.dataset.del].splice(+b.dataset.i,1); touch(q); save(); renderSheet(); }; });
    $('cmtGo').onclick=function(){ var v=$('cmtIn').value.trim(); if(!v) return; (P().comments=P().comments||[]).push({by:USER, text:v, at:now()}); touch(P()); save(); renderSheet(); };
    $('sDel').onclick=function(){ if(!confirm('Delete '+(P().name||'this proposal')+' for everyone?')) return;
      DATA.profiles=DATA.profiles.filter(function(x){return x.id!==P().id;}); DATA.deleted.push(P().id); save(); history.back(); };
  }

  function newProfile(fields){
    var p=Object.assign({id:uid(), status:'New', photos:[], files:[], notes:{}, pros:[], cons:[], comments:[], createdAt:now(), createdBy:USER}, fields||{});
    touch(p); DATA.profiles.unshift(p); return p;
  }

  // ---------- AI biodata ----------
  var AI_KEYS = ['code','name','dob','tob','pob','height','nakshatra','rashi','lagna','gothra','mGothra','puc','ug','pg','occupation','income','fOcc','fIncome','fFamily','fNative','mOcc','mFamily','mNative','siblings','ownHouse','rental','assets','srcName','srcPhone','extra'];
  var AI_SYS = 'You read Indian marriage biodata (often Kannada/Telugu/Tamil families, may mix languages) and return ONLY a JSON object, no other text. Keys: '+AI_KEYS.join(', ')+'. '+
    'Meanings: code=profile/reference code; dob as dd/mm/yyyy; tob=time of birth; pob=place of birth; nakshatra includes pada if given; gothra=the boy\u2019s own (swa) gothra; mGothra=mother\u2019s gothra; puc/ug/pg=college or university for each level; occupation=the boy\u2019s job and company (or "Currently studying"); income=the boy\u2019s own income; fOcc/fIncome/fFamily/fNative=father\u2019s occupation, income, family name, native; mOcc/mFamily/mNative=mother\u2019s; ownHouse; rental=rental income; assets=other assets as one line; srcName/srcPhone=contact person and phone if given; extra=anything else useful (siblings go in siblings). Copy values as written. Use "" when not present.';
  function parseJSON(t){ t=String(t||'').replace(/```json|```/g,''); var i=t.indexOf('{'), j=t.lastIndexOf('}'); if(i<0||j<i) throw new Error('AI did not return details'); return JSON.parse(t.slice(i,j+1)); }
  function cleanAI(o){ var r={}; AI_KEYS.forEach(function(k){ if(o[k]!=null && String(o[k]).trim()) r[k]=String(o[k]).trim(); }); return r; }

  function openAI(){
    $('sheet').innerHTML='<div class="head"><button class="btn" id="aBack">\u2190</button><h2>Add from biodata</h2></div><div class="wrap"><div class="sec ai">'+
      '<p style="margin-top:0">Upload a biodata photo, screenshot or PDF \u2014 or paste the WhatsApp text. All fields are filled in for you to check.</p>'+
      '<div class="addrow"><button class="btn p" id="aFile">\ud83d\udcf7 Upload biodata (photo / PDF)</button></div>'+
      '<p class="muted" style="margin:12px 0 4px">or paste text:</p><textarea id="aTxt" placeholder="CODE:- \u2026\nNAME:- \u2026"></textarea>'+
      '<div class="addrow"><button class="btn g" id="aGo">\u2728 Read text</button></div><div id="aSt" class="muted" style="margin-top:8px"></div></div></div>';
    $('sheet').classList.add('on'); history.pushState({ai:1},'');
    $('aBack').onclick=function(){ history.back(); };
    $('aGo').onclick=async function(){
      var t=$('aTxt').value.trim(); if(!t) return; $('aSt').textContent='Reading\u2026'; this.disabled=true;
      try{ var o=cleanAI(parseJSON(await claudeAPI('Biodata:\n\n'+t, AI_SYS))); var p=newProfile(o); p.extra=p.extra||''; await save(); history.replaceState({p:p.id},''); openId=p.id; editing=true; renderSheet(); toast('Check the details, then tap \u2713 Done'); }
      catch(e){ $('aSt').textContent='Could not read: '+e.message; this.disabled=false; }
    };
    $('aFile').onclick=async function(){
      var fs=await pickFile('image/*,application/pdf', false); if(!fs.length) return; var f=fs[0];
      $('aSt').textContent='Reading biodata\u2026 (10\u201330 sec)'; var btn=this; btn.disabled=true;
      try{
        var txt;
        if(/pdf/.test(f.type)){ var d=await fileToB64(f); txt=await claudeAPI('Extract the marriage biodata fields from this document.', AI_SYS, '', '', d.split(',')[1]); }
        else { var im=await shrinkImage(f, 1500, 0.82); txt=await claudeAPI('Extract the marriage biodata fields from this image.', AI_SYS, im.split(',')[1], 'image/jpeg'); }
        var o=cleanAI(parseJSON(txt));
        $('aSt').textContent='Saving the biodata file\u2026';
        var p=newProfile(o);
        try{ var up=await upload(f); up.kind='Biodata'; p.files.push(up); }catch(e){}
        await save(); history.replaceState({p:p.id},''); openId=p.id; editing=true; renderSheet(); toast('Check the details, then tap \u2713 Done');
      }catch(e){ $('aSt').textContent='Could not read: '+e.message; btn.disabled=false; }
    };
  }

  // ---------- compare ----------
  function showCompare(){
    var ps=picked.map(find).filter(Boolean); if(ps.length<2){ toast('Tick at least 2'); return; }
    var rows=[['Photo',function(p){ var f=(p.photos||[])[0]; return f?'<img src="'+esc(f.url)+'">':''; }],
      ['Age',function(p){ return esc(age(p.dob)); }]];
    FIELDS.forEach(function(g){ g[1].forEach(function(f){ if(f[0]!=='extra'&&f[0]!=='srcPhone') rows.push([f[1],function(p){ return esc(p[f[0]]||''); }]); }); });
    rows.push(['Status',function(p){ return esc(p.status||'New'); }]);
    PEOPLE.forEach(function(u){ rows.push([NAMES[u]+'\u2019s view',function(p){ var n=(p.notes||{})[u]||{}; return '<span class="stars">'+stars(n.rating)+'</span><br>'+esc(n.text||''); }]); });
    rows.push(['Pros',function(p){ return (p.pros||[]).map(function(x){return esc(x.text);}).join('<br>'); }]);
    rows.push(['Cons',function(p){ return (p.cons||[]).map(function(x){return esc(x.text);}).join('<br>'); }]);
    var h='<div class="head"><button class="btn" id="cBack">\u2190</button><h2>Compare</h2></div><div class="wrap cmp"><table><tr><th></th>'+ps.map(function(p){return '<th>'+esc(p.name)+'</th>';}).join('')+'</tr>'+
      rows.map(function(r){ var cells=ps.map(function(p){return r[1](p);}); if(!cells.join('').trim()) return ''; return '<tr><td class="k">'+esc(r[0])+'</td>'+cells.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>'; }).join('')+'</table></div>';
    $('sheet').innerHTML=h; $('sheet').classList.add('on'); history.pushState({c:1},'');
    $('cBack').onclick=function(){ history.back(); };
  }

  // ---------- print / PDF ----------
  function printProfile(p){
    var a=age(p.dob);
    var h='<h1>'+esc(p.name||'')+(p.code?' <small style="font-size:14px;color:#666">'+esc(p.code)+'</small>':'')+'</h1>'+
      '<div>'+(p.photos||[]).slice(0,3).map(function(f){return '<img src="'+esc(f.url)+'">';}).join('')+'</div>';
    FIELDS.forEach(function(g){ var rows=g[1].map(function(f){ var v=p[f[0]]; return v?'<div class="k">'+esc(f[1])+'</div><div>'+esc(v)+(f[0]==='dob'&&a?' ('+a+' yrs)':'')+'</div>':''; }).join('');
      if(rows) h+='<h3>'+esc(g[0])+'</h3><div class="kv">'+rows+'</div>'; });
    var notes=PEOPLE.map(function(u){ var n=(p.notes||{})[u]; return n&&(n.text||n.rating)?'<div class="k">'+NAMES[u]+'</div><div>'+stars(n.rating)+' '+esc(n.text||'')+'</div>':''; }).join('');
    if(notes) h+='<h3>Our notes</h3><div class="kv">'+notes+'</div>';
    if((p.pros||[]).length) h+='<h3>Pros</h3>'+p.pros.map(function(x){return '\u2022 '+esc(x.text);}).join('<br>');
    if((p.cons||[]).length) h+='<h3>Cons</h3>'+p.cons.map(function(x){return '\u2022 '+esc(x.text);}).join('<br>');
    h+='<h3>Status</h3>'+esc(p.status||'New');
    $('printArea').innerHTML=h;
    var imgs=Array.from($('printArea').querySelectorAll('img')); var left=imgs.length; var go=function(){ setTimeout(function(){ window.print(); },200); };
    if(!left) return go(); var done=function(){ if(--left<=0) go(); }; imgs.forEach(function(i){ if(i.complete) done(); else { i.onload=done; i.onerror=done; } });
  }

  // ---------- seed ----------
  function seed(){
    return newProfile({
      code:'B NAGAR BUILDWELL B', name:'S R Amrut', dob:'06/03/1998', tob:'5.35 PM', pob:'Bangalore',
      nakshatra:'Mrugashira', rashi:'Mithuna', lagna:'Simha', gothra:'Mithunakula', mGothra:'Mashantha Kula',
      puc:'VVS Pre-University College', ug:'PES University', pg:'IIT Kanpur', occupation:'Currently studying',
      fOcc:'Construction Business', fIncome:'Business Income 40 LPA', fFamily:'Sanjee', fNative:'Madhugiri',
      mOcc:'Homemaker', mFamily:'Kota', mNative:'Bengaluru',
      ownHouse:'Yes', rental:'~4 lakhs/month', assets:'5 Sites + Land in Thuruhalli'
    });
  }

  // ---------- boot ----------
  async function boot(){
    $('who').textContent=NAMES[USER];
    $('grid').innerHTML='<div class="empty">Loading\u2026</div>';
    try{ DATA=await load(); }catch(e){ $('grid').innerHTML='<div class="empty">Could not load. Check internet and reopen.</div>'; return; }
    if(!DATA.profiles.length && !DATA.deleted.length){ seed(); await save(); }
    renderList();
    var want=new URLSearchParams(location.search).get('p'); if(want && find(want)) openProfile(want);
    // pick up what the others (or WhatsApp) added, whenever the page comes back into view and every minute
    var refresh=async function(){
      if(document.hidden) return;
      try{ var srv=await load(); DATA=merge(srv, DATA); }catch(e){ return; }
      var typing=document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
      if(openId && $('sheet').classList.contains('on')){ if(!editing && !typing && find(openId)) renderSheet(); }
      else if(!$('sheet').classList.contains('on')) renderList();
    };
    document.addEventListener('visibilitychange', refresh); setInterval(refresh, 60000);
  }
  $('q').oninput=renderList;
  $('bAdd').onclick=function(){ var p=newProfile({}); openProfile(p.id, true); };
  $('bAI').onclick=openAI;
  $('bCmp').onclick=function(){
    if(cmpMode && picked.length>=2){ showCompare(); return; }
    cmpMode=!cmpMode; if(!cmpMode) picked=[]; $('cmpHint').style.display=cmpMode?'block':'none'; $('bCmp').textContent=cmpMode?'\u2696\ufe0f Compare ticked':'\u2696\ufe0f Compare'; renderList();
  };
  window.__WD = {merge:merge, age:age, parseJSON:parseJSON, cleanAI:cleanAI, get DATA(){return DATA;}};

  // ---------- access: family only, same PINs as the tracker ----------
  (async function gate(){
    if(PEOPLE.indexOf(USER)<0){ document.body.innerHTML='<div style="padding:60px 20px;text-align:center;font-family:sans-serif">\ud83d\udd12 This page is private.</div>'; return; }
    if(localStorage.getItem('rkpin_ok_'+USER)==='1') return boot();
    var map={}; try{ var r=await dbAPI('getPortfolio',{key:'user_pins'}); map=(r&&r.data)||{}; }catch(e){}
    if(!map[USER]){ if(USER==='main') return boot(); document.body.innerHTML='<div style="padding:60px 20px;text-align:center;font-family:sans-serif">\ud83d\udd12 No PIN set for this user yet.<br>Ask Ravi to set one in PIN Access.</div>'; return; }
    var ov=document.createElement('div'); ov.style.cssText='position:fixed;inset:0;background:#fbf5ea;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px';
    ov.innerHTML='<div style="font-size:34px">\ud83d\udc8d</div><div style="font-family:Cormorant Garamond,serif;font-size:24px">Wedding Desk \u2014 '+NAMES[USER]+'</div><input id="pinIn" type="password" inputmode="numeric" placeholder="PIN" style="font-size:22px;padding:10px;width:180px;text-align:center;letter-spacing:6px;border:1px solid #ead9c0;border-radius:10px"><button id="pinGo" class="btn p" style="padding:10px 30px">Unlock</button><div id="pinErr" style="color:#b33;font-size:13px"></div>';
    document.body.appendChild(ov);
    var go=async function(){ var pin=$('pinIn').value.trim(); if(!pin) return;
      var h=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('rkpin:'+pin)))).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
      if(h===map[USER]){ localStorage.setItem('rkpin_ok_'+USER,'1'); ov.remove(); boot(); } else $('pinErr').textContent='Wrong PIN'; };
    $('pinGo').onclick=go; $('pinIn').addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
  })();
})();
</script>
