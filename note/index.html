<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="RK Note"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#2a1800"/>
<link rel="apple-touch-icon" href="/note/icon.png"/>
<title>RK Note</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#2a1800;color:#2a1a00;font-family:-apple-system,system-ui,sans-serif;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 20px;display:flex;flex-direction:column;min-height:100%}
.top{display:flex;align-items:center;gap:10px;color:#f5d890;margin-bottom:10px}
.top h1{font-family:Palatino,'Book Antiqua',serif;font-size:20px;flex:1}
.top a{color:#c8a060;font-size:13px;text-decoration:none;border:1px solid #6a4a1a;border-radius:8px;padding:6px 10px}
textarea{width:100%;min-height:42vh;border:none;border-radius:14px;padding:14px;font-size:18px;line-height:1.45;
  background:#fdf8ef;color:#2a1a00;outline:none;resize:vertical;font-family:inherit}
.row{display:flex;gap:10px;margin-top:10px}
button{font-family:inherit;border:none;border-radius:12px;font-weight:700;cursor:pointer}
#save{flex:1;padding:16px;font-size:18px;color:#fff;background:linear-gradient(135deg,#c8860a,#a06010)}
#save:disabled{opacity:.5}
#status{color:#c8f0c8;font-size:13px;min-height:18px;margin-top:8px}
.hint{color:#a08860;font-size:12px;margin-top:4px}
.list{margin-top:14px}
.list h2{color:#c8a060;font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.item{background:rgba(253,248,239,.08);color:#f0e4c8;border-radius:10px;padding:9px 11px;margin-bottom:6px;font-size:14px;line-height:1.35}
.item small{display:block;color:#a08860;font-size:11px;margin-top:3px}
.tools{display:flex;gap:8px;margin-top:10px}
.tools label{flex:1;text-align:center;padding:12px 6px;border-radius:12px;background:rgba(253,248,239,.1);color:#f5d890;font-size:14px;font-weight:700;cursor:pointer;border:1px solid rgba(245,216,144,.25)}
.tools input{display:none}
#files{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.f{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;background:#fdf8ef;display:flex;align-items:center;justify-content:center;font-size:11px;color:#6a4a10;text-align:center;padding:3px}
.f img{width:100%;height:100%;object-fit:cover}
.f b{position:absolute;top:2px;right:2px;background:#000a;color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;font-size:12px;text-align:center;cursor:pointer}
#result{display:none;margin-top:10px;background:#1a3a1a;color:#d8f5d8;border-radius:12px;padding:11px 12px;font-size:14px}
#result .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
#result button,#result select{padding:8px 12px;border-radius:9px;font-size:13px;border:1px solid #6a9a6a;background:#244a24;color:#e8ffe8;font-weight:600}
.pin{display:none;flex-direction:column;align-items:center;gap:12px;margin-top:18vh;color:#f5d890}
.pin input{width:200px;padding:14px;font-size:24px;text-align:center;letter-spacing:8px;border-radius:12px;border:none}
.pin button{width:200px;padding:13px;font-size:16px;background:#1a7a4a;color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>✍️ RK Note</h1><a id="full" href="/">Open tracker →</a></div>

  <div id="pinBox" class="pin">
    <div>🔒 Enter your PIN</div>
    <input id="pin" type="password" inputmode="numeric" placeholder="••••"/>
    <button id="pinGo">Unlock</button>
    <div id="pinErr" style="color:#f88;font-size:13px"></div>
  </div>

  <div id="main">
    <textarea id="txt" placeholder="Jot it down… (tap 🎤 on the keyboard to speak)" autofocus></textarea>
    <div class="tools">
      <label>📷 Photo<input id="inCam" type="file" accept="image/*" capture="environment"></label>
      <label>📄 Scan<input id="inScan" type="file" accept="image/*" capture="environment"></label>
      <label>📎 Files<input id="inFile" type="file" multiple accept="image/*,application/pdf,*/*"></label>
    </div>
    <div id="files"></div>
    <div class="row"><button id="save">Save to tracker</button></div>
    <div id="result"></div>
    <div id="status"></div>
    <div class="hint">Say where it goes: "health note…", "remind me Friday 11am…", "note for the Avadi order…". Anything else goes to Quick Notes. 📄 Scan reads the text from a bill or page.</div>
    <div class="list"><h2>Recent notes</h2><div id="recent"></div></div>
  </div>
</div>
<script>
(function(){
  var Q=new URLSearchParams(location.search);
  var USER=Q.get("user")||"main";
  var QUEUE="rk_note_queue_"+USER, RECENT="rk_note_recent_"+USER, PINOK="rkpin_ok_"+USER;
  var $=function(id){return document.getElementById(id);};
  $("full").href="/"+(USER!=="main"?"?user="+encodeURIComponent(USER):"");

  function get(k,d){try{return JSON.parse(localStorage.getItem(k))||d;}catch(e){return d;}}
  function put(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
  function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
  function localDate(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function api(action,data){
    return fetch("/.netlify/functions/db",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(Object.assign({action:action,user:USER},data||{}))}).then(function(r){
        if(!r.ok) throw new Error("HTTP "+r.status); return r.json();});
  }
  function status(t){$("status").textContent=t;}

  function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  var CATS=["Quick Notes","Health","Personal","Family","Reminders","Finance","Property","Compliance","Intelligence","Problem","Digital","Business - Purchase","Sales - Order","Sales - Payment","Sales - Visit","Sales - Expense","Sales - Complaint"];
  var pending=[];   // {name,type,data(dataURL),thumb,ocr}
  function smart(b,ms){
    // Never let smart filing hold a note hostage: give up after a few seconds
    // and the note is saved plainly to Quick Notes instead.
    var ctl=window.AbortController?new AbortController():null;
    var t=ctl?setTimeout(function(){ctl.abort();},ms||9000):null;
    return fetch("/.netlify/functions/smartnote",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(Object.assign({user:USER},b)),signal:ctl?ctl.signal:undefined})
      .then(function(r){if(t)clearTimeout(t);if(!r.ok)throw new Error("HTTP "+r.status);return r.json();});
  }
  // Same photo handling as the tracker: shrink to 1200px JPEG, upload to Drive.
  function readFile(f,max){
    return new Promise(function(res,rej){
      var r=new FileReader();
      r.onload=function(e){
        if(!/^image\//.test(f.type)||/heic|heif/i.test(f.type)&&!window.createImageBitmap){res({name:f.name,type:f.type||"application/octet-stream",data:e.target.result});return;}
        var img=new Image();
        img.onload=function(){
          var M=max||1200,w=img.width,h=img.height;
          if(w>M||h>M){if(w>h){h=Math.round(h*M/w);w=M;}else{w=Math.round(w*M/h);h=M;}}
          var c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
          var name=(f.name||"photo").replace(/\.(heic|heif|png|webp)$/i,".jpg");
          res({name:/\.jpe?g$/i.test(name)?name:name+".jpg",type:"image/jpeg",data:c.toDataURL("image/jpeg",.85),img:true});
        };
        img.onerror=function(){res({name:f.name,type:f.type,data:e.target.result});};
        img.src=e.target.result;
      };
      r.onerror=rej; r.readAsDataURL(f);
    });
  }
  function drawFiles(){
    $("files").innerHTML=pending.map(function(p,i){
      return '<div class="f">'+(p.img?'<img src="'+p.data+'">':esc(p.name).slice(0,28))+'<b data-i="'+i+'">✕</b></div>';
    }).join("");
    Array.prototype.forEach.call($("files").querySelectorAll("b"),function(x){x.onclick=function(){pending.splice(+x.dataset.i,1);drawFiles();};});
  }
  function addFiles(list,scan){
    Array.prototype.forEach.call(list||[],function(f){
      readFile(f,scan?1600:1200).then(function(p){
        pending.push(p); drawFiles();
        if(scan&&p.img){
          status("🔍 Reading the text…");
          smart({action:"ocr",imageBase64:p.data.split(",")[1],imageType:"image/jpeg"}).then(function(r){
            var t=(r&&r.text)||"";
            if(t){var v=$("txt").value.trim();$("txt").value=(v?v+"\n\n":"")+t;status("🔍 Text added — check it, then Save");}
            else status("Couldn't read text from that photo — it's still attached.");
          }).catch(function(){status("Couldn't read text right now — photo is still attached.");});
        }
      });
    });
  }
  $("inCam").onchange=function(e){addFiles(e.target.files,false);e.target.value="";};
  $("inScan").onchange=function(e){addFiles(e.target.files,true);e.target.value="";};
  $("inFile").onchange=function(e){addFiles(e.target.files,false);e.target.value="";};

  function upload(p){
    return api("uploadFile",{file:{name:p.name,type:p.type,data:p.data}}).then(function(r){
      var u=r&&(r.url||r.link||(r.data&&String(r.data).indexOf("http")===0?r.data:null));
      if(!u) throw new Error("upload failed");
      return {name:p.name,type:"drive",data:u,driveId:(r.id||r.driveId||"")};
    });
  }
  function label(r){
    if(r.mode==="append") return "✅ Added to: <b>"+esc(r.title)+"</b>";
    if(r.reminder) return "⏰ Reminder "+esc(r.reminder.slice(0,16).replace("T"," "))+" — <b>"+esc(r.title)+"</b>";
    return "✅ Saved to <b>"+esc(r.category)+"</b>: "+esc(r.title);
  }
  function showResult(r){
    var box=$("result"); box.style.display="block";
    box.innerHTML=label(r)+'<div class="acts"><button id="undo">↩︎ Undo</button>'+
      (r.mode==="new"?'<select id="mv"><option value="">Move to…</option>'+CATS.filter(function(c){return c!==r.category;}).map(function(c){return '<option>'+c+'</option>';}).join("")+'</select>':'')+'</div>';
    $("undo").onclick=function(){
      $("undo").disabled=true;
      smart({action:"undo",undo:r.undo}).then(function(x){box.innerHTML=x&&x.ok?"↩︎ Undone":"Couldn't undo — fix it in the tracker";markRecent(r.id,"↩︎ undone");});
    };
    if($("mv")) $("mv").onchange=function(){
      var c=this.value; if(!c) return;
      smart({action:"move",id:r.id,category:c}).then(function(x){
        if(x&&x.ok){r.category=c;showResult(r);markRecent(r.id,"→ "+c);} else box.innerHTML+="<div>Couldn't move</div>";
      });
    };
  }
  function markRecent(id,txt){var rc=get(RECENT,[]);rc.forEach(function(e){if(e.id===id)e.where=txt;});put(RECENT,rc);render();}

  function render(){
    var r=get(RECENT,[]), q=get(QUEUE,[]);
    $("recent").innerHTML=q.map(function(e){return '<div class="item">'+esc(e.text||e.notes||"").slice(0,200)+'<small>⏳ waiting for internet</small></div>';}).join("")+
      r.slice(0,10).map(function(e){
        var t=new Date(e.at||e.createdAt).toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
        return '<div class="item">'+esc(e.text||e.notes||"").slice(0,200)+(e.files?" · 📎"+e.files:"")+'<small>'+t+' · '+esc(e.where||"Quick Notes")+'</small></div>';
      }).join("")||'<div class="hint">Nothing yet.</div>';
  }

  // Text-only notes wait offline; anything with photos needs a connection.
  var flushing=false;
  function flush(){
    if(flushing) return; var q=get(QUEUE,[]); if(!q.length){render();return;}
    flushing=true; var item=q[0];
    var key=item.qid||item.id;
    send(item.text||item.notes||"",[]).then(function(){
      put(QUEUE,get(QUEUE,[]).filter(function(x){return (x.qid||x.id)!==key;})); flushing=false; render(); flush();
    }).catch(function(){flushing=false;render();});
  }
  function send(text,files){
    return Promise.all(files.map(upload)).then(function(atts){
      return smart({action:"route",text:text,attachments:atts}).catch(function(){return null;}).then(function(r){
        if(r&&r.ok) return r;
        // AI unavailable → plain Quick Note, as before
        var first=(text||(atts[0]&&atts[0].name)||"Quick note").split("\n")[0];
        var e={id:genId(),title:first.slice(0,60),date:localDate(),category:"Quick Notes",tags:["Quick Note"],notes:text,attachments:atts,createdAt:new Date().toISOString()};
        if(atts[0]){e.link=atts[0].data;e.linkLabel="📎 Attachment";}
        return api("save",{entry:e}).then(function(s){if(s&&s.error)throw new Error(s.error);return {ok:true,mode:"new",id:e.id,title:e.title,category:"Quick Notes",undo:{type:"delete",id:e.id}};});
      }).then(function(r){
        var rc=get(RECENT,[]); rc.unshift({id:r.id,text:text,files:atts.length,at:new Date().toISOString(),where:r.mode==="append"?"added to "+r.title:(r.reminder?"⏰ "+r.reminder.slice(0,16).replace("T"," "):r.category)});
        put(RECENT,rc.slice(0,30)); render(); return r;
      });
    });
  }
  function save(text){
    text=String(text||"").trim(); if(!text&&!pending.length) return;
    var files=pending.slice();
    $("save").disabled=true; $("result").style.display="none";
    status(files.length?"⬆️ Uploading "+files.length+" file"+(files.length>1?"s":"")+"…":"💭 Filing it…");
    send(text,files).then(function(r){
      pending=[]; drawFiles(); $("txt").value=""; status(""); showResult(r); $("save").disabled=false; $("txt").focus();
    }).catch(function(){
      $("save").disabled=false;
      if(files.length){ status("📶 No connection — photos are kept here. Tap Save again when online."); return; }
      var q=get(QUEUE,[]); q.push({qid:genId(),text:text}); put(QUEUE,q);
      $("txt").value=""; status("📱 Saved on phone · will file it when online"); render();
    });
  }

  $("save").onclick=function(){save($("txt").value);};
  $("txt").addEventListener("keydown",function(ev){if(ev.key==="Enter"&&(ev.metaKey||ev.ctrlKey)){ev.preventDefault();save($("txt").value);}});
  window.addEventListener("online",flush);
  document.addEventListener("visibilitychange",function(){if(!document.hidden){flush();$("txt").focus();}});

  function start(){
    $("pinBox").style.display="none"; $("main").style.display="block";
    render(); flush();
    var t=Q.get("t");
    if(t){ history.replaceState({},"",location.pathname+(USER!=="main"?"?user="+encodeURIComponent(USER):""));
      if(Q.has("auto")) save(t); else $("txt").value=t; }
    $("txt").focus();
  }

  // Same PIN as the tracker, asked once per device.
  function hash(pin){
    try{return crypto.subtle.digest("SHA-256",new TextEncoder().encode("rkpin:"+pin)).then(function(b){
      return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0");}).join("");});}
    catch(e){return Promise.resolve("plain:"+pin);}
  }
  if(localStorage.getItem(PINOK)==="1"){ start(); }
  else{
    $("main").style.display="none";
    api("getPortfolio",{key:"user_pins",user:"main"}).then(function(r){
      var map=(r&&r.data)||{};
      if(!map[USER]){ start(); return; }
      $("pinBox").style.display="flex"; $("pin").focus();
      var go=function(){ hash($("pin").value.trim()).then(function(h){
        if(h===map[USER]){localStorage.setItem(PINOK,"1");start();} else $("pinErr").textContent="Wrong PIN";});};
      $("pinGo").onclick=go;
      $("pin").addEventListener("keydown",function(e){if(e.key==="Enter")go();});
    }).catch(function(){ start(); });
  }
})();
</script>
</body>
</html>
