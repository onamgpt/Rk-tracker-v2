<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tally · Onam</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;color:#1b2430;font:15px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#14532d;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px;flex:1}
header a{color:#d1fae5;font-size:13px;text-decoration:none;border:1px solid #2f7a4d;border-radius:8px;padding:5px 9px}
.wrap{max-width:980px;margin:0 auto;padding:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{padding:9px 13px;border-radius:9px;border:1px solid #c9d2dc;background:#fff;font-weight:700;font-size:14px;cursor:pointer}
.tabs button.on{background:#14532d;color:#fff;border-color:#14532d}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card h2{font-size:14px;margin:0 0 10px;color:#14532d;text-transform:uppercase;letter-spacing:.3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kpi{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.kpi b{display:block;font-size:22px}.kpi span{font-size:12.5px;color:#5a6676}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:6px;border-bottom:1px solid #edf0f3;text-align:left;vertical-align:top}
th{font-size:12px;color:#5a6676}
td.n,th.n{text-align:right;white-space:nowrap}
.btn{padding:9px 13px;border-radius:9px;border:1px solid #c9d2dc;background:#fff;font-weight:700;cursor:pointer;font-size:14px}
.pri{background:#14532d;color:#fff;border-color:#14532d}
.hint{font-size:13px;color:#6b7686}
.drop{border:2px dashed #9fb3a6;border-radius:12px;padding:22px;text-align:center;background:#f7fbf8;cursor:pointer}
.drop.on{background:#e7f6ec;border-color:#14532d}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:9px;background:#eef2f7}
.tag.r{background:#fde8e8;color:#b42318}.tag.a{background:#fff1dc;color:#8a4b00}.tag.g{background:#e3f6ec;color:#11704a}
.log{font-size:13px;margin-top:8px;white-space:pre-wrap}
.pin{max-width:320px;margin:15vh auto;text-align:center}
.pin input{font-size:26px;text-align:center;letter-spacing:8px;margin:12px 0;width:100%;padding:10px;border:1px solid #c9d2dc;border-radius:9px}
input,textarea,select{font:inherit;padding:9px;border:1px solid #c9d2dc;border-radius:9px;width:100%}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<div id="pinBox" class="pin" hidden>
  <div style="font-size:34px">📒</div><h2 style="margin:6px 0">Tally</h2>
  <div class="hint">Enter your tracker PIN</div>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off">
  <button class="btn pri" id="pinGo" style="width:100%">Open</button>
  <div id="pinErr" style="color:#b42318;margin-top:10px"></div>
</div>
<div id="app" hidden>
<header><h1>📒 Tally <span id="asof" style="font-size:13px;font-weight:400;opacity:.85"></span></h1><a href="/">Tracker</a></header>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  var USER=(new URLSearchParams(location.search).get("user")||"main").toLowerCase();
  var OWNER=USER==="main", PK="tally_pin_"+USER, pin=sessionStorage.getItem(PK)||"";
  var D=null, tab=OWNER?"home":"upload";
  try{ var _qt=new URLSearchParams(location.search).get("tab"); if(_qt&&OWNER) tab=_qt; }catch(e){}
  var CSDD=null;
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function inr(n){var v=Math.round(Number(n)||0);return (v<0?"-":"")+"₹"+Math.abs(v).toLocaleString("en-IN");}
  function api(a,x){ return fetch("/.netlify/functions/tally",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({action:a,user:USER,pin:pin},x||{}))}).then(function(r){return r.json();}); }
  function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

  /* ===================== Tally file reading (in the browser) ===================== */
  var MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  function tdate(s){ s=String(s||"").trim(); var m;
    if((m=s.match(/^(\d{4})(\d{2})(\d{2})$/))) return m[1]+"-"+m[2]+"-"+m[3];
    if((m=s.match(/^(\d{1,2})[-\s\/]([A-Za-z]{3})[A-Za-z]*[-\s\/](\d{2,4})$/))){ var y=+m[3]; if(y<100) y+=2000; return y+"-"+String(MON[m[2].toLowerCase()]||1).padStart(2,"0")+"-"+String(+m[1]).padStart(2,"0"); }
    if((m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})$/))){ var y2=+m[3]; if(y2<100) y2+=2000; return y2+"-"+String(+m[2]).padStart(2,"0")+"-"+String(+m[1]).padStart(2,"0"); }
    return s; }
  function num(s){ if(s==null) return 0; var m=String(s).replace(/,/g,"").match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):0; }
  function txt(el,tag){ if(!el) return ""; var x=el.getElementsByTagName(tag)[0]; return x?x.textContent.trim():""; }
  function readText(file){ return file.arrayBuffer().then(function(buf){ var b=new Uint8Array(buf);
    var enc=(b[0]===0xFF&&b[1]===0xFE)?"utf-16le":(b[0]===0xFE&&b[1]===0xFF)?"utf-16be":(b.length>1&&b[1]===0&&b[0]!==0)?"utf-16le":"utf-8";
    return new TextDecoder(enc).decode(buf); }); }
  function parseXml(t){
    t=t.replace(/^\uFEFF/,"").replace(/&#(?:[0-8]|1[124-9]|2[0-9]|3[01]);/g," ").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g," ");
    var x=new DOMParser().parseFromString(t,"text/xml"); if(x.getElementsByTagName("parsererror").length) throw new Error("This file isn't valid XML");
    return x; }
  function kindOf(x,name){
    if(x.getElementsByTagName("VOUCHER").length) return "vouchers";
    if(x.getElementsByTagName("BILLFIXED").length) return /pay|creditor/i.test(name)?"pay":"recv";
    if(x.getElementsByTagName("DSPSTKINFO").length||x.getElementsByTagName("DSPCLQTY").length) return "stock";
    if(x.getElementsByTagName("DSPACCNAME").length) return "tb";
    return null; }
  function parseVouchers(x){
    // same rules as the server reader (tally-parse.js voucherFromEl)
    var anyEW=x.getElementsByTagName("EWAYBILLDETAILS.LIST").length>0;
    var all=function(el,tag){ return Array.prototype.slice.call(el.getElementsByTagName(tag)); };
    var own=function(el,tag){ for(var i=0;i<el.children.length;i++) if(el.children[i].tagName===tag) return el.children[i].textContent.trim(); return ""; };
    return all(x,"VOUCHER").map(function(v){
      var party=txt(v,"PARTYLEDGERNAME")||txt(v,"PARTYNAME"), amt=0, best=0, le=[];
      all(v,"ALLLEDGERENTRIES.LIST").concat(all(v,"LEDGERENTRIES.LIST")).forEach(function(l){ var name=own(l,"LEDGERNAME"), raw=num(own(l,"AMOUNT")), a=Math.abs(raw);
        if(party&&name===party) amt=a; if(a>best) best=a; if(name&&le.length<10) le.push({l:name.slice(0,50),a:Math.round(raw*100)/100}); });
      var items=all(v,"ALLINVENTORYENTRIES.LIST").concat(all(v,"INVENTORYENTRIES.LIST")).slice(0,30).map(function(ie){ return {i:txt(ie,"STOCKITEMNAME"),q:num(txt(ie,"BILLEDQTY")||txt(ie,"ACTUALQTY")),a:Math.abs(num(txt(ie,"AMOUNT")))}; });
      var o={d:tdate(own(v,"DATE")||txt(v,"DATE")),t:v.getAttribute("VCHTYPE")||txt(v,"VOUCHERTYPENAME"),n:own(v,"VOUCHERNUMBER")||txt(v,"VOUCHERNUMBER"),p:party,a:amt||best,r:txt(v,"NARRATION").slice(0,160),_xml:1};
      if(items.length) o.i=items; if(le.length) o.le=le;
      var mid=own(v,"MASTERID"), alt=own(v,"ALTERID"); if(mid) o.m=mid; if(alt) o.al=alt;
      if(/^yes$/i.test(own(v,"ISCANCELLED"))||/^yes$/i.test(own(v,"ISDELETED"))) o.c=1;
      if(/^yes$/i.test(own(v,"ISOPTIONAL"))) o.o=1;
      var bank=all(v,"BANKALLOCATIONS.LIST"), ch=bank.map(function(b){ return txt(b,"INSTRUMENTNUMBER"); }).filter(Boolean);
      if(ch.length){ o.ch=ch.join(","); o.chd=tdate(txt(bank[0],"INSTRUMENTDATE")); o.tt=txt(bank[0],"TRANSACTIONTYPE"); }
      if(anyEW) o.ew=all(v,"EWAYBILLDETAILS.LIST").map(function(e){ return txt(e,"BILLNUMBER"); }).filter(Boolean).join(",");
      var irn=txt(v,"IRNACKNO")||txt(v,"IRN"); if(irn) o.irn=irn;
      return o;
    }).filter(function(v){return v.d&&/^\d{4}-\d{2}-\d{2}$/.test(v.d);});
  }

  function walk(x,fn){ var root=x.documentElement, kids=root.children; for(var i=0;i<kids.length;i++) fn(kids[i]); }
  function parseTB(x){ var rows=[],cur=null;
    walk(x,function(el){ if(el.tagName==="DSPACCNAME"){ cur={name:txt(el,"DSPDISPNAME")||el.textContent.trim(),dr:0,cr:0}; rows.push(cur); }
      else if(el.tagName==="DSPACCINFO"&&cur){ cur.dr=Math.abs(num(txt(el,"DSPCLDRAMTA")||txt(el,"DSPCLDRAMT"))); cur.cr=Math.abs(num(txt(el,"DSPCLCRAMTA")||txt(el,"DSPCLCRAMT"))); } });
    return rows.filter(function(r){return r.name;}); }
  function parseBills(x){ var rows=[],cur=null;
    walk(x,function(el){ var t=el.tagName;
      if(t==="BILLFIXED"){ cur={date:tdate(txt(el,"BILLDATE")),ref:txt(el,"BILLREF"),party:txt(el,"BILLPARTY"),amt:0,due:"",over:0}; rows.push(cur); }
      else if(cur&&t==="BILLCL") cur.amt=Math.abs(num(el.textContent));
      else if(cur&&t==="BILLDUE") cur.due=tdate(el.textContent);
      else if(cur&&t==="BILLOVERDUE") cur.over=num(el.textContent); });
    var td=new Date(today()+"T00:00:00");
    rows.forEach(function(r){ if(!r.over&&r.date&&/^\d{4}/.test(r.date)) r.over=Math.max(0,Math.round((td-new Date(r.date+"T00:00:00"))/864e5)); });
    return rows.filter(function(r){return r.party||r.ref;}); }
  function parseStock(x){ var rows=[],cur=null;
    walk(x,function(el){ if(el.tagName==="DSPACCNAME"){ cur={item:txt(el,"DSPDISPNAME")||el.textContent.trim(),qty:0,unit:"",rate:0,val:0}; rows.push(cur); }
      else if(el.tagName==="DSPSTKINFO"&&cur){ var q=txt(el,"DSPCLQTY"); cur.qty=num(q); cur.unit=(q.match(/[A-Za-z]+/)||[""])[0]; cur.rate=num(txt(el,"DSPCLRATE")); cur.val=Math.abs(num(txt(el,"DSPCLAMTA")||txt(el,"DSPCLAMT"))); } });
    return rows.filter(function(r){return r.item;}); }

  /* ---------- Excel and PDF support (libraries loaded from cdnjs when needed) ---------- */
  var LIBS={};
  function loadScript(src){ return new Promise(function(res,rej){ var sc=document.createElement("script"); sc.src=src; sc.onload=res; sc.onerror=function(){ rej(new Error("couldn't load a helper library — check internet")); }; document.head.appendChild(sc); }); }
  function xlsxLib(){ if(window.XLSX) return Promise.resolve(window.XLSX); if(!LIBS.x) LIBS.x=loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js").then(function(){ return window.XLSX; }); return LIBS.x; }
  function pdfLib(){ if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib); if(!LIBS.p) LIBS.p=loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js").then(function(){ window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; return window.pdfjsLib; }); return LIBS.p; }
  function readRowsExcel(file){ return file.arrayBuffer().then(function(buf){ return xlsxLib().then(function(X){
    var wb=X.read(new Uint8Array(buf),{type:"array",cellDates:true}); return wb.SheetNames.map(function(n){ return {name:n,rows:X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null,blankrows:false})}; }); }); }); }
  function readRowsPdf(file){ return file.arrayBuffer().then(function(buf){ return pdfLib().then(function(P){ return P.getDocument({data:new Uint8Array(buf)}).promise.then(function(doc){
    var pages=[], chain=Promise.resolve();
    for(var i=1;i<=doc.numPages;i++){ (function(n){ chain=chain.then(function(){ return doc.getPage(n).then(function(pg){ return pg.getTextContent(); }).then(function(tc){ pages.push(tc.items); }); }); })(i); }
    return chain.then(function(){ var rows=[];
      pages.forEach(function(items){ var lines={}; items.forEach(function(it){ if(!it.str||!it.str.trim()) return; var y=Math.round(it.transform[5]); (lines[y]=lines[y]||[]).push({x:it.transform[4],s:it.str,w:it.width||0}); });
        Object.keys(lines).map(Number).sort(function(a,b){return b-a;}).forEach(function(y){ var arr=lines[y].sort(function(a,b){return a.x-b.x;}), cells=[], cur=null;
          arr.forEach(function(t){ if(!cur||t.x-cur.end>10){ cur={text:t.s,end:t.x+t.w}; cells.push(cur); } else { cur.text+=" "+t.s; cur.end=t.x+t.w; } });
          rows.push(cells.map(function(c){ return c.text.trim(); })); }); });
      return [{name:file.name,rows:rows}]; }); }); }); }); }
  function dateOf(v){ if(v&&typeof v.getFullYear==="function"&&!isNaN(v.getTime())) return v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0");
    if(typeof v==="number"&&v>20000&&v<80000){ var u=new Date(Math.round((v-25569)*864e5)); return dateOf(new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate())); }
    return tdate(v==null?"":v); }
  function classifyRows(sheets,fname){
    var head=""; sheets.forEach(function(s){ (s.rows||[]).slice(0,14).forEach(function(r){ head+=(r||[]).map(function(c){ return c==null?"":String(c); }).join(" ")+"\n"; }); });
    var k=null;
    if(/day\s*book/i.test(head)) k="vouchers"; else if(/trial\s*balance/i.test(head)) k="tb"; else if(/bills\s*payable/i.test(head)) k="pay"; else if(/bills\s*receivable/i.test(head)) k="recv"; else if(/stock\s*summary/i.test(head)) k="stock";
    if(!k){ var f=fname.toLowerCase(); if(/day.?book/.test(f)) k="vouchers"; else if(/trial/.test(f)) k="tb"; else if(/pay/.test(f)) k="pay"; else if(/recei|debtor/.test(f)) k="recv"; else if(/stock/.test(f)) k="stock"; }
    return k; }
  function dayBookRows(rows){ var out=[]; rows.forEach(function(r){ r=r||[]; var d=dateOf(r[0]); if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return; var t=String(r[2]==null?"":r[2]).trim(); if(!t) return;
    var v={d:d,t:t,n:String(r[3]==null?"":r[3]),p:String(r[1]==null?"":r[1]).trim(),a:Math.max(Math.abs(num(r[4])),Math.abs(num(r[5]))),r:""};
    if(r.some(function(c){ return /\bcancel+ed\b|\(cancel/i.test(String(c==null?"":c)); })) v.c=1;
    out.push(v); }); return out; }
  function tbRows(rows){ var hi=-1; for(var i=0;i<rows.length;i++){ if((rows[i]||[]).some(function(c){ return /^debit$/i.test(String(c==null?"":c).trim()); })){ hi=i; break; } } if(hi<0) return [];
    var out=[]; for(var j=hi+1;j<rows.length;j++){ var r=rows[j]||[], name=String(r[0]==null?"":r[0]).trim(); if(!name) continue; if(/grand total/i.test(name)) break; out.push({name:name,dr:Math.abs(num(r[1])),cr:Math.abs(num(r[2]))}); } return out; }
  function billRows(rows){ var hi=-1; rows.some(function(r,i){ if((r||[]).some(function(c){ return /party/i.test(String(c==null?"":c)); })){ hi=i; return true; } return false; }); if(hi<0) return [];
    var td=new Date(today()+"T00:00:00"), out=[];
    for(var i=hi+1;i<rows.length;i++){ var r=rows[i]||[], party=String(r[2]==null?"":r[2]).trim(); if(!party||/total/i.test(party)) continue;
      var d=dateOf(r[0]), due=dateOf(r[4]), over=num(r[5]);
      if(!over&&/^\d{4}-\d{2}-\d{2}$/.test(d)) over=Math.max(0,Math.round((td-new Date(d+"T00:00:00"))/864e5));
      out.push({date:/^\d{4}/.test(d)?d:"",ref:String(r[1]==null?"":r[1]),party:party,amt:Math.abs(num(r[3])),due:/^\d{4}/.test(due)?due:"",over:over}); }
    return out; }
  function stockRows(rows){ var hi=-1; for(var i=0;i<rows.length;i++){ if((rows[i]||[]).some(function(c){ return /closing/i.test(String(c==null?"":c)); })){ hi=i; break; } } if(hi<0) return [];
    var sub=rows[hi+1]||[], idx=function(re){ return sub.findIndex(function(c){ return re.test(String(c==null?"":c)); }); };
    var q=idx(/qty/i), rt=idx(/rate/i), v=idx(/value|amount/i); if(q<0&&v<0) return [];
    var out=[]; for(var j=hi+2;j<rows.length;j++){ var r=rows[j]||[], name=String(r[0]==null?"":r[0]).trim(); if(!name||/total/i.test(name)) continue;
      var qs=String(r[q]==null?"":r[q]); out.push({item:name,qty:num(qs),unit:(qs.match(/[A-Za-z]+/)||[""])[0],rate:rt>=0?num(r[rt]):0,val:v>=0?Math.abs(num(r[v])):0}); }
    return out; }

  function b64(buf){ var b=new Uint8Array(buf), out="", step=0x8000; for(var i=0;i<b.length;i+=step){ out+=String.fromCharCode.apply(null,b.subarray(i,i+step)); } return btoa(out); }
  function vaultKeep(f,kind,data,line){
    return f.arrayBuffer().then(function(buf){
      var big=buf.byteLength>4.3*1024*1024;
      return api("vaultSave",{kind:kind||null,total:(data||[]).length,preview:(data||[]).slice(0,40),file:{name:f.name,type:f.type||"",data:big?"":b64(buf)}})
        .then(function(r){ if(line) line(r&&r.ok?(big?"   🗄 noted in Vault (file too large to keep a copy)":"   🗄 copy kept in Vault"):"   ⚠ Vault: "+((r&&r.error)||"not saved")); });
    }).catch(function(){});
  }
  /* ---------- bank statements (CSV / Excel) ---------- */
  function bkNum(v){ if(v==null||v==="") return 0; if(typeof v==="number") return v; var t=String(v).replace(/[,\s₹]/g,"").replace(/^\((.*)\)$/,"-$1"); var m=t.match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):0; }
  function bkDate(v){
    if(v==null||v==="") return "";
    if(typeof v==="number"&&v>20000&&v<80000){ var d=new Date(Math.round((v-25569)*864e5)); return d.toISOString().slice(0,10); }
    if(Object.prototype.toString.call(v)==="[object Date]"&&!isNaN(v)) return new Date(v.getTime()-v.getTimezoneOffset()*6e4).toISOString().slice(0,10);
    var t=String(v).trim(), M={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12}, m;
    if((m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[3]).slice(-2);
    if((m=t.match(/^(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{2,4})/))){ var y=+m[3]; if(y<100) y+=2000; return y+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2); }
    if((m=t.match(/^(\d{1,2})[\s\-\/]*([A-Za-z]{3})[A-Za-z]*[\s\-\/,]*(\d{2,4})/))&&M[m[2].toLowerCase()]){ var yy=+m[3]; if(yy<100) yy+=2000; return yy+"-"+("0"+M[m[2].toLowerCase()]).slice(-2)+"-"+("0"+m[1]).slice(-2); }
    return "";
  }
  function bankParse(rows){
    var hi=-1, col={};
    for(var i=0;i<Math.min(rows.length,60)&&hi<0;i++){
      var r=(rows[i]||[]).map(function(c){ return String(c==null?"":c).toLowerCase().replace(/\s+/g," ").trim(); }), c={};
      r.forEach(function(h,j){
        if(c.date==null&&/(txn|tran|transaction|post|value)?\s*date/.test(h)&&!/value date/.test(h)) c.date=j;
        if(c.vdate==null&&/value date/.test(h)) c.vdate=j;
        if(c.desc==null&&/narration|description|particular|details|remark/.test(h)) c.desc=j;
        if(c.ref==null&&/ref|chq|cheque|utr|instrument/.test(h)&&!/date/.test(h)) c.ref=j;
        var isType=/dr\s*\/\s*cr|cr\s*\/\s*dr|^type$|debit\s*\/\s*credit/.test(h);
        if(!isType&&c.dr==null&&/withdraw|debit|\bdr\b|paid out|money out/.test(h)&&!/credit/.test(h)) c.dr=j;
        if(!isType&&c.cr==null&&/deposit|credit|\bcr\b|paid in|money in/.test(h)&&!/debit/.test(h)) c.cr=j;
        if(c.amt==null&&/^amount|transaction amount|txn amount/.test(h)) c.amt=j;

  function gstCalc(p){ var n=function(k){ return Number(p[k])||0; }, att=n("adjTurnover"), ii=n("itcInputs"), is=n("itcServices");
    var p1=att?n("invertedTurnover")*ii/att:0, p2=(ii+is)?n("taxOnInverted")*(ii/(ii+is)):0, inv=Math.max(0,p1-p2), ex=att?Math.max(0,n("zeroRatedTurnover")*(ii+is)/att):0, tot=inv+ex;
    var led=(p.ledgerBalance===""||p.ledgerBalance==null)?null:n("ledgerBalance");

    for(var y2=y0;y2<=yNow;y2++){ var s0=new Date(y2+"-04-01T00:00:00"), e0=new Date((y2+1)+"-03-31T00:00:00"), from=new Date(Math.max(s0,new Date(a.date+"T00:00:00")));

      '<div class="card"><h2>Earlier questions</h2><div id="askLog" class="hint">Loading…</div></div>';
    drawChat();
    $("askGo").onclick=function(){ ask($("q").value.trim()); };
    $("q").addEventListener("keydown",function(e){ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)) $("askGo").click(); });
    $("askNew").onclick=function(){ CHAT=[]; drawChat(); };
    Array.prototype.forEach.call(document.querySelectorAll("[data-sg]"),function(b){ b.onclick=function(){ ask(SUGGEST[+b.dataset.sg]); }; });
    api("askLog").then(function(r){ var l=(r&&r.log)||[]; if(!$("askLog")) return;
      $("askLog").innerHTML=l.length?l.slice(0,10).map(function(x,i){ return '<details style="margin:6px 0"><summary><b>'+esc(x.q)+'</b> <span class="hint">· '+esc(new Date(x.at).toLocaleString("en-IN"))+'</span></summary><div style="margin-top:6px;color:#1b2430">'+md(x.a)+'</div></details>'; }).join(""):"No questions yet."; });
  }
  function drawChat(){ var el=$("chat"); if(!el) return;
    el.innerHTML=CHAT.map(function(m){ return '<div style="margin:8px 0;padding:10px;border-radius:10px;'+(m.role==="q"?'background:#eef6f1;font-weight:600':'background:#fff;border:1px solid #e3e8ef')+'">'+(m.role==="q"?esc(m.t):md(m.t))+'</div>'; }).join("")+(busy?'<div class="hint" style="margin:8px 0">🤖 Thinking… (usually 10–30 seconds)</div>':''); }
  function ask(q){ if(!q||busy) return; busy=true; $("q").value="";
    var history=[]; for(var i=0;i+1<CHAT.length;i+=2) history.push({q:CHAT[i].t,a:CHAT[i+1].t});
    CHAT.push({role:"q",t:q}); drawChat();
    api("ask",{q:q,history:history}).then(function(r){
      if(!r.ok){ busy=false; CHAT.push({role:"a",t:"⚠ "+(r.error||"Couldn't ask")}); drawChat(); return; }
      var tries=0;(function poll(){ setTimeout(function(){ api("askResult",{id:r.id}).then(function(x){
        if(x.status==="done"){ busy=false; CHAT.push({role:"a",t:x.answer}); drawChat(); }
        else if(x.status==="error"){ busy=false; CHAT.push({role:"a",t:"⚠ "+x.error}); drawChat(); }
        else if(++tries<40) poll(); else { busy=false; CHAT.push({role:"a",t:"⚠ Taking too long — please try again."}); drawChat(); }
      }).catch(function(){ if(++tries<40) poll(); }); },3000); })();
    }).catch(function(){ busy=false; CHAT.push({role:"a",t:"⚠ No internet"}); drawChat(); });
  }

  function load(){ api("get").then(function(r){ if(r.ok){ D=r; if(tab!=="upload") draw(); else if($("asof")&&D.meta&&D.meta.vouchers) $("asof").textContent="· data up to "+D.meta.vouchers.upTo; } }); }

  /* ===================== PIN ===================== */
  function lock(err){ $("app").hidden=true; $("pinBox").hidden=false; $("pinErr").textContent=err||""; }
  function start(){
    var probe=OWNER?api("get"):api("ingest",{kind:"none"});
    probe.then(function(r){
      if(r.error==="pin") return lock(pin?"Wrong PIN":"");
      if(r.error==="nopin") return lock("No PIN set for this user — set it in the tracker: Menu → 🔒 PIN Access.");
      if(r.error==="not allowed") return lock("This user can't upload Tally files.");
      sessionStorage.setItem(PK,pin); $("pinBox").hidden=true; $("app").hidden=false;
      if(OWNER&&r.ok){ D=r; } draw();
    }).catch(function(){ lock("No internet — try again"); });
  }
  $("pinGo").onclick=function(){ pin=$("pin").value.trim(); if(pin) start(); };
  $("pin").addEventListener("keydown",function(e){ if(e.key==="Enter") $("pinGo").click(); });
  if(pin) start(); else lock("");
  window.__tally={dayBookRows:dayBookRows,tbRows:tbRows,billRows:billRows,stockRows:stockRows,classifyRows:classifyRows,parseXml:parseXml,kindOf:kindOf,parseVouchers:parseVouchers,parseTB:parseTB,parseBills:parseBills,parseStock:parseStock};
})();
</script>
