<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tally · Onam</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;color:#1b2430;font:15px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#14532d;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px;flex:1}
header a{color:#d1fae5;font-size:13px;text-decoration:none;border:1px solid #2f7a4d;border-radius:8px;padding:5px 9px}
.wrap{max-width:980px;margin:0 auto;padding:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{padding:9px 13px;border-radius:9px;border:1px solid #c9d2dc;background:#fff;font-weight:700;font-size:14px;cursor:pointer}
.tabs button.on{background:#14532d;color:#fff;border-color:#14532d}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card h2{font-size:14px;margin:0 0 10px;color:#14532d;text-transform:uppercase;letter-spacing:.3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.kpi{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.kpi b{display:block;font-size:22px}.kpi span{font-size:12.5px;color:#5a6676}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:6px;border-bottom:1px solid #edf0f3;text-align:left;vertical-align:top}
th{font-size:12px;color:#5a6676}
td.n,th.n{text-align:right;white-space:nowrap}
.btn{padding:9px 13px;border-radius:9px;border:1px solid #c9d2dc;background:#fff;font-weight:700;cursor:pointer;font-size:14px}
.pri{background:#14532d;color:#fff;border-color:#14532d}
.hint{font-size:13px;color:#6b7686}
.drop{border:2px dashed #9fb3a6;border-radius:12px;padding:22px;text-align:center;background:#f7fbf8;cursor:pointer}
.drop.on{background:#e7f6ec;border-color:#14532d}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:9px;background:#eef2f7}
.tag.r{background:#fde8e8;color:#b42318}.tag.a{background:#fff1dc;color:#8a4b00}.tag.g{background:#e3f6ec;color:#11704a}
.log{font-size:13px;margin-top:8px;white-space:pre-wrap}
.pin{max-width:320px;margin:15vh auto;text-align:center}
.pin input{font-size:26px;text-align:center;letter-spacing:8px;margin:12px 0;width:100%;padding:10px;border:1px solid #c9d2dc;border-radius:9px}
input,textarea,select{font:inherit;padding:9px;border:1px solid #c9d2dc;border-radius:9px;width:100%}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<div id="pinBox" class="pin" hidden>
  <div style="font-size:34px">📒</div><h2 style="margin:6px 0">Tally</h2>
  <div class="hint">Enter your tracker PIN</div>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off">
  <button class="btn pri" id="pinGo" style="width:100%">Open</button>
  <div id="pinErr" style="color:#b42318;margin-top:10px"></div>
</div>
<div id="app" hidden>
<header><h1>📒 Tally <span id="asof" style="font-size:13px;font-weight:400;opacity:.85"></span></h1><a href="/">Tracker</a></header>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  var USER=(new URLSearchParams(location.search).get("user")||"main").toLowerCase();
  var OWNER=USER==="main", PK="tally_pin_"+USER, pin=sessionStorage.getItem(PK)||"";
  var D=null, tab=OWNER?"home":"upload";
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function inr(n){var v=Math.round(Number(n)||0);return (v<0?"-":"")+"₹"+Math.abs(v).toLocaleString("en-IN");}
  function api(a,x){ return fetch("/.netlify/functions/tally",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({action:a,user:USER,pin:pin},x||{}))}).then(function(r){return r.json();}); }
  function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

  /* ===================== Tally file reading (in the browser) ===================== */
  var MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  function tdate(s){ s=String(s||"").trim(); var m;
    if((m=s.match(/^(\d{4})(\d{2})(\d{2})$/))) return m[1]+"-"+m[2]+"-"+m[3];
    if((m=s.match(/^(\d{1,2})[-\s\/]([A-Za-z]{3})[A-Za-z]*[-\s\/](\d{2,4})$/))){ var y=+m[3]; if(y<100) y+=2000; return y+"-"+String(MON[m[2].toLowerCase()]||1).padStart(2,"0")+"-"+String(+m[1]).padStart(2,"0"); }
    if((m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})$/))){ var y2=+m[3]; if(y2<100) y2+=2000; return y2+"-"+String(+m[2]).padStart(2,"0")+"-"+String(+m[1]).padStart(2,"0"); }
    return s; }
  function num(s){ if(s==null) return 0; var m=String(s).replace(/,/g,"").match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):0; }
  function txt(el,tag){ if(!el) return ""; var x=el.getElementsByTagName(tag)[0]; return x?x.textContent.trim():""; }
  function readText(file){ return file.arrayBuffer().then(function(buf){ var b=new Uint8Array(buf);
    var enc=(b[0]===0xFF&&b[1]===0xFE)?"utf-16le":(b[0]===0xFE&&b[1]===0xFF)?"utf-16be":(b.length>1&&b[1]===0&&b[0]!==0)?"utf-16le":"utf-8";
    return new TextDecoder(enc).decode(buf); }); }
  function parseXml(t){
    t=t.replace(/^\uFEFF/,"").replace(/&#(?:[0-8]|1[124-9]|2[0-9]|3[01]);/g," ").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g," ");
    var x=new DOMParser().parseFromString(t,"text/xml"); if(x.getElementsByTagName("parsererror").length) throw new Error("This file isn't valid XML");
    return x; }
  function kindOf(x,name){
    if(x.getElementsByTagName("VOUCHER").length) return "vouchers";
    if(x.getElementsByTagName("BILLFIXED").length) return /pay|creditor/i.test(name)?"pay":"recv";
    if(x.getElementsByTagName("DSPSTKINFO").length||x.getElementsByTagName("DSPCLQTY").length) return "stock";
    if(x.getElementsByTagName("DSPACCNAME").length) return "tb";
    return null; }
  function parseVouchers(x){
    return Array.prototype.map.call(x.getElementsByTagName("VOUCHER"),function(v){
      var party=txt(v,"PARTYLEDGERNAME")||txt(v,"PARTYNAME"), amt=0, best=0;
      var les=v.querySelectorAll("ALLLEDGERENTRIES\\.LIST, LEDGERENTRIES\\.LIST");
      Array.prototype.forEach.call(les,function(le){ var a=Math.abs(num(txt(le,"AMOUNT"))); if(party&&txt(le,"LEDGERNAME")===party) amt=a; if(a>best) best=a; });
      var items=Array.prototype.slice.call(v.querySelectorAll("ALLINVENTORYENTRIES\\.LIST, INVENTORYENTRIES\\.LIST"),0,30).map(function(ie){ return {i:txt(ie,"STOCKITEMNAME"),q:num(txt(ie,"BILLEDQTY")||txt(ie,"ACTUALQTY")),a:Math.abs(num(txt(ie,"AMOUNT")))}; }).filter(function(o){return o.i;});
      return {d:tdate(txt(v,"DATE")),t:v.getAttribute("VCHTYPE")||txt(v,"VOUCHERTYPENAME"),n:txt(v,"VOUCHERNUMBER"),p:party,a:amt||best,r:txt(v,"NARRATION").slice(0,120),i:items.length?items:undefined};
    }).filter(function(v){return v.d&&/^\d{4}-\d{2}-\d{2}$/.test(v.d);});
  }
  function walk(x,fn){ var root=x.documentElement, kids=root.children; for(var i=0;i<kids.length;i++) fn(kids[i]); }
  function parseTB(x){ var rows=[],cur=null;
    walk(x,function(el){ if(el.tagName==="DSPACCNAME"){ cur={name:txt(el,"DSPDISPNAME")||el.textContent.trim(),dr:0,cr:0}; rows.push(cur); }
      else if(el.tagName==="DSPACCINFO"&&cur){ cur.dr=Math.abs(num(txt(el,"DSPCLDRAMTA")||txt(el,"DSPCLDRAMT"))); cur.cr=Math.abs(num(txt(el,"DSPCLCRAMTA")||txt(el,"DSPCLCRAMT"))); } });
    return rows.filter(function(r){return r.name;}); }
  function parseBills(x){ var rows=[],cur=null;
    walk(x,function(el){ var t=el.tagName;
      if(t==="BILLFIXED"){ cur={date:tdate(txt(el,"BILLDATE")),ref:txt(el,"BILLREF"),party:txt(el,"BILLPARTY"),amt:0,due:"",over:0}; rows.push(cur); }
      else if(cur&&t==="BILLCL") cur.amt=Math.abs(num(el.textContent));
      else if(cur&&t==="BILLDUE") cur.due=tdate(el.textContent);
      else if(cur&&t==="BILLOVERDUE") cur.over=num(el.textContent); });
    var td=new Date(today()+"T00:00:00");
    rows.forEach(function(r){ if(!r.over&&r.date&&/^\d{4}/.test(r.date)) r.over=Math.max(0,Math.round((td-new Date(r.date+"T00:00:00"))/864e5)); });
    return rows.filter(function(r){return r.party||r.ref;}); }
  function parseStock(x){ var rows=[],cur=null;
    walk(x,function(el){ if(el.tagName==="DSPACCNAME"){ cur={item:txt(el,"DSPDISPNAME")||el.textContent.trim(),qty:0,unit:"",rate:0,val:0}; rows.push(cur); }
      else if(el.tagName==="DSPSTKINFO"&&cur){ var q=txt(el,"DSPCLQTY"); cur.qty=num(q); cur.unit=(q.match(/[A-Za-z]+/)||[""])[0]; cur.rate=num(txt(el,"DSPCLRATE")); cur.val=Math.abs(num(txt(el,"DSPCLAMTA")||txt(el,"DSPCLAMT"))); } });
    return rows.filter(function(r){return r.item;}); }

  /* ---------- Excel and PDF support (libraries loaded from cdnjs when needed) ---------- */
  var LIBS={};
  function loadScript(src){ return new Promise(function(res,rej){ var sc=document.createElement("script"); sc.src=src; sc.onload=res; sc.onerror=function(){ rej(new Error("couldn't load a helper library — check internet")); }; document.head.appendChild(sc); }); }
  function xlsxLib(){ if(window.XLSX) return Promise.resolve(window.XLSX); if(!LIBS.x) LIBS.x=loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js").then(function(){ return window.XLSX; }); return LIBS.x; }
  function pdfLib(){ if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib); if(!LIBS.p) LIBS.p=loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js").then(function(){ window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; return window.pdfjsLib; }); return LIBS.p; }
  function readRowsExcel(file){ return file.arrayBuffer().then(function(buf){ return xlsxLib().then(function(X){
    var wb=X.read(new Uint8Array(buf),{type:"array",cellDates:true}); return wb.SheetNames.map(function(n){ return {name:n,rows:X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null,blankrows:false})}; }); }); }); }
  function readRowsPdf(file){ return file.arrayBuffer().then(function(buf){ return pdfLib().then(function(P){ return P.getDocument({data:new Uint8Array(buf)}).promise.then(function(doc){
    var pages=[], chain=Promise.resolve();
    for(var i=1;i<=doc.numPages;i++){ (function(n){ chain=chain.then(function(){ return doc.getPage(n).then(function(pg){ return pg.getTextContent(); }).then(function(tc){ pages.push(tc.items); }); }); })(i); }
    return chain.then(function(){ var rows=[];
      pages.forEach(function(items){ var lines={}; items.forEach(function(it){ if(!it.str||!it.str.trim()) return; var y=Math.round(it.transform[5]); (lines[y]=lines[y]||[]).push({x:it.transform[4],s:it.str,w:it.width||0}); });
        Object.keys(lines).map(Number).sort(function(a,b){return b-a;}).forEach(function(y){ var arr=lines[y].sort(function(a,b){return a.x-b.x;}), cells=[], cur=null;
          arr.forEach(function(t){ if(!cur||t.x-cur.end>10){ cur={text:t.s,end:t.x+t.w}; cells.push(cur); } else { cur.text+=" "+t.s; cur.end=t.x+t.w; } });
          rows.push(cells.map(function(c){ return c.text.trim(); })); }); });
      return [{name:file.name,rows:rows}]; }); }); }); }); }
  function dateOf(v){ if(v&&typeof v.getFullYear==="function"&&!isNaN(v.getTime())) return v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0");
    if(typeof v==="number"&&v>20000&&v<80000){ var u=new Date(Math.round((v-25569)*864e5)); return dateOf(new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate())); }
    return tdate(v==null?"":v); }
  function classifyRows(sheets,fname){
    var head=""; sheets.forEach(function(s){ (s.rows||[]).slice(0,14).forEach(function(r){ head+=(r||[]).map(function(c){ return c==null?"":String(c); }).join(" ")+"\n"; }); });
    var k=null;
    if(/day\s*book/i.test(head)) k="vouchers"; else if(/trial\s*balance/i.test(head)) k="tb"; else if(/bills\s*payable/i.test(head)) k="pay"; else if(/bills\s*receivable/i.test(head)) k="recv"; else if(/stock\s*summary/i.test(head)) k="stock";
    if(!k){ var f=fname.toLowerCase(); if(/day.?book/.test(f)) k="vouchers"; else if(/trial/.test(f)) k="tb"; else if(/pay/.test(f)) k="pay"; else if(/recei|debtor/.test(f)) k="recv"; else if(/stock/.test(f)) k="stock"; }
    return k; }
  function dayBookRows(rows){ var out=[]; rows.forEach(function(r){ r=r||[]; var d=dateOf(r[0]); if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return; var t=String(r[2]==null?"":r[2]).trim(); if(!t) return;
    out.push({d:d,t:t,n:String(r[3]==null?"":r[3]),p:String(r[1]==null?"":r[1]).trim(),a:Math.max(Math.abs(num(r[4])),Math.abs(num(r[5]))),r:""}); }); return out; }
  function tbRows(rows){ var hi=-1; for(var i=0;i<rows.length;i++){ if((rows[i]||[]).some(function(c){ return /^debit$/i.test(String(c==null?"":c).trim()); })){ hi=i; break; } } if(hi<0) return [];
    var out=[]; for(var j=hi+1;j<rows.length;j++){ var r=rows[j]||[], name=String(r[0]==null?"":r[0]).trim(); if(!name) continue; if(/grand total/i.test(name)) break; out.push({name:name,dr:Math.abs(num(r[1])),cr:Math.abs(num(r[2]))}); } return out; }
  function billRows(rows){ var hi=-1; rows.some(function(r,i){ if((r||[]).some(function(c){ return /party/i.test(String(c==null?"":c)); })){ hi=i; return true; } return false; }); if(hi<0) return [];
    var td=new Date(today()+"T00:00:00"), out=[];
    for(var i=hi+1;i<rows.length;i++){ var r=rows[i]||[], party=String(r[2]==null?"":r[2]).trim(); if(!party||/total/i.test(party)) continue;
      var d=dateOf(r[0]), due=dateOf(r[4]), over=num(r[5]);
      if(!over&&/^\d{4}-\d{2}-\d{2}$/.test(d)) over=Math.max(0,Math.round((td-new Date(d+"T00:00:00"))/864e5));
      out.push({date:/^\d{4}/.test(d)?d:"",ref:String(r[1]==null?"":r[1]),party:party,amt:Math.abs(num(r[3])),due:/^\d{4}/.test(due)?due:"",over:over}); }
    return out; }
  function stockRows(rows){ var hi=-1; for(var i=0;i<rows.length;i++){ if((rows[i]||[]).some(function(c){ return /closing/i.test(String(c==null?"":c)); })){ hi=i; break; } } if(hi<0) return [];
    var sub=rows[hi+1]||[], idx=function(re){ return sub.findIndex(function(c){ return re.test(String(c==null?"":c)); }); };
    var q=idx(/qty/i), rt=idx(/rate/i), v=idx(/value|amount/i); if(q<0&&v<0) return [];
    var out=[]; for(var j=hi+2;j<rows.length;j++){ var r=rows[j]||[], name=String(r[0]==null?"":r[0]).trim(); if(!name||/total/i.test(name)) continue;
      var qs=String(r[q]==null?"":r[q]); out.push({item:name,qty:num(qs),unit:(qs.match(/[A-Za-z]+/)||[""])[0],rate:rt>=0?num(r[rt]):0,val:v>=0?Math.abs(num(r[v])):0}); }
    return out; }

  function handleFiles(files){
    var out=$("uplog"); out.textContent="";
    var line=function(t){ out.textContent+=t+"\n"; };
    var chain=Promise.resolve();
    Array.prototype.forEach.call(files,function(f){ chain=chain.then(function(){
      line("📄 "+f.name+" ("+Math.round(f.size/1024)+" KB) — reading…");
      var ext=(f.name.split(".").pop()||"").toLowerCase(), prep;
      if(ext==="xml") prep=readText(f).then(function(t){ var x=parseXml(t), k=kindOf(x,f.name); if(!k) throw new Error("Couldn't recognise this report"); return {k:k,x:x}; });
      else if(["xlsx","xls","xlsm","csv"].indexOf(ext)>=0) prep=readRowsExcel(f).then(function(sh){ var k=classifyRows(sh,f.name); if(!k) throw new Error("Couldn't recognise this report"); return {k:k,sheets:sh}; });
      else if(ext==="pdf") prep=readRowsPdf(f).then(function(sh){ var k=classifyRows(sh,f.name); if(!k) throw new Error("Couldn't recognise this report"); return {k:k,sheets:sh}; });
      else { line("   ⚠ Unsupported file type: ."+ext); return; }
      return prep.then(function(p){
        var label={vouchers:"Day Book",tb:"Trial Balance",recv:"Receivables",pay:"Payables",stock:"Stock Summary"}[p.k], data=[];
        if(p.x){ data = p.k==="vouchers"?parseVouchers(p.x): p.k==="tb"?parseTB(p.x): p.k==="stock"?parseStock(p.x): parseBills(p.x); }
        else p.sheets.forEach(function(s){ var rr=s.rows; data=data.concat(p.k==="vouchers"?dayBookRows(rr): p.k==="tb"?tbRows(rr): p.k==="stock"?stockRows(rr): billRows(rr)); });
        line("   ✓ "+label+": "+data.length+(p.k==="vouchers"?" vouchers":" rows")+(p.k==="vouchers"&&data.length?" ("+data[0].d+" → "+data[data.length-1].d+")":""));
        if(!data.length) throw new Error("No rows found in this file — check it is the full report");
        if(p.k==="vouchers"){
          var parts=[]; for(var i=0;i<data.length;i+=2500) parts.push(data.slice(i,i+2500));
          var c2=Promise.resolve(); parts.forEach(function(pt,j){ c2=c2.then(function(){ return api("ingest",{kind:"vouchers",data:pt,file:f.name}).then(function(r){ if(!r.ok) throw new Error(r.error||"upload failed"); if(parts.length>1) line("   …sent part "+(j+1)+" of "+parts.length); }); }); });
          return c2.then(function(){ line("   ✅ saved"); });
        }
        return api("ingest",{kind:p.k,data:data,asof:today(),file:f.name}).then(function(r){ line(r.ok?"   ✅ saved":"   ❌ "+(r.error||"failed")); });
      }).catch(function(e){ line("   ❌ "+e.message); });
    }); });
    chain.then(function(){ line("Done."); if(OWNER) load(); });
  }

  /* ===================== Views ===================== */
  var TABS=OWNER?[["home","🏠 Summary"],["recv","💰 Receivables"],["pay","🧾 Payables"],["sales","📈 Sales"],["stock","📦 Stock"],["check","🔎 Cross-check"],["upload","⬆ Upload"]]:[["upload","⬆ Upload"]];
  function drawTabs(){ $("tabs").innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'" class="'+(t[0]===tab?"on":"")+'">'+t[1]+'</button>';}).join("");
    Array.prototype.forEach.call($("tabs").children,function(b){ b.onclick=function(){ tab=b.dataset.t; draw(); }; }); }
  function sales(){ return (D.vouchers||[]).filter(function(v){return /sales/i.test(v.t)&&!/order|return|credit/i.test(v.t);}); }
  function ageBuckets(rows){ var b={"0–30":0,"31–60":0,"61–90":0,"90+":0}; rows.forEach(function(r){ var o=r.over||0, k=o<=30?"0–30":o<=60?"31–60":o<=90?"61–90":"90+"; b[k]+=r.amt||0; }); return b; }
  function draw(){
    drawTabs();
    if(tab==="upload") return drawUpload();
    if(!D) { $("view").innerHTML='<div class="card">Loading…</div>'; return; }
    var m=D.meta||{};
    $("asof").textContent=m.vouchers?"· data up to "+m.vouchers.upTo:"· no data yet";
    if(tab==="home"){
      var td=today(), mo=td.slice(0,7), s=sales();
      var sm=s.filter(function(v){return v.d.slice(0,7)===mo;}).reduce(function(a,v){return a+v.a;},0);
      var last=m.vouchers?m.vouchers.upTo:null, sl=s.filter(function(v){return v.d===last;}).reduce(function(a,v){return a+v.a;},0);
      var rv=(D.recv&&D.recv.rows)||[], py=(D.pay&&D.pay.rows)||[];
      var cashBank=((D.tb&&D.tb.rows)||[]).filter(function(r){return /cash|bank/i.test(r.name)&&!/interest|loan|\bod\b|occ|overdraft|charge/i.test(r.name);});
      $("view").innerHTML='<div class="kpis">'+
        '<div class="kpi"><span>Sales on '+esc(last||"—")+'</span><b>'+inr(sl)+'</b></div>'+
        '<div class="kpi"><span>Sales this month</span><b>'+inr(sm)+'</b></div>'+
        '<div class="kpi"><span>To receive</span><b>'+inr(rv.reduce(function(a,r){return a+r.amt;},0))+'</b></div>'+
        '<div class="kpi"><span>Over 90 days</span><b style="color:#b42318">'+inr(rv.filter(function(r){return r.over>90;}).reduce(function(a,r){return a+r.amt;},0))+'</b></div>'+
        '<div class="kpi"><span>To pay</span><b>'+inr(py.reduce(function(a,r){return a+r.amt;},0))+'</b></div></div>'+
        '<div class="card" style="margin-top:12px"><h2>Cash & bank (Trial Balance)</h2>'+(cashBank.length?'<table>'+cashBank.map(function(r){return '<tr><td>'+esc(r.name)+'</td><td class="n">'+inr(r.dr-r.cr)+'</td></tr>';}).join("")+'</table>':'<div class="hint">Upload the Trial Balance to see this.</div>')+'</div>'+
        '<div class="card"><h2>Last uploads</h2><table>'+["vouchers","tb","recv","pay","stock"].map(function(k){ var x=m[k]; return '<tr><td>'+({vouchers:"Day Book",tb:"Trial Balance",recv:"Receivables",pay:"Payables",stock:"Stock"})[k]+'</td><td>'+(x?esc(new Date(x.at).toLocaleString("en-IN"))+' · '+esc(x.by):'<span class="tag r">not yet</span>')+'</td></tr>'; }).join("")+'</table></div>'+
        '<div class="card"><h2>✉ Remind the accountant</h2><div class="hint">Goes by email to '+esc((D.settings||{}).accountantEmail)+'</div><textarea id="rem" rows="3" placeholder="e.g. Please post the 3 pending dispatch invoices"></textarea><button class="btn pri" id="remGo" style="margin-top:8px">Send</button> <span id="remMsg" class="hint"></span></div>';
      $("remGo").onclick=function(){ var t=$("rem").value.trim(); if(!t) return; $("remMsg").textContent="Sending…"; api("remind",{text:t}).then(function(r){ $("remMsg").textContent=r.ok?"✅ Sent":"❌ Not sent"; }); };
    }
    if(tab==="recv"||tab==="pay"){
      var rows=((tab==="recv"?D.recv:D.pay)||{rows:[]}).rows.slice().sort(function(a,b){return b.over-a.over;});
      var bk=ageBuckets(rows), byParty={};
      rows.forEach(function(r){ byParty[r.party]=(byParty[r.party]||0)+r.amt; });
      var top=Object.keys(byParty).sort(function(a,b){return byParty[b]-byParty[a];}).slice(0,10);
      $("view").innerHTML='<div class="kpis">'+Object.keys(bk).map(function(k){return '<div class="kpi"><span>'+k+' days</span><b'+(k==="90+"?' style="color:#b42318"':'')+'>'+inr(bk[k])+'</b></div>';}).join("")+'</div>'+
        '<div class="card" style="margin-top:12px"><h2>Top 10 '+(tab==="recv"?"customers":"suppliers")+'</h2><table>'+top.map(function(p){return '<tr><td>'+esc(p)+'</td><td class="n">'+inr(byParty[p])+'</td></tr>';}).join("")+'</table></div>'+
        '<div class="card scroll"><h2>All bills ('+rows.length+')</h2><table><tr><th>Party</th><th>Bill</th><th>Date</th><th class="n">Amount</th><th class="n">Days</th>'+(tab==="recv"?'<th></th>':'')+'</tr>'+
        rows.map(function(r,i){ return '<tr><td>'+esc(r.party)+'</td><td>'+esc(r.ref)+'</td><td>'+esc(r.date)+'</td><td class="n">'+inr(r.amt)+'</td><td class="n"><span class="tag '+(r.over>90?"r":r.over>45?"a":"g")+'">'+r.over+'</span></td>'+(tab==="recv"?'<td><button class="btn" data-ask="'+i+'" style="padding:4px 8px;font-size:12px">Ask accountant</button></td>':'')+'</tr>'; }).join("")+'</table></div>';
      Array.prototype.forEach.call(document.querySelectorAll("[data-ask]"),function(b){ b.onclick=function(){ var r=rows[+b.dataset.ask];
        var t="Please follow up the payment from "+r.party+" — bill "+r.ref+" dated "+r.date+", "+inr(r.amt)+", "+r.over+" days old. Let me know the expected date.";
        if(!confirm("Email this to the accountant?\n\n"+t)) return; api("remind",{text:t,subject:"Payment follow-up: "+r.party}).then(function(x){ b.textContent=x.ok?"✅ Sent":"❌"; }); }; });
    }
    if(tab==="sales"){
      var s2=sales(), byM={}, byP={}, byI={};
      s2.forEach(function(v){ byM[v.d.slice(0,7)]=(byM[v.d.slice(0,7)]||0)+v.a; byP[v.p]=(byP[v.p]||0)+v.a; (v.i||[]).forEach(function(it){ byI[it.i]=(byI[it.i]||0)+it.a; }); });
      var months=Object.keys(byM).sort().slice(-13), mx=Math.max.apply(null,months.map(function(k){return byM[k];}).concat([1]));
      var tp=Object.keys(byP).sort(function(a,b){return byP[b]-byP[a];}).slice(0,15), ti=Object.keys(byI).sort(function(a,b){return byI[b]-byI[a];}).slice(0,15);
      $("view").innerHTML='<div class="card"><h2>Sales by month</h2>'+months.map(function(k){ return '<div style="display:flex;gap:8px;align-items:center;margin:4px 0"><span style="width:70px;font-size:13px">'+k+'</span><div style="flex:1;background:#eef2f7;border-radius:6px"><div style="width:'+(100*byM[k]/mx).toFixed(1)+'%;background:#2f9e5b;height:16px;border-radius:6px"></div></div><span style="width:110px;text-align:right;font-size:13px">'+inr(byM[k])+'</span></div>'; }).join("")+'</div>'+
        '<div class="card"><h2>Top customers</h2><table>'+tp.map(function(p){return '<tr><td>'+esc(p||"—")+'</td><td class="n">'+inr(byP[p])+'</td></tr>';}).join("")+'</table></div>'+
        (ti.length?'<div class="card"><h2>Top products</h2><table>'+ti.map(function(p){return '<tr><td>'+esc(p)+'</td><td class="n">'+inr(byI[p])+'</td></tr>';}).join("")+'</table></div>':'');
    }
    if(tab==="stock"){
      var st=((D.stock||{}).rows||[]).slice().sort(function(a,b){return b.val-a.val;});
      $("view").innerHTML='<div class="card scroll"><h2>Stock ('+st.length+' items · '+inr(st.reduce(function(a,r){return a+r.val;},0))+')</h2><table><tr><th>Item</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Value</th></tr>'+
        st.map(function(r){return '<tr><td>'+esc(r.item)+'</td><td class="n">'+r.qty+' '+esc(r.unit)+'</td><td class="n">'+inr(r.rate)+'</td><td class="n">'+inr(r.val)+'</td></tr>';}).join("")+'</table></div>';
    }
    if(tab==="check"){
      var nos={}; (D.vouchers||[]).forEach(function(v){ nos[String(v.n).replace(/\s+/g,"").toLowerCase()]=1; });
      var miss=(D.dispatches||[]).filter(function(x){ return !nos[String(x.invoiceNo).replace(/\s+/g,"").toLowerCase()]; });
      $("view").innerHTML='<div class="card"><h2>Dispatched but invoice not found in Tally ('+miss.length+')</h2><div class="hint">From Orders & Dispatch. Compared against voucher numbers in the uploaded Day Books.</div>'+
        (miss.length?'<table><tr><th>Customer</th><th>Invoice</th><th>Dispatched</th><th class="n">Amount</th></tr>'+miss.map(function(x){return '<tr><td>'+esc(x.customer)+'</td><td>'+esc(x.invoiceNo)+'</td><td>'+esc(x.date)+'</td><td class="n">'+inr(x.amount)+'</td></tr>';}).join("")+'</table><button class="btn pri" id="askMiss" style="margin-top:10px">✉ Ask accountant to check these</button> <span id="missMsg" class="hint"></span>':'<div class="hint" style="margin-top:6px">All matched 👍</div>')+'</div>';
      if($("askMiss")) $("askMiss").onclick=function(){ var t="These dispatches don't appear in Tally yet. Please check and post them:\n"+miss.map(function(x){return "• "+x.customer+" — invoice "+x.invoiceNo+" ("+x.date+")";}).join("\n");
        api("remind",{text:t,subject:"Dispatches not yet in Tally"}).then(function(r){ $("missMsg").textContent=r.ok?"✅ Sent":"❌ Not sent"; }); };
    }
  }
  function drawUpload(){
    $("view").innerHTML='<div class="card"><h2>⬆ Upload Tally exports</h2>'+
      '<div class="hint">In Tally: open each report → <b>Alt+E (Export)</b>. Excel, PDF or XML all work. Upload the five reports:<br>Day Book (today) · Trial Balance · Outstandings → Receivables · Outstandings → Payables · Stock Summary.<br>Name the payables file with "payables" in it. Files are read on this computer — only the figures are sent.</div>'+
      '<div class="drop" id="drop" style="margin-top:12px"><div style="font-size:28px">📂</div><b>Tap to choose files</b> or drag them here</div><input type="file" id="fin" multiple accept=".xml,.xls,.xlsx,.xlsm,.csv,.pdf" hidden>'+
      '<div class="log" id="uplog"></div></div>';
    var dz=$("drop"), fin=$("fin");
    dz.onclick=function(){ fin.click(); }; fin.onchange=function(){ handleFiles(fin.files); fin.value=""; };
    dz.ondragover=function(e){ e.preventDefault(); dz.classList.add("on"); }; dz.ondragleave=function(){ dz.classList.remove("on"); };
    dz.ondrop=function(e){ e.preventDefault(); dz.classList.remove("on"); handleFiles(e.dataTransfer.files); };
  }
  function load(){ api("get").then(function(r){ if(r.ok){ D=r; draw(); } }); }

  /* ===================== PIN ===================== */
  function lock(err){ $("app").hidden=true; $("pinBox").hidden=false; $("pinErr").textContent=err||""; }
  function start(){
    var probe=OWNER?api("get"):api("ingest",{kind:"none"});
    probe.then(function(r){
      if(r.error==="pin") return lock(pin?"Wrong PIN":"");
      if(r.error==="nopin") return lock("No PIN set for this user — set it in the tracker: Menu → 🔒 PIN Access.");
      if(r.error==="not allowed") return lock("This user can't upload Tally files.");
      sessionStorage.setItem(PK,pin); $("pinBox").hidden=true; $("app").hidden=false;
      if(OWNER&&r.ok){ D=r; } draw();
    }).catch(function(){ lock("No internet — try again"); });
  }
  $("pinGo").onclick=function(){ pin=$("pin").value.trim(); if(pin) start(); };
  $("pin").addEventListener("keydown",function(e){ if(e.key==="Enter") $("pinGo").click(); });
  if(pin) start(); else lock("");
  window.__tally={dayBookRows:dayBookRows,tbRows:tbRows,billRows:billRows,stockRows:stockRows,classifyRows:classifyRows,parseXml:parseXml,kindOf:kindOf,parseVouchers:parseVouchers,parseTB:parseTB,parseBills:parseBills,parseStock:parseStock};
})();
</script>
</body>
</html>
