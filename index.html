    try {
      const b64 = String(mealPhoto.dataUrl).split(",")[1];
      const prompt = `You are looking at a photo of a meal (likely Indian food). Identify the foods you can see and give a ROUGH protein estimate. You cannot see exact quantities, so estimate conservatively and label it approximate. Do NOT give medical or diet advice.

Return ONLY valid JSON:
{"type":"Meal","summary":"short meal name","foods":["item1","item2"],"proteinGrams":<number, your best rough estimate>,"note":"one-line caveat that this is approximate"}`;
      const txt = await claudeAPI(prompt, "Return ONLY valid JSON, no markdown. Be conservative with protein estimates.", b64, mealPhoto.type, "");
      const clean = String(txt||"").replace(/```json/g,"").replace(/```/g,"").trim();
      const s = clean.indexOf("{"), e = clean.lastIndexOf("}");
      const obj = JSON.parse(s>=0 ? clean.substring(s,e+1) : clean);
      obj.type = "Meal";
      obj._photo = true;
      obj.summary = obj.summary || "Meal";
      obj.details = (Array.isArray(obj.foods)?obj.foods.join(", "):"") + " | ≈ " + (obj.proteinGrams||"?") + "g protein, ≈ " + (obj.calories||"?") + " kcal (approx) | " + (obj.note||"estimate only");
      setParsed(obj);
      setStatusMsg("");
    } catch(e) {
      setStatusMsg("❌ Couldn't read the photo. Try a clearer picture or type it instead.");
    }
    setLoading(false);
  };

  const analyze = async () => {
    if (!text.trim()) { setStatusMsg("Type something first."); return; }
    if (!isHealth) {
      // Family — no AI needed, just save directly
      await saveDirect();
      return;
    }
    setLoading(true); setStatusMsg("🧠 Understanding entry…");
    try {
      const prompt = `Parse this casual health log entry. Do NOT diagnose or give medical advice — just structure it. If it is a MEAL/food, give a ROUGH protein estimate in grams (use standard nutrition knowledge, e.g. 2 egg whites ≈ 7g, 1 whole egg ≈ 6g, 100g dal cooked ≈ 5g, 1 cup milk ≈ 8g, 100g paneer ≈ 18g, 100g chicken ≈ 27g). Estimate conservatively.

Entry: "${text}"

Return ONLY valid JSON:
{"type":"Meal"|"Symptom"|"Medication"|"Vitals"|"Other","summary":"short title","details":"key details","proteinGrams":<number if food, else 0>,"severity":"mild"|"moderate"|"severe"|null,"time":"morning"|"afternoon"|"evening"|"night"|null}`;
      const txt = await claudeAPI(prompt, "Return ONLY valid JSON, no markdown.", "", "", "");
      const clean = String(txt||"").replace(/```json/g,"").replace(/```/g,"").trim();
      const s = clean.indexOf("{"), e = clean.lastIndexOf("}");
      const obj = JSON.parse(s>=0 ? clean.substring(s,e+1) : clean);
      setParsed(obj);
      setStatusMsg("");
    } catch(e) {
      setParsed({ type:"Other", summary: text.slice(0,60), details: text });
      setStatusMsg("");
    }
    setLoading(false);
  };

  const saveDirect = async () => {
    setLoading(true);
    const entry = {
      id: genId(),
      title: text.slice(0, 80),
      date: new Date().toISOString().slice(0,10),
      category: "Family",
      notes: text,
      tags: [],
      createdAt: new Date().toISOString()
    };
    try {
      if (onSaveEntry) await onSaveEntry(entry);
      setStatusMsg("✅ Saved!");
      setText("");
    } catch(e) {
      setStatusMsg("❌ " + e.message);
    }
    setLoading(false);
  };

  const saveHealth = async () => {
    if (!parsed) return;
    setLoading(true);
    const entry = {
      id: genId(),
      title: parsed.summary || text.slice(0,80),
      date: new Date().toISOString().slice(0,10),
      category: "Health",
      notes: (parsed.details||text) + (parsed.severity?(" | Severity: "+parsed.severity):"") + (parsed.time?(" | Time: "+parsed.time):"") + (parsed.proteinGrams?(" | protein≈"+parsed.proteinGrams+"g"):"") + (parsed.calories?(" | ≈"+parsed.calories+" kcal"):""),
      amount: parsed.proteinGrams ? String(parsed.proteinGrams) : "",
      calories: parsed.calories || 0,
      tags: parsed.type ? [parsed.type] : [],
      createdAt: new Date().toISOString()
    };
    try {
      if (onSaveEntry) await onSaveEntry(entry);
      setStatusMsg("✅ Saved!");
      setText(""); setParsed(null);
    } catch(e) {
      setStatusMsg("❌ " + e.message);
    }
    setLoading(false);
  };

  return (
    <div style={{ padding:16, maxWidth:520, margin:"0 auto" }}>
      <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14 }}>
        <span style={{ fontSize:28 }}>{isHealth ? "🏥" : "👨‍👩‍👧"}</span>
        <div>
          <h2 style={{ margin:0, fontSize:17, color:"#2a1800" }}>{isHealth ? "Health Log" : "Family"}</h2>
          <div style={{ fontSize:11, color:"#8a6a4a" }}>
            {isHealth ? "Meals, symptoms, vitals — just type naturally" : "Thoughts, moments, events — casual journal"}
          </div>
        </div>
      </div>

      {isHealth && (()=>{
        const today = new Date().toISOString().slice(0,10);
        const meals = (entries||[]).filter(e => e && e.category==="Health" && e.date===today && (e.tags||[]).indexOf("Meal")>-1);
        let total = 0; meals.forEach(m => { const p = parseFloat(m.amount); if(!isNaN(p)) total += p; });
        let kcal = 0; meals.forEach(m => { const c = parseFloat(m.calories); if(!isNaN(c)) kcal += c; });
        return (
          <div style={{ background:"#eefafa", border:"1.5px solid #4a9a9a", borderRadius:10, padding:"10px 12px", marginBottom:12 }}>
            <div style={{ fontSize:13, fontWeight:700, color:"#0a5a5a" }}>🍽 Today ≈ {Math.round(total)}g protein <span style={{fontWeight:400,fontSize:11,color:"#5a8a8a"}}>(rough, from {meals.length} meal{meals.length===1?"":"s"})</span></div>
            {kcal>0 && <div style={{ fontSize:13, fontWeight:700, color:"#8a5a1a", marginTop:3 }}>🔥 Today ≈ {Math.round(kcal)} kcal <span style={{fontWeight:400,fontSize:11,color:"#a08050"}}>(approx)</span></div>}
          </div>
        );
      })()}

      {isHealth && <FastingTimer entries={entries} />}

      {isHealth && (
        <div style={{ marginBottom:10 }}>
          <input ref={photoInputRef} type="file" accept="image/*" onChange={onPickPhoto} style={{ display:"none" }} />
          <button onClick={()=>photoInputRef.current&&photoInputRef.current.click()} style={{ width:"100%", padding:"11px", borderRadius:10, border:"1.5px dashed #4a9a9a", background:"#eefafa", color:"#0a5a5a", fontWeight:700, fontSize:14, cursor:"pointer" }}>
            📷 Snap / upload a meal photo → estimate protein
          </button>
          {mealPhoto && (
            <div style={{ marginTop:8, textAlign:"center" }}>
              <img src={mealPhoto.dataUrl} alt="meal" style={{ maxWidth:"100%", maxHeight:180, borderRadius:10, border:"1px solid #d0c4a8" }} />
              <button onClick={analyzePhoto} disabled={loading} className="bg" style={{ width:"100%", marginTop:8 }}>
                {loading ? "⏳ Reading meal…" : "🍽 Analyze meal & estimate protein"}
              </button>
              <button onClick={()=>setMealPhoto(null)} className="bgh" style={{ width:"100%", marginTop:6 }}>✕ Remove photo</button>
              <div style={{ fontSize:10, color:"#8a6a4a", marginTop:6, fontStyle:"italic" }}>Protein figures are rough estimates from the photo — not exact measurements.</div>
            </div>
          )}
          <div style={{ textAlign:"center", fontSize:11, color:"#8a6a4a", margin:"8px 0" }}>— or type it below —</div>
        </div>
      )}

      <textarea
        value={text}
        onChange={e=>setText(e.target.value)}
        placeholder={isHealth ? "e.g. Had idli for breakfast, felt bloated after lunch…" : "e.g. Took the kids to the temple today, lovely evening…"}
        style={{ width:"100%", height:100, padding:10, borderRadius:10, border:"1.5px solid #d0c4a8", fontSize:13, resize:"vertical", marginBottom:10 }}
      />

      {statusMsg && <div style={{ fontSize:12, padding:"8px 12px", borderRadius:8, marginBottom:10,
        background: statusMsg.startsWith("❌") ? "#fff0f0" : "#f0fff0",
        color: statusMsg.startsWith("❌") ? "#8b0000" : "#1a5a1a" }}>{statusMsg}</div>}

      {isHealth && parsed && (
        <div style={{ background:"#f8f5f0", borderRadius:10, border:"1.5px solid #e0c87a", padding:12, marginBottom:12 }}>
          <div style={{ fontSize:12, fontWeight:700, marginBottom:6 }}>{parsed.type}: {parsed.summary}</div>
          <div style={{ fontSize:11, color:"#5a4a2a" }}>{parsed.details}</div>
          {(parsed.proteinGrams>0) && <div style={{ marginTop:6, display:"inline-block", background:"#eefafa", border:"1px solid #4a9a9a", borderRadius:8, padding:"3px 10px", fontSize:12, fontWeight:700, color:"#0a5a5a" }}>
            🍽 ≈ {parsed.proteinGrams}g protein <span style={{fontWeight:400,fontSize:10,color:"#5a8a8a"}}>(approx)</span>
          </div>}
          {(parsed.calories>0) && <span style={{ marginTop:6, marginLeft:6, display:"inline-block", background:"#fff4e8", border:"1px solid #d09a4a", borderRadius:8, padding:"3px 10px", fontSize:12, fontWeight:700, color:"#8a5a1a" }}>
            🔥 ≈ {parsed.calories} kcal
          </span>}
          {(parsed.calories>0) && <div style={{ marginTop:6, marginLeft:6, display:"inline-block", background:"#fff4e8", border:"1px solid #d09a4a", borderRadius:8, padding:"3px 10px", fontSize:12, fontWeight:700, color:"#8a5a1a" }}>
            🔥 ≈ {parsed.calories} kcal <span style={{fontWeight:400,fontSize:10,color:"#a08050"}}>(approx)</span>
          </div>}
          {parsed.severity && <div style={{ fontSize:10, color:"#8a6a2a", marginTop:4 }}>Severity: {parsed.severity}</div>}
        </div>
      )}

      {isHealth ? (
        !parsed ? (
          <button onClick={analyze} disabled={loading||!text.trim()} className="bg" style={{ width:"100%" }}>
            {loading ? "⏳ Analyzing…" : "🧠 Analyze & Review"}
          </button>
        ) : (
          <div style={{ display:"flex", gap:8 }}>
            <button onClick={()=>setParsed(null)} className="bgh" style={{ flex:1 }}>✕ Redo</button>
            <button onClick={saveHealth} disabled={loading} className="bg" style={{ flex:2 }}>
              {loading ? "⏳ Saving…" : "✅ Save Entry"}
            </button>
          </div>
        )
      ) : (
        <button onClick={saveDirect} disabled={loading||!text.trim()} className="bg" style={{ width:"100%" }}>
          {loading ? "⏳ Saving…" : "✅ Save to Family Log"}
        </button>
      )}

      <div style={{ fontSize:10, color:"#aaa", marginTop:14, textAlign:"center" }}>
        {isHealth && "This logs patterns for your own awareness — not medical advice. Consult a doctor for any health concerns."}
      </div>
    </div>
  );
}



// ── PaymentReminders — dealer contact book + WhatsApp payment reminders ──
function PaymentReminders({ onClose, entries, onSaveEntry, onFocusDealer }) {
  const [view, setView] = useState("pending"); // pending | contacts
  const [payType, setPayType] = useState("sales"); // sales(receivable) | purchase(payable)
  const [busyPaid,setBusyPaid]=useState("");
  const [copiedName,setCopiedName]=useState("");
  const [previewText,setPreviewText]=useState("");
  const [previewName,setPreviewName]=useState("");
  const [contacts, setContacts] = useState({}); // name(lower) -> phone
  const [loading, setLoading] = useState(false);
  const [statusMsg, setStatusMsg] = useState("");
  const [sentIds, setSentIds] = useState(() => {
    try { return JSON.parse(localStorage.getItem("waReminderSent") || "{}"); } catch(e) { return {}; }
  });
  const [editingContact, setEditingContact] = useState(null);
  const [newPhone, setNewPhone] = useState("");

  // Load saved contacts from localStorage on mount
  useEffect(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("dealerContacts") || "{}");
      setContacts(saved);
    } catch(e) {}
    // durable load from Supabase (overrides cache if present)
    (async()=>{ try{ const r=await sheetsAPI("getPortfolio",{key:"dealer_contacts",user:"main"}); if(r&&r.data&&typeof r.data==="object"){ setContacts(r.data); localStorage.setItem("dealerContacts", JSON.stringify(r.data)); } }catch(e){} })();
  }, []);

  const saveContact = async (name, phone) => {
    const key = name.trim().toLowerCase();
    const updated = { ...contacts, [key]: phone.replace(/[^\d]/g, "") };
    setContacts(updated);
    localStorage.setItem("dealerContacts", JSON.stringify(updated));   // fast cache
    try{ await sheetsAPI("savePortfolio",{key:"dealer_contacts",user:"main",data:updated}); }catch(e){}  // durable
    setEditingContact(null);
    setNewPhone("");
  };

  // Sales officers are staff, not dealers — never show them as pending payments
  const SALES_OFFICERS_EXCL = ["sooraj","sunil","biju","murugan","sebi","sugeesh","satish","sadasivan","vinod","prakash","staff1","staff2","staff3","staff4"];
  const isOfficer = (e) => {
    const nm = (e.person||e.vendor||"").trim().toLowerCase();
    if(SALES_OFFICERS_EXCL.indexOf(nm)>-1) return true;
    const tags=(e.tags||[]).join(" ").toLowerCase();
    if(/field report|officer:/.test(tags)) return true;
    if(/field report|sales - visit/i.test((e.category||"")+" "+(e.title||""))) return true;
    return false;
  };
  // Pending payment entries — overdue or payment due (excluding staff/officers)
  const pendingEntries = (entries || []).filter(e =>
    (e.paymentStatus === "Payment Pending" || e.paymentStatus === "Asked Payment" ||
     e.paymentStatus === "Overdue" || (e.tags || []).includes("Payment Due")) &&
    e.amount && parseFloat(String(e.amount).replace(/[^\d.]/g, "")) > 0 &&
    !isOfficer(e)
  ).slice(0, 100);

  // Classify each entry: SALES (they owe us) vs PURCHASE (we owe them)
  const daysOld = (d) => { const t=Date.parse(d); return isNaN(t)?0:Math.floor((Date.now()-t)/86400000); };
  const classify = (e) => {
    const cat=(e.category||"").toLowerCase();
    const tags=(e.tags||[]).join(" ").toLowerCase();
    if(/purchase|payable|vendor bill|buy/.test(cat)||/payable/.test(tags)) return "purchase";
    if(/sales|receiv|invoice|order/.test(cat)||/receivable|sales/.test(tags)) return "sales";
    // default: money we asked for = sales(receivable)
    return "sales";
  };
  // Group by person/vendor within the selected payType
  const grouped = {};
  pendingEntries.filter(e=>classify(e)===payType).forEach(e => {
    const name = e.person || e.vendor || "Unknown";
    if (!grouped[name]) grouped[name] = [];
    grouped[name].push(e);
  });

  const fmt = n => !n ? "—" : "₹" + Number(String(n).replace(/[^\d.]/g, "")).toLocaleString("en-IN");

  const sendReminder = async (name, entryList) => {
    // Open WhatsApp with the full reminder pre-filled — you pick the chat and hit send.
    // (No Business API / template needed — always works, no Meta approval required.)
    const phone = contacts[name.trim().toLowerCase()];
    const msg = buildMessage(name, entryList);
    const total = entryList.reduce((s, e) => s + (parseFloat(String(e.amount).replace(/[^\d.]/g, "")) || 0), 0);
    const num = phone ? String(phone).replace(/[^\d]/g,"") : "";
    const waNum = num ? ((num.length===10?"91":"")+num) : "";
    const url = waNum
      ? ("https://wa.me/"+waNum+"?text="+encodeURIComponent(msg))
      : ("https://api.whatsapp.com/send?text="+encodeURIComponent(msg));
    let win=null;
    try{ win = window.open(url, "_blank"); }catch(e){}
    if(!win || win.closed || typeof win.closed==="undefined"){
      try{ if(navigator.clipboard) navigator.clipboard.writeText(msg); }catch(e){}
      window.location.href = url;
    }
    const updated = { ...sentIds, [name]: new Date().toISOString() };
    setSentIds(updated);
    localStorage.setItem("waReminderSent", JSON.stringify(updated));
    setStatusMsg("✅ WhatsApp opened for " + name + " (" + fmt(total) + ") — pick the chat and press send.");
  };

  return (
    <div style={{ padding: 16, maxWidth: 600, margin: "0 auto" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
        <span style={{ fontSize: 28 }}>💬</span>
        <div>
          <h2 style={{ margin: 0, fontSize: 17, color: "#1a1a2a" }}>Payment Reminders</h2>
          <div style={{ fontSize: 11, color: "#6a6a8a" }}>Copy a reminder message, or mark payments as received</div>
        </div>
      </div>

      <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
        {[["pending", "💰 Pending (" + Object.keys(grouped).length + ")"], ["contacts", "📇 Contacts"]].map(([v, l]) =>
          <button key={v} onClick={() => setView(v)} style={{
            flex: 1, padding: "8px 4px", borderRadius: 8, border: "none", fontSize: 12, fontWeight: 700,
            background: view === v ? "#1a1a4a" : "#e8e8f0", color: view === v ? "#fff" : "#1a1a4a", cursor: "pointer"
          }}>{l}</button>
        )}
      </div>

      {previewText && <div style={{ background:"#fff", border:"2px solid #5a3a9a", borderRadius:10, padding:12, marginBottom:12 }}>
        <div style={{ fontSize:12, fontWeight:700, color:"#3a2a6a", marginBottom:6 }}>Message for {previewName} — select all & copy:</div>
        <textarea readOnly value={previewText} onClick={e=>e.target.select()} style={{ width:"100%", height:130, fontSize:12, padding:8, borderRadius:6, border:"1px solid #ccd" }}/>
        <button onClick={()=>{setPreviewText("");setPreviewName("");}} style={{ marginTop:6, fontSize:11, padding:"5px 12px", borderRadius:6, border:"none", background:"#eee", cursor:"pointer" }}>Close</button>
      </div>}
      {view === "pending" && <div style={{ display:"flex", gap:6, marginBottom:12 }}>
        <button onClick={()=>setPayType("sales")} style={{ flex:1, padding:"7px", borderRadius:8, border:payType==="sales"?"2px solid #1a7a4a":"1px solid #ccc", background:payType==="sales"?"#eafaf0":"#fff", color:"#1a5a3a", fontWeight:700, fontSize:12, cursor:"pointer" }}>📥 Sales (they owe me)</button>
        <button onClick={()=>setPayType("purchase")} style={{ flex:1, padding:"7px", borderRadius:8, border:payType==="purchase"?"2px solid #a35a1a":"1px solid #ccc", background:payType==="purchase"?"#fdf2e8":"#fff", color:"#8a4a1a", fontWeight:700, fontSize:12, cursor:"pointer" }}>📤 Purchases (I owe)</button>
      </div>}

      {statusMsg && <div style={{
        fontSize: 12, padding: "8px 12px", borderRadius: 8, marginBottom: 10,
        background: statusMsg.startsWith("❌") ? "#fff0f0" : statusMsg.startsWith("⚠️") ? "#fff8e7" : "#f0fff0",
        color: statusMsg.startsWith("❌") ? "#8b0000" : statusMsg.startsWith("⚠️") ? "#8a6a00" : "#1a5a1a"
      }}>{statusMsg}</div>}

      {view === "pending" && <>
        

        {Object.keys(grouped).length === 0 && (
          <div style={{ textAlign: "center", padding: "24px 16px", color: "#999", fontSize: 12, background: "#fafafa", borderRadius: 10 }}>
            No pending payments found. 🎉
          </div>
        )}

        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {Object.entries(grouped).map(([name, list]) => {
            const total = list.reduce((s, e) => s + (parseFloat(String(e.amount).replace(/[^\d.]/g, "")) || 0), 0);
            const hasPhone = !!contacts[name.trim().toLowerCase()];
            const lastSent = sentIds[name];
            return (
              <div key={name} style={{ background: "#f8f8fc", borderRadius: 10, border: "1px solid #e0e0f0", padding: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <div onClick={()=>{ if(onFocusDealer) onFocusDealer(name); }} style={{ fontSize: 13, fontWeight: 700, color: "#1a3a7a", cursor:"pointer", textDecoration:"underline" }}>{name} ›</div>
                    <div style={{ fontSize: 11, color: "#888" }}>{list.length} invoice(s) · {fmt(total)} pending</div>
                    {(() => { const oldest=Math.max(...list.map(e=>daysOld(e.date))); return oldest>=60
                      ? <div style={{ fontSize:10, color:"#fff", background:"#c33", display:"inline-block", padding:"1px 7px", borderRadius:10, marginTop:3, fontWeight:700 }}>⚠ {oldest} days overdue</div>
                      : <div style={{ fontSize:10, color:"#888", marginTop:2 }}>{oldest} days old</div>; })()}
                    {lastSent && <div style={{ fontSize: 10, color: "#2a8a2a", marginTop: 2 }}>✅ Reminded {new Date(lastSent).toLocaleDateString("en-IN")}</div>}
                    {!hasPhone && <div style={{ fontSize: 10, color: "#c08a00", marginTop: 2 }}>⚠️ No phone number saved</div>}
                  </div>
                  <div style={{ display:"flex", flexDirection:"column", gap:5 }}>
                    <button
                      type="button"
                      onClick={()=>{ if(onFocusDealer) onFocusDealer(name); }}
                      style={{ fontSize: 10.5, padding: "8px 14px", borderRadius: 8, border: "1px solid #2a5a9a",
                        background: "#e8f0fc", color: "#1a3a7a", fontWeight: 700,
                        cursor: "pointer", whiteSpace: "nowrap" }}
                    >📂 View in list ›</button>
                    <button
                      type="button"
                      onClick={()=>{ markPaid(name, list); }}
                      style={{ fontSize: 10.5, padding: "8px 14px", borderRadius: 8, border: "1px solid #1a7a4a",
                        background: busyPaid===name?"#cfe8d8":"#eafaf0", color: "#1a5a3a", fontWeight: 700,
                        cursor: "pointer", whiteSpace: "nowrap", pointerEvents:"auto" }}
                    >{busyPaid===name?"…":"✓ Mark Paid"}</button>
                    <button
                      type="button"
                      onClick={()=>{ setPreviewText(buildMessage(name, list)); setPreviewName(name); }}
                      style={{ fontSize: 10.5, padding: "8px 14px", borderRadius: 8, border: "1px solid #5a3a9a",
                        background: "#f0eafa", color: "#3a2a6a", fontWeight: 700,
                        cursor: "pointer", whiteSpace: "nowrap", pointerEvents:"auto" }}
                    >📋 Copy message</button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </>}

      {view === "contacts" && <>
        <div style={{ background: "#f0f8ff", borderRadius: 10, padding: 10, marginBottom: 12, fontSize: 11, color: "#2a4a6a" }}>
          Save dealer/vendor WhatsApp numbers here once — they're reused for all future reminders.
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {Object.keys(grouped).length === 0 && Object.keys(contacts).length === 0 && (
            <div style={{ textAlign: "center", padding: "20px", color: "#999", fontSize: 12 }}>No contacts yet.</div>
          )}
          {Array.from(new Set([...Object.keys(grouped), ...Object.keys(contacts).map(k => k)])).map(name => {
            const displayName = grouped[name] ? name : name; // best effort
            const key = displayName.trim().toLowerCase();
            const phone = contacts[key] || "";
            const isEditing = editingContact === displayName;
            return (
              <div key={displayName} style={{ display: "flex", alignItems: "center", gap: 8, background: "#f8f8fc", borderRadius: 8, padding: "8px 10px" }}>
                <div style={{ flex: 1, fontSize: 12, fontWeight: 600, color: "#1a1a2a" }}>{displayName}</div>
                {isEditing ? (
                  <>
                    <input
                      type="tel"
                      value={newPhone}
                      onChange={e => setNewPhone(e.target.value)}
                      placeholder="10-digit number"
                      style={{ width: 140, padding: "5px 8px", borderRadius: 6, border: "1px solid #ccc", fontSize: 12 }}
                    />
                    <button onClick={() => saveContact(displayName, newPhone)} style={{ fontSize: 11, padding: "5px 10px", borderRadius: 6, border: "none", background: "#1a8a4a", color: "#fff", cursor: "pointer" }}>Save</button>
                  </>
                ) : (
                  <>
                    <span style={{ fontSize: 12, color: phone ? "#1a5a1a" : "#999" }}>{phone ? "+91 " + phone : "no number"}</span>
                    <button onClick={() => { setEditingContact(displayName); setNewPhone(phone); }} style={{ fontSize: 11, padding: "5px 10px", borderRadius: 6, border: "1px solid #ccc", background: "#fff", cursor: "pointer" }}>Edit</button>
                  </>
                )}
              </div>
            );
          })}
        </div>

        <div style={{ marginTop: 14, padding: 10, background: "#f8f5f0", borderRadius: 8 }}>
          <div style={{ fontSize: 11, fontWeight: 700, marginBottom: 6 }}>+ Add new contact manually</div>
          <div style={{ display: "flex", gap: 6 }}>
            <input id="newContactName" placeholder="Name" style={{ flex: 1, padding: "6px 8px", borderRadius: 6, border: "1px solid #ccc", fontSize: 12 }} />
            <input id="newContactPhone" placeholder="Phone" style={{ width: 120, padding: "6px 8px", borderRadius: 6, border: "1px solid #ccc", fontSize: 12 }} />
            <button onClick={() => {
              const n = document.getElementById("newContactName").value;
              const p = document.getElementById("newContactPhone").value;
              if (n && p) { saveContact(n, p); document.getElementById("newContactName").value = ""; document.getElementById("newContactPhone").value = ""; }
            }} style={{ fontSize: 11, padding: "6px 12px", borderRadius: 6, border: "none", background: "#1a3a8a", color: "#fff", cursor: "pointer" }}>Add</button>
          </div>
        </div>
      </>}
    </div>
  );
}

// ── TallyUpload — upload Trial Balance, AI reads & asks, shows P&L ──────────
function TallyUpload({onClose}){
  const [step,setStep]=useState("upload"); // upload | questions | result
  const [tallyText,setTallyText]=useState("");
  const [month,setMonth]=useState(new Date().toLocaleString("default",{month:"long"}));
  const [year,setYear]=useState(new Date().getFullYear());
  const [loading,setLoading]=useState(false);
  const [statusMsg,setStatusMsg]=useState("");
  const [extracted,setExtracted]=useState(null);
  const [questions,setQuestions]=useState([]);
  const [answers,setAnswers]=useState({});
  const [result,setResult]=useState(null);
  const [ledgerMap,setLedgerMap]=useState([]);
  const fileRef=React.useRef();

  const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];

  const handleFile=async(e)=>{
    const file=e.target.files[0];
    if(!file) return;
    // Read as text — Tally exports tab-separated or CSV
    const reader=new FileReader();
    reader.onload=(ev)=>setTallyText(ev.target.result);
    reader.readAsText(file);
  };

  const parseTally=async()=>{
    if(!tallyText.trim()){setStatusMsg("Please paste or upload your Tally Trial Balance first.");return;}
    setLoading(true);setStatusMsg("🔍 Reading your Tally data…");
    try{
      const res=await fetch("/.netlify/functions/tally",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({action:"parse",tallyText,month,year})
      });
      const data=await res.json();
      if(!data.ok) throw new Error(data.error||"Parse failed");
      setExtracted(data.extracted);
      setLedgerMap(data.ledgerMap||[]);
      // Filter questions to only those with null values
      const qs=data.questions||[];
      setQuestions(qs);
      const initAnswers={};
      qs.forEach(q=>{initAnswers[q.id]="";});
      setAnswers(initAnswers);
      setStep("questions");
      setStatusMsg("");
    }catch(e){setStatusMsg("❌ Error: "+e.message);}
    setLoading(false);
  };

  const finalize=async()=>{
    setLoading(true);setStatusMsg("📊 Calculating your P&L…");
    try{
      const res=await fetch("/.netlify/functions/tally",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({action:"finalize",extracted,answers,month,year})
      });
      const data=await res.json();
      if(!data.ok) throw new Error(data.error||"Finalize failed");
      setResult(data);
      setStep("result");
      setStatusMsg("");
    }catch(e){setStatusMsg("❌ Error: "+e.message);}
    setLoading(false);
  };

  const fmt=(n)=>n==null?"—":"₹"+Number(n).toLocaleString("en-IN");
  const fmtPct=(n)=>n==null?"—":n.toFixed(1)+"%";

    const color=value>0?"#1a5a1a":value<0?"#8b0000":"#2a1a00";
    return <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
      padding:"7px 10px",marginBottom:3,
      background:highlight?"#fffbe6":"#faf8f4",
      borderRadius:7,borderLeft:highlight?"3px solid #c8a060":"3px solid transparent",
      paddingLeft:indent?22:10}}>
      <span style={{fontSize:13,color:"#5a4a2a"}}>{label}</span>
      <span style={{fontSize:14,fontWeight:highlight?700:500,color:highlight?color:"#2a1a00"}}>{fmt(value)}</span>
    </div>;
  };

  const SectionHeader=({label,bg})=><div style={{background:bg||"#2a1800",color:"#fff",
    padding:"6px 10px",borderRadius:6,fontSize:12,fontWeight:700,marginTop:10,marginBottom:4}}>{label}</div>;

  return <div style={{padding:16,maxWidth:600,margin:"0 auto"}}>
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
      <span style={{fontSize:28}}>📊</span>
      <div>
        <h2 style={{margin:0,fontSize:17,color:"#5a3a1a"}}>Tally Trial Balance → P&L</h2>
        <div style={{fontSize:11,color:"#9a8a6a"}}>Upload your TallyPrime export — AI does the rest</div>
      </div>
    </div>

    {/* STEP INDICATOR */}
    <div style={{display:"flex",gap:6,marginBottom:16}}>
      {[["upload","1. Upload"],["questions","2. Questions"],["result","3. Results"]].map(([s,l])=>
        <div key={s} style={{flex:1,textAlign:"center",padding:"5px 4px",borderRadius:6,fontSize:10,fontWeight:700,
          background:step===s?"#c8860a":step==="result"&&s!=="result"?"#2a7a2a":step==="questions"&&s==="upload"?"#2a7a2a":"#e8d8c0",
          color:step===s||((step==="result"&&s!=="result")||(step==="questions"&&s==="upload"))?"#fff":"#7a5a2a"}}>{l}</div>
      )}

    {/* ── STEP 1: UPLOAD ── */}

      <div style={{display:"flex",gap:8,marginBottom:10}}>

    {/* ── STEP 2: QUESTIONS ── */}
    {step==="questions"&&<div>
      {ledgerMap.length>0&&<div style={{marginBottom:12,background:"#f0fff0",borderRadius:8,padding:10}}>
        <div style={{fontSize:11,fontWeight:700,color:"#1a5a1a",marginBottom:6}}>✅ Ledgers extracted from Tally ({ledgerMap.length} matched):</div>
        <div style={{maxHeight:100,overflowY:"auto"}}>
          {ledgerMap.slice(0,10).map((l,i)=><div key={i} style={{fontSize:10,color:"#3a5a3a",padding:"2px 0",borderBottom:"1px solid #d0e8d0"}}>

          {ledgerMap.length>10&&<div style={{fontSize:10,color:"#7a9a7a"}}>…and {ledgerMap.length-10} more</div>}

      </div>}

      {questions.length===0
        ? <div style={{background:"#d4edda",borderRadius:8,padding:12,marginBottom:12,fontSize:13,color:"#155724"}}>
            ✅ All data extracted from Tally — no questions needed!
          </div>
        : <div>
            <div style={{fontSize:12,color:"#5a3a1a",marginBottom:10,fontWeight:700}}>
              🙋 {questions.length} question{questions.length>1?"s":""} — please fill what Tally doesn't show:
            </div>
            {questions.map(q=><div key={q.id} style={{marginBottom:12,background:"#fffdf7",borderRadius:8,padding:10,border:"1.5px solid #e8d8b0"}}>
              <div style={{fontSize:12,fontWeight:700,color:"#3a2a0a",marginBottom:3}}>{q.question}</div>
              <div style={{fontSize:10,color:"#8a7a5a",marginBottom:6,fontStyle:"italic"}}>{q.hint}</div>
              <input

                value={answers[q.id]||""}

    {/* ── STEP 3: RESULT ── */}

      <ProfitRow label="Retail / Direct Sales" value={result.merged?.income?.retail}/>

      <div style={{display:"flex",gap:8,marginTop:14}}>
        <button onClick={()=>setStep("upload")} className="bgh" style={{flex:1}}>🔄 New Month</button>
        <button onClick={onClose} className="bg" style={{flex:1}}>✅ Done</button>
      </div>
    </div>}
  </div>;
}

// EmailScan — scan Gmail for emails tagged #trackerv2 and create entries
// ─────────────────────────────────────────────────────────────────────────────
function EmailScan({entries,onClose,onSaveEntry,onRefresh}){
  const [scanning,setScanning]=useState(false);
  const [emails,setEmails]=useState([]);
  const [statusMsg,setStatusMsg]=useState("");
  const [processing,setProcessing]=useState({});

  const scanGmail=async()=>{
    setScanning(true);setEmails([]);setStatusMsg("📡 Scanning Gmail for unread #Trackerv23 emails…");
    try{
      const res=await intelAPI("scanEmails");
      if(!res||res.error||res.ok===false){
        setStatusMsg("Error: Intel error: "+((res&&res.error)||"Could not reach Gmail"));
        setScanning(false);return;
      }
      const rows=(res.emails||[]).filter(m=>String(m.subject||"").toLowerCase().indexOf("#uploadcpc")===-1);
      if(rows.length===0){
        setStatusMsg("✅ No new unread #Trackerv23 emails found.\nForward an invoice to Gmail with #Trackerv23 in subject to import it.");
        setScanning(false);return;
      }
      const imported=JSON.parse(localStorage.getItem("importedGmailIds")||"[]");
      const parsed=rows.map(m=>({
        gmailId:m.gmailId,
        subject:m.subject||"(no subject)",
        from:m.from||"",
        date:parseDate(m.date)||today(),
        body:(m.body||"").slice(0,800),
        attachments:m.attachments||[],
        driveLinks:m.driveLinks||[],
        isDup:imported.includes(m.gmailId)||entries.some(e=>e.notes&&e.notes.includes(m.gmailId)),
        skip:imported.includes(m.gmailId)||entries.some(e=>e.notes&&e.notes.includes(m.gmailId))
      }));
      setEmails(parsed);
      const fresh=parsed.filter(e=>!e.isDup).length;
      setStatusMsg(fresh===0?"✅ All emails already imported — nothing new.":`Found ${fresh} new email(s) — tap Import on each one`);
    }catch(err){setStatusMsg("Error: "+err.message);}
    setScanning(false);
  };

  const importOne=async(email)=>{
    setProcessing(p=>({...p,[email.gmailId]:"reading"}));
    try{
      // Attachments arrive as METADATA ONLY (no base64) from the fast scan — fetch each one now.
      const metaAtts=(email.attachments||[]).filter(a=>(a.type||"").match(/pdf|image/));
      const atts=[];
      for(const m of metaAtts.slice(0,3)){
        try{
          if(m.inlineData&&m.inlineData.length>100){
            atts.push({name:m.name,type:m.type,base64:m.inlineData});
            continue;
          }
          const ar=await intelAPI("getAttachment",{gmailId:m.gmailId,attachIndex:m.attachIndex,attachmentId:m.attachmentId||"",partId:m.partId||""});
          if(ar&&ar.base64) atts.push({name:m.name,type:ar.type||m.type,base64:ar.base64});
        }catch(e){}
      }
      const prompt="You are an expert Indian accountant parsing a business email for Onam Agarbathi Pvt. Ltd. (incense manufacturer, Bangalore).\n"+
"RULES:\n"+
"- Email FROM a supplier/vendor (Chemixil, raw material, chemical, packaging) = category Business - Purchase\n"+
"- Email about SALES order to dealer/customer = Sales - Order\n"+
"- Payment confirmation = Sales - Payment or Business - Purchase\n"+
"- Title must be SHORT: VendorName Invoice Rs.Amount for purchase, CustomerName Order for sales\n"+
"- NEVER use Onam Agarbathi as vendor — that is the buyer not seller\n"+
"- Extract EXACT rupee total (Grand Total / Amount Chargeable / Total)\n"+
"- Payment terms: 60 days credit = reminderDays 60, 30 days = 30, immediate = 0\n"+
"- Read ALL attached images/PDFs carefully\n"+
"Return ONLY valid JSON:\n"+
"{\"title\":\"Chemixil Invoice Rs.350528\",\"category\":\"Business - Purchase\",\"amount\":\"350528\",\"vendor\":\"Chemixil Corporation\",\"person\":\"\",\"invoiceNo\":\"26-27/453\",\"paymentTerms\":\"60 days\",\"reminderDays\":60,\"paymentStatus\":\"Payment Pending\",\"notes\":\"Product details | CGST | SGST | Total\",\"summary\":\"brief summary\"}\n"+
"\nEmail Subject: "+email.subject+"\nFrom: "+email.from+"\nDate: "+email.date+"\nBody: "+email.body;

      // Send first PDF, or first image, or text only
      let txt="";
      const pdfAtt=atts.find(a=>(a.type||"").includes("pdf"));
      const imgAtts=atts.filter(a=>(a.type||"").includes("image"));

      if(pdfAtt){
        txt=await claudeAPI(prompt,"Return ONLY valid JSON no markdown.","","",pdfAtt.base64);
      } else if(imgAtts.length>0){
        // Send ALL images — pass first as primary, rest in prompt
        txt=await claudeAPI(prompt,"Return ONLY valid JSON no markdown.",imgAtts[0].base64,imgAtts[0].type,"");
      } else {
        txt=await claudeAPI(prompt,"Return ONLY valid JSON no markdown.","","","");
      }

      // Parse AI response
      let obj=null;
      try{
        let c=String(txt||"").replace(/```json/g,"").replace(/```/g,"").trim();
        const s=c.indexOf("{"),e=c.lastIndexOf("}");
        if(s>=0&&e>s)c=c.substring(s,e+1);
        obj=JSON.parse(c);
      }catch(e){}

      // Build reminder date
      let reminderDate="",reminderNote="";
      if(obj&&obj.reminderDays&&obj.reminderDays>0){
        const rd=new Date(email.date);rd.setDate(rd.getDate()+parseInt(obj.reminderDays));
        reminderDate=rd.toISOString().slice(0,10);
        reminderNote="Pay by "+rd.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})+" ("+obj.reminderDays+" day credit)";
      }

      // Build attachments for entry — upload real files to Google Drive so a clickable link is always stored
      const driveAtts=(email.driveLinks||[]).map(l=>({name:"Invoice (Drive)",type:"drive",data:l}));
      const uploadedAtts=[];
      function _tmo(p,ms){return Promise.race([p,new Promise(function(res){setTimeout(function(){res(null);},ms);})]);}
      function _shrinkImg(dataUrl){return new Promise(function(res){
        try{
          var img=new Image();
          img.onload=function(){
            try{
              var MAX=1200,w=img.width,h=img.height;
              if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
              var c=document.createElement("canvas");c.width=w;c.height=h;
              c.getContext("2d").drawImage(img,0,0,w,h);
              res(c.toDataURL("image/jpeg",0.8));
            }catch(e){res(dataUrl);}
          };
          img.onerror=function(){res(dataUrl);};
          img.src=dataUrl;
        }catch(e){res(dataUrl);}
      });}
      for(const a of atts){
        if(a.base64&&a.base64.length>100){
          let dataUrl="data:"+(a.type||"application/octet-stream")+";base64,"+a.base64;
          let attType=a.type||"application/octet-stream";
          if(attType.indexOf("image")===0){dataUrl=await _shrinkImg(dataUrl);attType="image/jpeg";}
          let saved=null;
          try{
            const up=await _tmo(uploadToDrive({name:a.name||"attachment",type:attType,data:dataUrl}),25000);
            if(up&&up.type==="drive"&&up.data&&String(up.data).indexOf("http")===0)saved=up;
          }catch(e){}
          // Store ONLY the Drive link — never base64. Retry once if the first upload failed.
          if(!saved){
            try{
              const up2=await _tmo(uploadToDrive({name:a.name||"attachment",type:attType,data:dataUrl}),25000);
              if(up2&&up2.type==="drive"&&up2.data&&String(up2.data).indexOf("http")===0)saved=up2;
            }catch(e){}
          }
          if(saved) uploadedAtts.push(saved);
          // if still not saved, skip — a link-less heavy blob must never enter the tracker
        }
      }
      const allAtts=[...uploadedAtts,...driveAtts];
      const firstDriveUrl=allAtts.find(a=>a&&a.data&&String(a.data).indexOf("http")===0);

      const cleanTitle=obj&&obj.title?obj.title:(obj&&obj.vendor?(obj.vendor+(obj.amount?" Rs."+Number(obj.amount).toLocaleString("en-IN"):"")):(email.subject));

      const entry={
        id:genId(),
        title:cleanTitle,
        date:email.date,
        category:(obj&&obj.category)||"Business - Purchase",
        person:(obj&&obj.person)||"",
        vendor:(obj&&obj.vendor)||"",
        amount:(obj&&obj.amount)?String(obj.amount):"",
        paymentStatus:(obj&&obj.paymentStatus)||"Payment Pending",
        reminder:reminderDate,
        reminderNote:reminderNote,
        taskType:(obj&&obj.taskType)||"",
        link:(firstDriveUrl&&firstDriveUrl.data)||(email.driveLinks||[])[0]||"",
        linkLabel:(firstDriveUrl||(email.driveLinks||[]).length)?"📎 Invoice":atts.length?"📎 Attachment":"",
        notes:((obj&&obj.notes)||"")+
          ((obj&&obj.invoiceNo)?(" | Inv: "+obj.invoiceNo):"")+
          ((obj&&obj.paymentTerms)?(" | Terms: "+obj.paymentTerms):"")+
          (firstDriveUrl?(" | 📎 "+firstDriveUrl.data):"")+
          " [gmailId:"+email.gmailId+"]",
        attachments:allAtts,
        tags:["Payment Due"],
        createdAt:new Date().toISOString()
      };

      // Detect routing tag in subject: #Prakash/#staff1-4 -> that tracker; else -> main
      const subjLower=String(email.subject||"").toLowerCase();
      let routeUser="main";
      const routeMap={"#prakash":"prakash","#staff1":"staff1","#staff2":"staff2","#staff3":"staff3","#staff4":"staff4"};
      for(const tag in routeMap){ if(subjLower.indexOf(tag)>-1){ routeUser=routeMap[tag]; break; } }
      // Sales-officer tags: keep the order in the OWNER's tracker (do NOT push to the officer's tracker),
      // but stamp it as a sales order attributed to that officer so Spectrum can pick it up when you process it.
      const OFFICER_TAGS={"#sooraj":"Sooraj","#sunil":"Sunil","#biju":"Biju","#murugan":"Murugan","#sebi":"Sebi","#sugeesh":"Sugeesh","#satish":"Satish","#sadasivan":"Sadasivan","#vinod":"Vinod"};
      for(const tag in OFFICER_TAGS){
        if(subjLower.indexOf(tag)>-1){
          entry.category="Sales - Order";
          entry.tags=(entry.tags||[]).concat(["Sales Order","Officer: "+OFFICER_TAGS[tag]]);
          // routeUser stays "main" — owner keeps the order; share manually if desired
          break;
        }
      }
      // Light copy (links only) for the database
      const dbEntry=Object.assign({},entry,{attachments:allAtts.map(a=>({name:a.name,type:a.type,data:(a.data&&String(a.data).indexOf("http")===0)?a.data:""}))});
      await sheetsAPI("save",{entry:dbEntry,user:routeUser});
      auto60Reminder(entry);
    if(routeUser==="main"){ try{if(onSaveEntry)await onSaveEntry(Object.assign({},entry))}catch(e){} }
      try{await intelAPI("logIntel",{intel:{date:email.date,source:"email",title:entry.title,vendor:(obj&&obj.vendor)||"",customer:(obj&&obj.person)||"",amount:(obj&&obj.amount)||"",invoiceNo:(obj&&obj.invoiceNo)||"",category:entry.category,summary:(obj&&obj.summary)||email.subject,gmailId:email.gmailId}});}catch(e){}

      // Mark imported
      try{const s=JSON.parse(localStorage.getItem("importedGmailIds")||"[]");if(!s.includes(email.gmailId)){s.push(email.gmailId);localStorage.setItem("importedGmailIds",JSON.stringify(s.slice(-500)));}}catch(e){}

      setEmails(prev=>prev.map(e=>e.gmailId===email.gmailId?{...e,skip:true,imported:true,importedTitle:cleanTitle}:e));
      setProcessing(p=>({...p,[email.gmailId]:"done"}));
      try{if(onRefresh)await onRefresh();}catch(e){}
    }catch(err){
      setProcessing(p=>({...p,[email.gmailId]:"error:"+err.message}));
    }
  };

  const freshEmails=emails.filter(e=>!e.isDup);
  const newEmails=emails.filter(e=>!e.skip);

  return <div style={{padding:16,maxWidth:560,margin:"0 auto"}}>
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
      <span style={{fontSize:26}}>📧</span>
      <div>
        <h2 style={{margin:0,fontSize:16,color:"#5a3a1a"}}>Email → Entry</h2>
        <div style={{fontSize:11,color:"#9a8a6a"}}>Scan Gmail for unread #Trackerv23 emails</div>
      </div>
    </div>

    <div style={{background:"#f0f8ff",borderRadius:8,padding:10,marginBottom:12,fontSize:11,color:"#2a4a6a"}}>
      <b>How to use:</b> Forward any invoice/order email to yourself with <b>#Trackerv23</b> in the subject. Then tap Scan.
    </div>

    <button onClick={scanGmail} disabled={scanning} className="bg" style={{width:"100%",marginBottom:10}}>
      {scanning?"⏳ Scanning Gmail…":"📬 Scan Gmail for #Trackerv23 Emails"}
    </button>

    {statusMsg&&<div style={{fontSize:12,padding:"8px 12px",borderRadius:8,marginBottom:10,whiteSpace:"pre-line",
      background:statusMsg.startsWith("Error")?"#fff0f0":"#f0fff0",
      color:statusMsg.startsWith("Error")?"#8b0000":"#1a5a1a"}}>
      {statusMsg}
    </div>}

    {freshEmails.length>0&&<div style={{display:"flex",flexDirection:"column",gap:8}}>
      {emails.map(email=>{
        const state=processing[email.gmailId];
        const isDone=email.imported||email.skip&&email.isDup;
        return <div key={email.gmailId} style={{background:isDone?"#f0fff0":email.isDup?"#f5f5f5":"#fffdf7",
          borderRadius:10,padding:12,border:"1.5px solid "+(isDone?"#c3e6cb":email.isDup?"#ddd":"#e8d8b0")}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:12,fontWeight:700,color:"#1a1a1a",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                {email.subject}
              </div>
              <div style={{fontSize:10,color:"#888",marginTop:2}}>
                {email.from} · {email.date}
                {(email.attachments||[]).length>0&&<span style={{marginLeft:6,color:"#2a6a2a"}}>📎 {email.attachments.length} attachment(s)</span>}
                {(email.driveLinks||[]).length>0&&<span style={{marginLeft:6,color:"#6a2a8a"}}>🔗 Drive link</span>}
              </div>
            </div>
          </div>

          {email.isDup&&!email.imported&&<div style={{fontSize:10,color:"#888",fontStyle:"italic"}}>Already imported</div>}
          {email.imported&&<div style={{fontSize:11,color:"#1a5a1a",fontWeight:700}}>✅ Imported: {email.importedTitle}</div>}
          {state&&state.startsWith("error")&&<div style={{fontSize:10,color:"#8b0000",marginTop:4}}>❌ {state.slice(6)}</div>}

          {!email.isDup&&!email.imported&&<button

            disabled={state==="reading"}
            className="bg"
            style={{width:"100%",marginTop:8,fontSize:12,padding:"8px"}}>
            {state==="reading"?"⏳ Reading invoice…":"🤖 Import with AI"}
          </button>}
        </div>;
      })}
    </div>}
  </div>;
}

function PinManager({ onClose }){
  const USERS=["main","prakash","sooraj","sunil","biju","murugan","sebi","sugeesh","satish","sadasivan","vinod","staff1","staff2","staff3","staff4"];
  const [pins,setPins]=useState({});

  useEffect(()=>{(async()=>{
    try{ const r=await sheetsAPI("getPortfolio",{key:"user_pins",user:"main"}); if(r&&r.data) setPins(r.data); }catch(e){}
    setLoaded(true);
  })()},[]);

  const setPin=async(user)=>{
    const d=(drafts[user]||"").trim();
    if(d && !/^[0-9]{4,8}$/.test(d)){ setMsg("PIN must be 4–8 digits"); return; }
    const np={...pins};

  const inp={flex:1,padding:"8px",borderRadius:6,border:"1px solid #ccd",fontSize:13};
  if(!IS_OWNER) return <div style={{padding:20,textAlign:"center",color:"#889"}}>Only the owner can manage PINs.</div>;

      </div>
      {msg && <div style={{fontSize:12,color:msg[0]==="✓"?"#1a7a3a":"#a33",marginBottom:8}}>{msg}</div>}
      {!loaded && <div style={{color:"#889",fontSize:12}}>Loading…</div>}
      {loaded && USERS.map(u=>(
        <div key={u} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:"1px solid #eee"}}>

          <input value={drafts[u]||""} onChange={e=>setDrafts({...drafts,[u]:e.target.value.replace(/[^0-9]/g,"")})} type="password" inputMode="numeric" placeholder="new PIN" style={inp}/>
          <button onClick={()=>setPin(u)} style={{padding:"7px 12px",borderRadius:6,border:"none",background:"#1a7a4a",color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer"}}>Set</button>
        </div>
      ))}
      <div style={{fontSize:10,color:"#8a9a8a",marginTop:10,fontStyle:"italic"}}>
        To remove a PIN, clear the box and press Set. Each person enters their PIN once per device. If a device was already unlocked, changing a PIN takes effect next time they open on a new device or after clearing site data.
      </div>
    </div>
  );
}

async function _pinHash(pin){
  try{
    const enc=new TextEncoder().encode("rkpin:"+pin);
    const buf=await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){ return "plain:"+pin; }  // fallback (older browsers)
}

function PinGate({ children }){
  const me=(typeof URL_USER!=="undefined"?URL_USER:"main");
  const DEVICE_KEY="rkpin_ok_"+me;
  const [state,setState]=useState("checking"); // checking | locked | open | setup
  const [pins,setPins]=useState({});           // user -> hash
  const [entry,setEntry]=useState("");
  const [err,setErr]=useState("");

  useEffect(()=>{(async()=>{
    // Never lock out on error — fail OPEN
    try{
      // already unlocked on this device?
      if(localStorage.getItem(DEVICE_KEY)==="1"){ setState("open"); return; }
      const r=await sheetsAPI("getPortfolio",{key:"user_pins",user:"main"});
      const map=(r&&r.data)||{};
      setPins(map);
      if(!map[me]){ setState("open"); }   // no PIN set for this user yet -> allow
      else setState("locked");
    }catch(e){ setState("open"); }        // any failure -> allow (do not lock owner out)
  })()},[]);

  const submit=async()=>{
    setErr("");
    const h=await _pinHash(entry.trim());
    if(h===pins[me]){ localStorage.setItem(DEVICE_KEY,"1"); setState("open"); }
    else setErr("Wrong PIN. Try again.");
  };

  if(state==="checking") return <div style={{padding:40,textAlign:"center",color:"#889",fontFamily:"system-ui"}}>…</div>;
  if(state==="open") return children;

  // locked screen
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(160deg,#1a3a2a,#0a2a1a)",fontFamily:"system-ui",padding:20}}>
      <div style={{background:"#fff",borderRadius:16,padding:"28px 24px",maxWidth:320,width:"100%",boxShadow:"0 10px 40px rgba(0,0,0,.3)",textAlign:"center"}}>
        <div style={{fontSize:34,marginBottom:6}}>🔒</div>
        <div style={{fontSize:18,fontWeight:700,color:"#1a3a2a"}}>RK Tracker</div>
        <div style={{fontSize:12,color:"#889",marginBottom:18}}>Enter your PIN — {me.charAt(0).toUpperCase()+me.slice(1)}</div>
        <input value={entry} onChange={e=>setEntry(e.target.value.replace(/[^0-9]/g,""))} onKeyDown={e=>{if(e.key==="Enter")submit();}}
          type="password" inputMode="numeric" autoFocus placeholder="••••"
          style={{width:"100%",padding:"14px",fontSize:22,textAlign:"center",letterSpacing:"8px",borderRadius:10,border:"2px solid #cfe0cf",marginBottom:12}}/>
        {err && <div style={{color:"#c33",fontSize:12,marginBottom:10}}>{err}</div>}
        <button onClick={submit} style={{width:"100%",padding:"13px",borderRadius:10,border:"none",background:"linear-gradient(135deg,#1a7a4a,#0a5a2a)",color:"#fff",fontWeight:700,fontSize:15,cursor:"pointer"}}>Unlock</button>
        <div style={{fontSize:10,color:"#aab",marginTop:12}}>Entered once per device.</div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
//  AIM SCREENER  —  full NSE scan with the Stage 1 gate applied BEFORE scoring
//
//  The old screener scored everything and filtered afterwards, which is how a
//  Rs.9 stock reached rank 9. Here the gate runs first: anything that fails is
//  discarded and never receives a score.
//
//  Price-based factors only. ROE, debt, cash flow and promoter pledge need a
//  fundamentals feed and are left to the Gate check tab, by hand.
// ─────────────────────────────────────────────────────────────────────────────
// ─────────────────────────────────────────────────────────────────────────────
//  AIM SCREENER  —  full NSE scan with the Stage 1 gate applied BEFORE scoring
//
//  The old screener scored everything and filtered afterwards, which is how a
//  Rs.9 stock reached rank 9. Here the gate runs first: anything that fails is
//  discarded and never receives a score.
//
//  Price-based factors only. ROE, debt, cash flow and promoter pledge need a
//  fundamentals feed and are left to the Gate check tab, by hand.
// ─────────────────────────────────────────────────────────────────────────────
// ─────────────────────────────────────────────────────────────────────────────
//  AIM BACKTEST — one stock, your choice of window. Gross of costs by request.
//  Every decision uses only the prior close, so there is no look-ahead.
// ─────────────────────────────────────────────────────────────────────────────
function AIMBacktest() {
  const [sym,setSym]=useState("");
  const [range,setRange]=useState("5y");
  const [capital,setCapital]=useState("100000");
  const [stockPct,setStockPct]=useState("70");
  const [every,setEvery]=useState("21");
  const [busy,setBusy]=useState(false);
  const [res,setRes]=useState(null);
  const [err,setErr]=useState("");

  const run=async()=>{
    const s=sym.trim().toUpperCase();
    if(!s){ setErr("Enter a symbol"); return; }
    setBusy(true); setErr(""); setRes(null);
    try{
      const r=await fetch("/.netlify/functions/yahoo?action=history&symbol="+encodeURIComponent(s+".NS")+"&range="+range);
      const d=await r.json();
      const q=d&&d.chart&&d.chart.result&&d.chart.result[0];
      const raw=q&&q.indicators&&q.indicators.quote&&q.indicators.quote[0];
      if(!raw) throw new Error("no history for "+s);
      const closes=(raw.close||[]).filter(c=>c!==null&&c!==undefined);
      if(closes.length<120) throw new Error("only "+closes.length+" days of data — too short");

      const cap=parseFloat(capital)||100000;
      const pct=(parseFloat(stockPct)||70)/100;
      const step=Math.max(5,parseInt(every)||21);

      let cash=cap*(1-pct);
      let shares=(cap*pct)/closes[0];
      let pc=cap*pct;                      // opening purchase sets Portfolio Control
      const trades=[];
      let peak=cap, maxDD=0, starved=0;

      for(let i=step;i<closes.length;i+=step){
        const p=closes[i];
        const mv=shares*p;
        const safe=0.10*mv;
        const advice=pc-mv;

        if(advice-safe>0){
          let buy=advice-safe;
          if(buy>cash){ buy=cash; starved++; }
          if(buy>0.5){
            shares+=buy/p; cash-=buy; pc+=buy/2;
            trades.push({d:i,t:"BUY",amt:buy,p:p});
          }
        } else if(mv-pc-safe>0){
          const sell=mv-pc-safe;
          shares-=sell/p; cash+=sell;      // PC deliberately unchanged
          trades.push({d:i,t:"SELL",amt:sell,p:p});
        }

        const tot=shares*p+cash;
        if(tot>peak) peak=tot;
        const dd=(peak-tot)/peak*100;
        if(dd>maxDD) maxDD=dd;
      }

      const last=closes[closes.length-1];
      const final=shares*last+cash;
      const bh=cap/closes[0]*last;         // full capital bought and held
      const years=closes.length/252;

      setRes({
        sym:s, days:closes.length, years,
        first:closes[0], last,
        final, bh,
        aimRet:(final-cap)/cap*100,
        bhRet:(bh-cap)/cap*100,
        cagr:(Math.pow(final/cap,1/years)-1)*100,
        bhCagr:(Math.pow(bh/cap,1/years)-1)*100,
        buys:trades.filter(t=>t.t==="BUY").length,
        sells:trades.filter(t=>t.t==="SELL").length,
        cash, shares, pc, maxDD, starved,
        trades:trades.slice(-12)
      });
    }catch(e){ setErr(String(e.message||e)); }
    setBusy(false);
  };

  const card={background:"#fff",border:"1px solid #e0d5c0",borderRadius:8,padding:10,marginBottom:8};
  const btn={padding:"8px 12px",borderRadius:6,border:"none",cursor:"pointer",fontSize:12,fontWeight:700};
  const inp={width:"100%",padding:"7px 9px",borderRadius:6,border:"1px solid #ccc",fontSize:13,boxSizing:"border-box",marginBottom:6};
  const fmt=(v)=>Number(v).toLocaleString("en-IN",{maximumFractionDigits:0});
  const row=(l,a,b,hi)=><div style={{display:"flex",justifyContent:"space-between",padding:"3px 0",fontSize:12}}>
    <span style={{color:"#666"}}>{l}</span>
    <span><b style={{color:hi?(a>=b?"#2e7d32":"#c62828"):"#333"}}>{a}</b>
      {b!==undefined&&<span style={{color:"#888"}}> vs {b}</span>}</span></div>;

  return <div>
    <div style={{fontSize:11,color:"#888",marginBottom:8,lineHeight:1.5}}>
      Runs the real AIM rules over history — Portfolio Control rising by half of every buy, never
      falling on a sale. Each decision uses only the prior close.
    </div>

    <div style={card}>
      <input value={sym} onChange={e=>setSym(e.target.value)} placeholder="NSE symbol, e.g. HINDALCO" style={inp}/>
      <div style={{display:"flex",gap:6}}>
        <select value={range} onChange={e=>setRange(e.target.value)} style={{...inp,flex:1}}>
          <option value="1y">1 year</option><option value="2y">2 years</option>
          <option value="5y">5 years</option><option value="10y">10 years</option>
        </select>
        <select value={every} onChange={e=>setEvery(e.target.value)} style={{...inp,flex:1}}>
          <option value="21">Monthly review</option>
          <option value="63">Quarterly review</option>
          <option value="10">Fortnightly review</option>
        </select>
      </div>
      <div style={{display:"flex",gap:6}}>
        <input value={capital} onChange={e=>setCapital(e.target.value)} placeholder="Capital" inputMode="decimal" style={{...inp,flex:1}}/>
        <input value={stockPct} onChange={e=>setStockPct(e.target.value)} placeholder="% in stock" inputMode="decimal" style={{...inp,flex:1}}/>
      </div>
      <button onClick={run} disabled={busy} style={{...btn,background:"#5a3a1a",color:"#fff",width:"100%"}}>
        {busy?"Running…":"⏮ Run backtest"}</button>
    </div>

    {err&&<div style={{padding:10,background:"#ffebee",color:"#c62828",borderRadius:6,fontSize:12,marginBottom:8}}>{err}</div>}

    {res&&<div>
      <div style={{...card,background:res.final>=res.bh?"#e8f5e9":"#fff4f4",
        borderColor:res.final>=res.bh?"#a0d0a0":"#e0a0a0"}}>
        <div style={{fontSize:15,fontWeight:800,color:res.final>=res.bh?"#2e7d32":"#c62828"}}>
          {res.final>=res.bh?"AIM beat buy-and-hold":"Buy-and-hold beat AIM"}
        </div>
        <div style={{fontSize:11.5,color:"#666",marginTop:3}}>
          {res.sym} · {res.years.toFixed(1)} years · {res.days} trading days
        </div>
      </div>

      <div style={card}>
        {row("Final value","Rs."+fmt(res.final),"Rs."+fmt(res.bh),true)}
        {row("Total return",res.aimRet.toFixed(1)+"%",res.bhRet.toFixed(1)+"%",true)}
        {row("Annualised",res.cagr.toFixed(1)+"%",res.bhCagr.toFixed(1)+"%",true)}
        {row("Worst drawdown",res.maxDD.toFixed(1)+"%")}
        {row("Trades",res.buys+" buys, "+res.sells+" sells")}
        {row("Ended holding","Rs."+fmt(res.shares*res.last)+" stock, Rs."+fmt(res.cash)+" cash")}
        {row("Price moved","Rs."+fmt(res.first)+" → Rs."+fmt(res.last))}
      </div>

      {res.starved>0&&<div style={{...card,background:"#fff8e1",borderColor:"#e0c080"}}>
        <div style={{fontSize:12,fontWeight:700,color:"#8a6a1a"}}>Cash ran out {res.starved} time(s)</div>
        <div style={{fontSize:11,color:"#7a6a4a",marginTop:3,lineHeight:1.45}}>
          AIM called for a bigger buy than the reserve could fund, so the trade was truncated. This is
          the exact risk of starting at {stockPct}% in stock rather than 50%.
        </div>
      </div>}

      <div style={{...card,background:"#f8f8f4"}}>
        <div style={{fontSize:11,color:"#666",lineHeight:1.6}}>
          <b>Gross of costs, as you asked.</b> Real brokerage, STT, stamp duty and slippage would reduce
          the AIM figure but not buy-and-hold, because AIM trades {res.buys+res.sells} times and holding
          trades once. Treat the gap as narrower than shown. Dividends are excluded from both.
          One stock over one period is also a single sample — run several before drawing conclusions.
        </div>
      </div>

      {res.trades.length>0&&<div style={card}>
        <div style={{fontSize:11,color:"#888",fontWeight:700,marginBottom:5}}>LAST TRADES</div>
        {res.trades.map((t,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:11.5,padding:"2px 0"}}>
          <span style={{color:t.t==="BUY"?"#1565c0":"#2e7d32",fontWeight:700}}>{t.t}</span>
          <span>Rs.{fmt(t.amt)} @ Rs.{t.p.toFixed(1)}</span>
        </div>)}
      </div>}
    </div>}
  </div>;
}
