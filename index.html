  },[]);

  const NIFTY=["RELIANCE","TCS","HDFCBANK","ICICIBANK","INFY","ITC","SBIN","BHARTIARTL","LT","HCLTECH",
    "BAJFINANCE","ASIANPAINT","TITAN","SUNPHARMA","MARUTI","AXISBANK","KOTAKBANK","NESTLEIND","ULTRACEMCO",
    "WIPRO","ONGC","NTPC","POWERGRID","TATAMOTORS","TATASTEEL","JSWSTEEL","ADANIENT","COALINDIA","GRASIM",
    "HINDALCO","CIPLA","DRREDDY","EICHERMOT","BAJAJ-AUTO","HEROMOTOCO","BRITANNIA","DIVISLAB","APOLLOHOSP",
    "TECHM","INDUSINDBK","BPCL","IOC","SHREECEM","UPL","TATACONSUM","SBILIFE","HDFCLIFE","BAJAJFINSV",
    "ADANIPORTS","M&M"];

  // ── metrics from a daily close series ──────────────────────────────────────
  const metrics=(closes,vols)=>{
    const n=closes.length;
    const ltp=closes[n-1];
    const win=closes.slice(Math.max(0,n-250));
    const hi=Math.max.apply(null,win), lo=Math.min.apply(null,win);
    const drawdown=hi>0?(hi-ltp)/hi*100:0;
    const posPct=hi>lo?(ltp-lo)/(hi-lo)*100:50;

    // annualised volatility from daily log-ish returns
    let s=0,s2=0,c=0;
    for(let i=1;i<n;i++){ if(closes[i-1]>0){ const r=(closes[i]-closes[i-1])/closes[i-1]; s+=r; s2+=r*r; c++; } }
    const mean=c?s/c:0;
    const sd=c>1?Math.sqrt(Math.max(0,s2/c-mean*mean)):0;
    const volAnn=sd*Math.sqrt(252)*100;

    // 200-day moving average and its slope
    let ma200=null, maRising=false;
    if(n>=200){
      const last200=closes.slice(n-200);
      ma200=last200.reduce((a,b)=>a+b,0)/200;
      if(n>=220){
        const prev200=closes.slice(n-220,n-20);
        const prevMa=prev200.reduce((a,b)=>a+b,0)/200;
        maRising=ma200>=prevMa;
      }
    }

    // bounce-back: drawdowns of 10%+ and whether they recovered within ~6 months
    let peak=closes[0], peakI=0, inDD=false, low=0, lowI=0, total=0, back=0;
    for(let i=1;i<n;i++){
      if(!inDD){
        if(closes[i]>peak){ peak=closes[i]; peakI=i; }
        else if((peak-closes[i])/peak>=0.10){ inDD=true; low=closes[i]; lowI=i; }
      }else{
        if(closes[i]<low){ low=closes[i]; lowI=i; }
        if(closes[i]>=peak){
          total++; if(i-lowI<=126) back++;
          inDD=false; peak=closes[i]; peakI=i;
        }
      }
    }
    if(inDD) total++;                       // still underwater counts against it
    const bouncePct=total>0?back/total*100:null;

    // average daily turnover in Rs. crore
    let turn=null;
    if(vols&&vols.length){
      const k=Math.min(20,vols.length);
      let t=0,cc=0;
      for(let i=vols.length-k;i<vols.length;i++){
        if(vols[i]&&closes[i]){ t+=vols[i]*closes[i]; cc++; }
      }
      if(cc) turn=(t/cc)/1e7;               // rupees -> crore
    }

    return {ltp,hi,lo,drawdown,posPct,volAnn,ma200,maRising,bouncePct,ddCount:total,turn,bars:n};
  };

  // ── STAGE 1 GATE — runs before any score is computed ───────────────────────
  const gate=(m)=>{
    if(m.bars<200) return "too little history";
    if(m.ltp<50) return "price below Rs.50";
    if(m.turn!==null&&m.turn<5) return "turnover below Rs.5cr";
    if(m.drawdown>40) return "more than 40% below high";
    if(m.volAnn<10) return "too little volatility";
    if(m.volAnn>90) return "volatility beyond sane range";
    return null;                            // null means it passed
  };

  // ── STAGE 2 SCORE — survivors only. Price factors, renormalised to 100. ────
  // The manual's drawdown bands, as a preference rather than a pass/fail.
  // 8-25% below the high is where AIM does its best work; at the high it just waits.
  const bandScore=(dd)=>{
    if(dd<8) return 35;                      // little discount — AIM sits idle
    if(dd<=25) return 100;                   // PREFERRED
    if(dd<=40) return 100-(dd-25)*3.5;       // allowed but flagged
    return 0;
  };

  const score=(m)=>{
    let v;
    if(m.volAnn<15) v=m.volAnn/15*40;
    else if(m.volAnn<25) v=40+(m.volAnn-15)/10*60;
    else if(m.volAnn<=45) v=100;
    else v=Math.max(0,100-(m.volAnn-45)*3);

    const b=m.bouncePct===null?50:m.bouncePct;

    let t=0;
    if(m.ma200!==null){ if(m.ltp>=m.ma200) t+=60; if(m.maRising) t+=40; }

    // manual weights: volatility 30, bounce-back 25, trend 20, plus the
    // drawdown band at 25 — without it the list ranks stocks at their highs first.
    return v*0.30+b*0.25+t*0.20+bandScore(m.drawdown)*0.25;
  };

  const fetchHist=(sym)=>fetch("/.netlify/functions/yahoo?action=history&symbol="+encodeURIComponent(sym+".NS")+"&range="+lookback)
    .then(r=>r.json())
    .then(d=>{
      const res=d&&d.chart&&d.chart.result&&d.chart.result[0];
      if(!res) return null;
      const q=res.indicators&&res.indicators.quote&&res.indicators.quote[0];
      if(!q) return null;
      const cl=[],vl=[];
      (q.close||[]).forEach((c,i)=>{ if(c!==null&&c!==undefined){ cl.push(c); vl.push((q.volume&&q.volume[i])||0); } });
      return cl.length?{closes:cl,vols:vl}:null;
    }).catch(()=>null);

  const getFullList=async()=>{
    if(!token) return null;
    try{
      const r=await fetch("/.netlify/functions/kite",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({action:"instruments",access_token:token})});
      const d=await r.json();
      return (d.symbols&&d.symbols.length>100)?d.symbols:null;
    }catch(e){ return null; }
  };

  const run=async()=>{
    cancelRef.current=false; setRows(null); setNote("");
    let syms=NIFTY;
    if(universe==="gated"){
      if(!fund){ setNote("❌ Universe file not loaded yet — wait a moment and try again."); return; }
      syms=Object.keys(fund.stocks);
    }
    else if(universe==="full"){
      setNote("Loading full NSE list from Zerodha…");
      const full=await getFullList();
      if(!full){ setNote("❌ Full scan needs a Zerodha token. Connect below, or run the Nifty 50 scan."); return; }
      syms=full;
    }
    setRunning(true);
    const total=syms.length;
    setProg({done:0,total,kept:0,gated:0});

    const keep=[]; const reasons={};
    let done=0,gated=0;

    for(let i=0;i<total;i+=12){
      if(cancelRef.current) break;
      const batch=syms.slice(i,i+12);
      const out=await Promise.all(batch.map(s=>fetchHist(s).then(d=>({s,d}))));
      out.forEach(({s,d})=>{
        done++;
        if(!d||d.closes.length<60) return;
        const m=metrics(d.closes,d.vols);
        const fail=gate(m);
        if(fail){ gated++; reasons[fail]=(reasons[fail]||0)+1; return; }
        const f=(fund&&fund.stocks[s])||null;
        keep.push(Object.assign({sym:s},m,{score:score(m),f:f}));
      });
      setProg({done,total,kept:keep.length,gated});
      await new Promise(r=>setTimeout(r,220));
    }

    keep.sort((a,b)=>b.score-a.score);
    setRows(keep);
    setRunning(false);
    const parts=Object.keys(reasons).sort((a,b)=>reasons[b]-reasons[a]).map(k=>reasons[k]+" "+k);
    setNote((cancelRef.current?"Stopped early. ":"")+keep.length+" passed the gate, "+gated+" rejected — "+parts.join(", "));
  };

  const csv=()=>{
    if(!rows||!rows.length) return;
    let s="Rank,Symbol,LTP,PctBelow52wHigh,PosInRange,AnnVolPct,BounceBackPct,DrawdownsSeen,TurnoverCr,Above200DMA,MarketCapCr,ROE,DebtEquity,OPM,PledgePct,Score\n";
    rows.forEach((r,i)=>{
      s+=[i+1,r.sym,r.ltp.toFixed(2),r.drawdown.toFixed(1),r.posPct.toFixed(1),r.volAnn.toFixed(1),
          r.bouncePct===null?"":r.bouncePct.toFixed(0),r.ddCount,r.turn===null?"":r.turn.toFixed(2),
          (r.ma200!==null&&r.ltp>=r.ma200)?"Y":"N",
          r.f?r.f.mc:"",r.f?r.f.roe:"",r.f?r.f.de:"",r.f?r.f.opm:"",r.f?(r.f.pl||0):"",
          Math.round(r.score)].join(",")+"\n";
    });
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([s],{type:"text/csv"}));
    a.download="AIM-Gated-Screener-"+new Date().toISOString().slice(0,10)+".csv";
    a.click();
  };

  const card={background:"#fff",border:"1px solid #e0d5c0",borderRadius:8,padding:10,marginBottom:8};
  const btn={padding:"8px 12px",borderRadius:6,border:"none",cursor:"pointer",fontSize:12,fontWeight:700};
  const inp={width:"100%",padding:"7px 9px",borderRadius:6,border:"1px solid #ccc",fontSize:13,boxSizing:"border-box",marginBottom:6};

  return <div>
    <div style={{fontSize:11,color:"#888",marginBottom:8,lineHeight:1.5}}>
      Two gates run <b>before</b> any score. The fundamentals gate (ROE, debt, interest cover,
      cash flow, market cap, promoter pledge) comes from your uploaded company data; the price gate
      (floor, turnover, drawdown, volatility) comes from live history. Only survivors get ranked.
    </div>

    <div style={card}>
      <div style={{fontSize:10.5,color:"#888",marginBottom:3}}>Universe</div>
      <select value={universe} onChange={e=>setUniverse(e.target.value)} style={inp}>
        <option value="gated">Quality-gated universe {fund?"— "+fund.meta.count+" companies":"— loading…"}</option>
        <option value="nifty">Nifty 50 — quick, about a minute</option>
        <option value="full">Full NSE — every listed stock, needs Zerodha</option>
      </select>

      <div style={{fontSize:10.5,color:"#888",marginBottom:3}}>History window</div>
      <select value={lookback} onChange={e=>setLookback(e.target.value)} style={inp}>
        <option value="1y">1 year</option>
        <option value="2y">2 years</option>
        <option value="5y">5 years — best bounce-back evidence</option>
      </select>
      <div style={{fontSize:10.5,color:"#8a6a1a",marginBottom:6}}>
        Bounce-back needs several cycles to mean anything. Over 1 year most stocks show one drawdown or none.
      </div>

      {universe==="full"&&<div>
        <div style={{fontSize:10.5,color:"#888",marginBottom:3}}>Zerodha access token (expires daily)</div>
        <input value={token} onChange={e=>{setToken(e.target.value); try{localStorage.setItem("aim_kite_token",e.target.value);}catch(err){}}}
          placeholder="paste Kite access token" style={inp}/>
      </div>}

      {!running
        ? <button onClick={run} style={{...btn,background:"#5a3a1a",color:"#fff",width:"100%"}}>🔍 Scan</button>
        : <button onClick={()=>{cancelRef.current=true;}} style={{...btn,background:"#c62828",color:"#fff",width:"100%"}}>■ Stop</button>}
    </div>

    {running&&<div style={{...card,background:"#f8f8f4"}}>
      <div style={{fontSize:12,fontWeight:700}}>Scanned {prog.done} of {prog.total}</div>
      <div style={{fontSize:11,color:"#666",marginTop:3}}>{prog.kept} passed the gate · {prog.gated} rejected</div>
      <div style={{height:6,background:"#e8e4dc",borderRadius:3,marginTop:6,overflow:"hidden"}}>
        <div style={{height:"100%",width:(prog.total?prog.done/prog.total*100:0)+"%",background:"#5a3a1a"}}/>
      </div>
    </div>}

    {note&&<div style={{...card,background:"#fffdf5",fontSize:11.5,color:"#6a5a3a",lineHeight:1.5}}>{note}</div>}

    {rows&&rows.length>0&&<div>
      <button onClick={csv} style={{...btn,background:"#eee",color:"#333",width:"100%",marginBottom:8}}>⬇ CSV (all {rows.length})</button>
      {rows.slice(0,60).map((r,i)=><div key={r.sym} style={card}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><b style={{fontSize:13}}>{i+1}. {r.sym}</b>
            <span style={{fontSize:11,color:"#888",marginLeft:6}}>Rs.{r.ltp.toFixed(0)}</span></div>
          <b style={{fontSize:14,color:"#5a3a1a"}}>{Math.round(r.score)}</b>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:2,marginTop:5,fontSize:11,color:"#555"}}>
          <div>{r.drawdown.toFixed(0)}% below high</div>
          <div>vol {r.volAnn.toFixed(0)}%</div>
          <div>{r.bouncePct===null?"no drawdowns seen":r.bouncePct.toFixed(0)+"% bounced back ("+r.ddCount+")"}</div>
          <div>{r.turn===null?"":"Rs."+r.turn.toFixed(1)+"cr/day"}</div>
        </div>
        {r.f&&<div style={{marginTop:5,paddingTop:5,borderTop:"1px solid #f0f0f0",fontSize:10.5,color:"#6a5a3a"}}>
          <div style={{fontWeight:700}}>{r.f.n} · {r.f.ind}</div>
          <div>ROE {r.f.roe}% · D/E {r.f.de} · OPM {r.f.opm}% · pledge {r.f.pl||0}% · mcap Rs.{Math.round(r.f.mc)}cr</div>
        </div>}
      </div>)}
      {rows.length>60&&<div style={{fontSize:11,color:"#888",textAlign:"center",padding:8}}>
        Showing top 60 · CSV has all {rows.length}
      </div>}
    </div>}

    {rows&&rows.length===0&&<div style={{...card,textAlign:"center",color:"#888",fontSize:12}}>
      Nothing passed the gate.
    </div>}
  </div>;
}

function AIMTrading({ onClose }) {
  const [book,setBook]=useState("INDIA");
  const [tab,setTab]=useState("dash");        // dash | ledger | audit | gate
  const [data,setData]=useState(null);
  const [ledger,setLedger]=useState([]);
  const [audit,setAudit]=useState(null);
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState("");
  const [msg,setMsg]=useState("");
  const [busy,setBusy]=useState("");
  const [openForm,setOpenForm]=useState(false);
  const [tradeFor,setTradeFor]=useState(null);
  const [f,setF]=useState({symbol:"",name:"",shares:"",price:"",costs:""});
  const [tf,setTf]=useState({action:"BUY",shares:"",price:"",costs:"",note:""});
  const [cashEdit,setCashEdit]=useState("");
  const [g,setG]=useState({profitableYears:"",opMargin:"",bestRoe:"",debtEquity:"",interestCover:"",cashFlow:"",marketCap:"",price:"",turnover:"",yearsListed:"",drawdown:"",pledge:"",auditorResigned:false,qualifiedOpinion:false,regulatoryAction:false});
  const [gRes,setGRes]=useState(null);
  const [cmp,setCmp]=useState(null);
  const [taxCalc,setTaxCalc]=useState({proceeds:"",costBasis:""});
  const [taxRes,setTaxRes]=useState(null);
  const [kite,setKite]=useState(()=>{ try{ return localStorage.getItem("aim_kite_token")||""; }catch(e){ return ""; } });
  const [reqTok,setReqTok]=useState("");
  const [fills,setFills]=useState(null);
  const [zh,setZh]=useState(null);
  const [openSym,setOpenSym]=useState(null);
  const [zhPick,setZhPick]=useState({});
  const [picked,setPicked]=useState({});

  const isCrypto=book==="CRYPTO";
  const cur=book==="USA"?"$":isCrypto?"Rs.":"Rs.";

  const api=async(payload)=>{
    const r=await fetch("/.netlify/functions/aim-api",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(Object.assign({book},payload))
    });
    return r.json();
  };

  const load=async()=>{
    setLoading(true);setErr("");
    try{
      const r=await api({action:"dashboard"});
      if(!r.ok) throw new Error(r.error||"could not load");
      setData(r);setCashEdit(String(r.cash||0));
    }catch(e){ setErr(String(e.message||e)); }
    setLoading(false);
  };

  const loadLedger=async()=>{
    setLoading(true);
    try{ const r=await api({action:"ledger"}); if(r.ok) setLedger(r.transactions||[]); }catch(e){}
    setLoading(false);
  };

  const runAudit=async()=>{
    setLoading(true);setAudit(null);
    try{ const r=await api({action:"audit"}); if(r.ok) setAudit(r); else setErr(r.error||"audit failed"); }catch(e){ setErr(String(e.message||e)); }
    setLoading(false);
  };

  useEffect(()=>{ if(tab==="dash"){ load(); loadLedger(); } if(tab==="ledger") loadLedger(); if(tab==="audit") runAudit(); if(tab==="compare") runCompare(); },[book,tab]);

  // An off-database copy. Supabase is durable but there is no point-in-time
  // recovery on this plan, so the ledger should exist somewhere you control too.
  const exportLedger=()=>{
    if(!ledger||!ledger.length){ setMsg("✗ Nothing in the ledger to export"); return; }
    let s="Book,Date,Symbol,Action,Shares,Price,Amount,Costs,PC_before,PC_after,Cash_after,Note\n";
    ledger.forEach(t=>{
      s+=[book,t.txn_date,t.symbol,t.action,t.shares,t.price,t.amount,t.costs,
          t.pc_before,t.pc_after,t.cash_after,'"'+String(t.note||"").replace(/"/g,'""')+'"'].join(",")+"\n";
    });
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([s],{type:"text/csv"}));
    a.download="AIM-ledger-"+book+"-"+new Date().toISOString().slice(0,10)+".csv";
    a.click();
  };

  // Removing a share stops AIM managing it. The ledger is untouched — history
  // is never deleted, only the position is marked closed.
  const showRaw=async()=>{
    setBusy("raw"); setMsg("");
    try{
      const r=await api({action:"rawHoldings"});
      const rows=(r&&r.rows)||[];
      const txt=rows.length
        ? rows.map(x=>"id="+x.id+"  sym="+x.symbol+"  sh="+x.shares+"  active="+String(x.active)).join("\n")
        : "(no rows returned)";
      window.alert("Rows actually stored in the "+book+" book:\n\n"+txt);
      setMsg("✓ "+rows.length+" row(s) — see the box");
    }catch(e){ setMsg("✗ "+String(e.message||e)); }
    setBusy("");
  };

  const removeShare=async(sym)=>{
    if(!window.confirm("Remove "+sym+" from the "+book+" book?\n\nAIM stops managing it. Ledger history is kept.")) return;
    // Opening a position took its cost out of cash. Whether that money should
    // come back depends entirely on why it is being removed, and only the
    // person removing it knows which case this is.
    const refund=window.confirm(
      "Was "+sym+" entered by mistake?\n\n"+
      "OK — it was a wrong or test entry. Put the money back into cash.\n\n"+
      "Cancel — the shares were genuinely sold. Leave cash as it is.");
    setBusy("rm"); setMsg("");
    try{
      const r=await api({action:"closePosition",symbol:sym,refundCash:refund});
      if(!r.ok) throw new Error(r.error||JSON.stringify(r)||"could not remove");
      setMsg("✓ "+sym+" removed"+
        (r.cashRestored?(" · "+cur+fmtN(r.cashRestored)+" returned to cash"):" · cash unchanged"));
      setOpenSym(null); load();
    }catch(e){ setMsg("✗ "+String(e.message||e)); }
    setBusy("");
  };

  const saveCash=async()=>{
    setBusy("cash");setMsg("");
    try{
      const r=await api({action:"setCash",cash:parseFloat(cashEdit)||0});
      if(!r.ok) throw new Error(r.error);
      setMsg("✓ Cash updated");load();
    }catch(e){ setMsg("✗ "+String(e.message||e)); }
    setBusy("");
  };

  const savePrice=async(sym,price)=>{
    if(!price) return;
    setBusy("p"+sym);setMsg("");
    try{
      const r=await api({action:"updatePrice",symbol:sym,price:parseFloat(price)});
      if(!r.ok) throw new Error(r.error);
      load();
    }catch(e){ setMsg("✗ "+String(e.message||e)); }
    setBusy("");
  };

  const doOpen=async()=>{
    setBusy("open");setMsg("");
    try{
      const r=await api({action:"openPosition",symbol:f.symbol,name:f.name,
        shares:parseFloat(f.shares)||0,price:parseFloat(f.price)||0,costs:parseFloat(f.costs)||0});
      if(!r.ok) throw new Error(r.error);
      setMsg("✓ Opened "+f.symbol+" · Portfolio Control set to "+cur+r.pc);
      setOpenForm(false);setF({symbol:"",name:"",shares:"",price:"",costs:""});load();
    }catch(e){ setMsg("✗ "+String(e.message||e)); }
    setBusy("");
  };

  const doTrade=async()=>{
    if(!tradeFor) return;
    setBusy("trade");setMsg("");
    try{
      const r=await api({action:"recordTrade",symbol:tradeFor.symbol,tradeAction:tf.action,
        shares:parseFloat(tf.shares)||0,price:parseFloat(tf.price)||0,
        costs:parseFloat(tf.costs)||0,note:tf.note});
      if(!r.ok) throw new Error(r.error);
      setMsg("✓ "+tf.action+" recorded · PC "+cur+r.pcBefore+" → "+cur+r.pcAfter);
      setTradeFor(null);setTf({action:"BUY",shares:"",price:"",costs:"",note:""});load();
    }catch(e){ setMsg("✗ "+String(e.message||e)); }
    setBusy("");
  };

  const saveKite=(t)=>{ setKite(t); try{ localStorage.setItem("aim_kite_token",t); }catch(e){} };

  const kiteCall=(payload)=>fetch("/.netlify/functions/kite",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}).then(r=>r.json());

  const kiteLogin=async()=>{
    const d=await kiteCall({action:"loginUrl"});
    if(d&&d.url) window.open(d.url,"_blank");
    setMsg("Log in, then copy the request_token from the address bar and paste it below.");
  };

  // Zerodha request tokens are single-use. If the redirect lands anywhere that
  // auto-exchanges, the token is dead before it can be copied — so capture it
  // here the moment we land, rather than relying on copy-paste.
  useEffect(()=>{
    try{
      const p=new URLSearchParams(window.location.search);
      const rt=p.get("request_token");
      if(rt && p.get("status")==="success"){
        window.history.replaceState({},document.title,window.location.pathname);
        (async()=>{
          setBusy("kite"); setMsg("Zerodha redirected — exchanging token…");
          try{
            const d=await kiteCall({action:"getToken",request_token:rt});
            const t=d&&d.data&&d.data.access_token;
            if(!t) throw new Error((d&&d.message)||"exchange failed");
            saveKite(t); setMsg("✓ Zerodha connected for today");
          }catch(e){ setMsg("✗ "+String(e.message||e)); }
          setBusy("");
        })();
      }
    }catch(e){}
  },[]);

  const exchangeToken=async()=>{
    if(!reqTok.trim()) return;
    setBusy("kite"); setMsg("");
    try{
      const d=await kiteCall({action:"getToken",request_token:reqTok.trim()});
      const t=d&&d.data&&d.data.access_token;
      if(!t) throw new Error((d&&d.message)||"could not exchange token");
      saveKite(t); setReqTok(""); setMsg("✓ Zerodha connected for today");
    }catch(e){ setMsg("✗ "+String(e.message||e)); }
    setBusy("");
  };

  // Live prices -> every AIM signal recomputes without any typing
  const refreshPrices=async()=>{
    if(!data||!data.holdings.length){ setMsg("✗ No holdings to price"); return; }
    // The USA book has its own source — Zerodha covers India only.
    if(book==="USA"){
      setBusy("prices"); setMsg("");
      try{
        const syms=data.holdings.map(h=>h.symbol);
        const r=await fetch("/.netlify/functions/usquote",{method:"POST",
          headers:{"Content-Type":"application/json"},body:JSON.stringify({symbols:syms})});
        const j=await r.json();
        if(!j||!j.ok) throw new Error((j&&j.error)||"no price data");
        let n=0, asOf="";
        for(const h of data.holdings){
          const row=j.prices&&j.prices[String(h.symbol).toUpperCase()];
          if(row&&row.price){ await api({action:"updatePrice",symbol:h.symbol,price:row.price}); n++; asOf=row.asOf||asOf; }
        }
        const bad=j.failed||[];
        setMsg("✓ "+n+" price(s) updated"+(asOf?(" · as of "+asOf):"")+
          (bad.length?(" · no quote for "+bad.join(", ")):""));
        load();
      }catch(e){ setMsg("✗ "+String(e.message||e)); }
      setBusy(""); return;
    }
    if(book!=="INDIA"){ setMsg("✗ No price source for this book"); return; }
    if(!kite){ setMsg("✗ Connect Zerodha first"); return; }
    setBusy("prices"); setMsg("");
    try{
      const syms=data.holdings.map(h=>h.symbol);
      const q=await kiteCall({action:"quote",symbols:syms,access_token:kite});
      const d=q&&q.data;
      if(!d) throw new Error((q&&q.message)||"no quote data - token may have expired");
      let n=0;
      for(const h of data.holdings){
        const row=d["NSE:"+h.symbol];
        const p=row&&row.last_price;
        if(p){ await api({action:"updatePrice",symbol:h.symbol,price:p}); n++; }
      }
      if(q&&q.authError){
        setMsg("✗ Zerodha session expired — tap Connect Zerodha above, then refresh prices again");
        setBusy(""); return;
      }
      const bad=(q&&q.failed)||[];
      setMsg("✓ "+n+" price(s) updated"+
        (bad.length?(" · no NSE quote for "+bad.join(", ")+" — check the symbol"):" · signals recomputed"));
      load();
    }catch(e){ setMsg("✗ "+String(e.message||e)); }
    setBusy("");
  };

  // Your real Zerodha holdings, offered for adoption into the AIM book.
  const loadHoldings=async()=>{
    if(!kite){ setMsg("✗ Connect Zerodha first"); return; }
    setBusy("zh"); setMsg(""); setZh(null);
    try{
      const d=await kiteCall({action:"holdings",access_token:kite});
      const rows=(d&&d.data)||[];
      const live=rows.filter(h=>Number(h.quantity)>0);
      const have={}; (data?data.holdings:[]).forEach(h=>have[h.symbol]=1);
      const fresh=live.filter(h=>!have[String(h.tradingsymbol).toUpperCase()]);
      setZh(fresh);
      const s={}; fresh.forEach((h,i)=>s[i]=true);   // adopt everything by default
      setZhPick(s);
      setMsg(fresh.length?("Found "+fresh.length+" holding(s) not yet in this book"):
        (live.length?"All "+live.length+" Zerodha holding(s) are already in this book":"No holdings in your Zerodha account"));
    }catch(e){ setMsg("✗ "+String(e.message||e)); }
    setBusy("");
  };

  const importHoldings=async()=>{
    if(!zh) return;
    setBusy("zhimp"); let n=0;
    try{
      for(let i=0;i<zh.length;i++){
        if(!zhPick[i]) continue;
        const h=zh[i];
        const px=Number(h.last_price)||Number(h.average_price);
        const r=await api({action:"openPosition",symbol:String(h.tradingsymbol).toUpperCase(),
          shares:Number(h.quantity),price:px,costs:0,adopt:true,
          name:String(h.tradingsymbol).toUpperCase()});
        if(r.ok) n++;
      }
      setMsg("✓ "+n+" holding(s) adopted · cash untouched — these were already yours");
      setZh(null); load();
    }catch(e){ setMsg("✗ "+String(e.message||e)); }
    setBusy("");
  };

  // Today's Zerodha fills, shown for review. Nothing enters the ledger unticked:
  // Portfolio Control is cumulative, so a stray non-AIM trade corrupts it permanently.
  const loadFills=async()=>{
    if(!kite){ setMsg("✗ Connect Zerodha first"); return; }
    setBusy("fills"); setMsg(""); setFills(null);
    try{
      const d=await kiteCall({action:"orders",access_token:kite});
      const rows=(d&&d.data)||[];
      const done=rows.filter(o=>String(o.status).toUpperCase()==="COMPLETE");
      const held={}; (data?data.holdings:[]).forEach(h=>held[h.symbol]=1);
      const mine=done.filter(o=>held[String(o.tradingsymbol).toUpperCase()]);
      setFills(mine);
      const sel={}; mine.forEach((o,i)=>sel[i]=true);
      setPicked(sel);
      setMsg(mine.length?("Found "+mine.length+" fill(s) in stocks you hold"):"No fills today in stocks you hold");
    }catch(e){ setMsg("✗ "+String(e.message||e)); }
    setBusy("");
  };

  const importFills=async()=>{
    if(!fills) return;
    setBusy("import"); let n=0;
    try{
      for(let i=0;i<fills.length;i++){
        if(!picked[i]) continue;
        const o=fills[i];
        const r=await api({action:"recordTrade",symbol:o.tradingsymbol,
          tradeAction:String(o.transaction_type).toUpperCase()==="BUY"?"BUY":"SELL",
          shares:Number(o.filled_quantity||o.quantity),price:Number(o.average_price),
          note:"imported from Zerodha order "+o.order_id});
        if(r.ok) n++;
      }
      setMsg("✓ "+n+" trade(s) written to the ledger");
      setFills(null); load();
    }catch(e){ setMsg("✗ "+String(e.message||e)); }
    setBusy("");
  };

  const runCompare=async()=>{
    setLoading(true);setCmp(null);
    try{ const r=await api({action:"compare"}); if(r.ok) setCmp(r.books); else setErr(r.error||"compare failed"); }
    catch(e){ setErr(String(e.message||e)); }
    setLoading(false);
  };

  const runTax=async()=>{
    setBusy("tax");setTaxRes(null);
    try{
      const r=await api({action:"cryptoTax",proceeds:parseFloat(taxCalc.proceeds)||0,costBasis:parseFloat(taxCalc.costBasis)||0});
      if(r.ok) setTaxRes(r);
    }catch(e){ setMsg("✗ "+String(e.message||e)); }
    setBusy("");
  };

  const runGate=async()=>{
    setBusy("gate");setGRes(null);
    try{
      const r=await api({action:"gateCheck",data:g});
      if(!r.ok) throw new Error(r.error);
      setGRes(r);
    }catch(e){ setMsg("✗ "+String(e.message||e)); }
    setBusy("");
  };

  const card={background:"#fff",border:"1px solid #e0d5c0",borderRadius:8,padding:10,marginBottom:8};
  const btn={padding:"8px 12px",borderRadius:6,border:"none",cursor:"pointer",fontSize:12,fontWeight:700};
  const inp={width:"100%",padding:"7px 9px",borderRadius:6,border:"1px solid #ccc",fontSize:13,boxSizing:"border-box",marginBottom:6};
  const sigColor=(a)=>a==="BUY"?"#1565c0":a==="SELL"?"#2e7d32":"#888";

  const num=(v)=>{const x=parseFloat(v);return isNaN(x)?0:x;};
  const fmtN=(v)=>num(v).toLocaleString("en-IN",{maximumFractionDigits:2});

  return <div style={{maxHeight:"80vh",overflowY:"auto"}}>
    <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap",alignItems:"center"}}>
      <button onClick={()=>setBook("INDIA")} style={{...btn,background:book==="INDIA"?"#5a3a1a":"#eee",color:book==="INDIA"?"#fff":"#555"}}>🇮🇳 India</button>
      <button onClick={()=>setBook("USA")} style={{...btn,background:book==="USA"?"#5a3a1a":"#eee",color:book==="USA"?"#fff":"#555"}}>🇺🇸 USA</button>
      <button onClick={()=>setBook("CRYPTO")} style={{...btn,background:isCrypto?"#5a3a1a":"#eee",color:isCrypto?"#fff":"#555"}}>₿ Crypto</button>
      <button onClick={onClose} style={{...btn,background:"#eee",color:"#333",marginLeft:"auto"}}>✕</button>
    </div>

    <div style={{display:"flex",gap:4,marginBottom:10,flexWrap:"wrap"}}>
      {[["dash","📊 Signals"],["screener","🔍 Screener"],["backtest","⏮ Backtest"],["compare","⚖ Compare"],["ledger","📒 Ledger"],["audit","🔍 Audit"],["gate","✅ Gate check"]].map(([k,l])=>
        <button key={k} onClick={()=>setTab(k)} style={{...btn,padding:"6px 10px",fontSize:11,
          background:tab===k?"#5a3a1a":"#f0f0f0",color:tab===k?"#fff":"#555"}}>{l}</button>)}
    </div>

    {msg&&<div style={{padding:"8px 10px",borderRadius:6,marginBottom:10,fontSize:12,fontWeight:700,
      background:msg[0]==="✓"?"#e8f5e9":"#ffebee",color:msg[0]==="✓"?"#2e7d32":"#c62828"}}>{msg}</div>}
    {err&&<div style={{padding:10,background:"#ffebee",color:"#c62828",borderRadius:6,fontSize:12,marginBottom:10}}>{err}</div>}
    {loading&&<div style={{padding:20,textAlign:"center",color:"#888"}}>Loading…</div>}

    {/* ─────────────────────────────── SIGNALS ─────────────────────────────── */}
    {tab==="dash"&&data&&<div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
        <div style={{...card,marginBottom:0,textAlign:"center"}}>
          <div style={{fontSize:19,fontWeight:800}}>{cur}{fmtN(data.summary.total)}</div>
          <div style={{fontSize:10,color:"#888"}}>Total</div>
        </div>
        <div style={{...card,marginBottom:0,textAlign:"center"}}>
          <div style={{fontSize:19,fontWeight:800,color:data.summary.unrealised>=0?"#2e7d32":"#c62828"}}>
            {data.summary.unrealised>=0?"+":""}{fmtN(data.summary.unrealised)}
          </div>
          <div style={{fontSize:10,color:"#888"}}>Unrealised ({data.summary.unrealisedPct}%)</div>
        </div>
        <div style={{...card,marginBottom:0,textAlign:"center"}}>
          <div style={{fontSize:16,fontWeight:800}}>{cur}{fmtN(data.summary.stockValue)}</div>
          <div style={{fontSize:10,color:"#888"}}>In stock</div>
        </div>
        <div style={{...card,marginBottom:0,textAlign:"center"}}>
          <div style={{fontSize:16,fontWeight:800,color:data.summary.cashPct<15?"#c62828":"#333"}}>{data.summary.cashPct}%</div>
          <div style={{fontSize:10,color:"#888"}}>Cash reserve</div>
        </div>
      </div>

      {isCrypto&&<div style={{...card,background:"#fff4f4",borderColor:"#e0a0a0"}}>
        <div style={{fontSize:12,fontWeight:800,color:"#c62828"}}>Tax before you act on a sell signal</div>
        <div style={{fontSize:11,color:"#8a4a4a",marginTop:4,lineHeight:1.5}}>
          Flat 31.2% on every gain, 1% TDS on every sale, and losses give <b>no</b> relief — not against
          other income, not against gains on the other coin, not carried forward. AIM trades often,
          so model each sell first.
        </div>
        <div style={{display:"flex",gap:5,marginTop:8}}>
          <input value={taxCalc.proceeds} onChange={e=>setTaxCalc({...taxCalc,proceeds:e.target.value})} placeholder="Sale proceeds" inputMode="decimal" style={{...inp,marginBottom:0}}/>
          <input value={taxCalc.costBasis} onChange={e=>setTaxCalc({...taxCalc,costBasis:e.target.value})} placeholder="Cost of those coins" inputMode="decimal" style={{...inp,marginBottom:0}}/>
          <button onClick={runTax} disabled={!!busy} style={{...btn,background:"#c62828",color:"#fff",flexShrink:0}}>{busy==="tax"?"…":"Tax"}</button>
        </div>
        {taxRes&&<div style={{background:"#fff",borderRadius:6,padding:"8px 10px",marginTop:8,fontSize:11.5}}>
          <div style={{display:"flex",justifyContent:"space-between",padding:"2px 0"}}><span>Gain</span><b>{cur}{fmtN(taxRes.gain)}</b></div>
          <div style={{display:"flex",justifyContent:"space-between",padding:"2px 0"}}><span>Tax at 31.2%</span><b style={{color:"#c62828"}}>{cur}{fmtN(taxRes.tax)}</b></div>
          <div style={{display:"flex",justifyContent:"space-between",padding:"2px 0"}}><span>TDS at 1%</span><b style={{color:"#c62828"}}>{cur}{fmtN(taxRes.tds)}</b></div>
          <div style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderTop:"1px solid #eee",marginTop:3}}>
            <span><b>In hand</b></span><b>{cur}{fmtN(taxRes.netInHand)}</b></div>
          {taxRes.effectivePct!==null&&<div style={{fontSize:10.5,color:"#8a4a4a",marginTop:4}}>
            {taxRes.effectivePct}% of your gain goes to tax and TDS.</div>}
          <div style={{fontSize:10.5,color:"#888",marginTop:4}}>{taxRes.note}</div>
        </div>}
      </div>}

      {data.summary.cashPct<15&&data.summary.total>0&&<div style={{...card,background:"#fff8e1",borderColor:"#e0c080"}}>
        <div style={{fontSize:12,fontWeight:700,color:"#8a6a1a"}}>⚠ Cash reserve is thin</div>
        <div style={{fontSize:11,color:"#7a6a4a",marginTop:3}}>
          Below about 15% the system has little ammunition left. Further buy signals may not be fundable.
        </div>
      </div>}

      {book==="USA"&&<div style={card}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontSize:11,color:"#888",fontWeight:700}}>US MARKET PRICES</div>
          <span style={{fontSize:10,color:"#999"}}>daily close</span>
        </div>
        <button onClick={refreshPrices} disabled={!!busy}
          style={{...btn,background:"#1a3a6a",color:"#fff",width:"100%",marginTop:6}}>
          {busy==="prices"?"…":"🔄 Refresh US prices"}</button>
        <div style={{fontSize:10.5,color:"#8a8a80",marginTop:5,lineHeight:1.5}}>
          Until you refresh, US holdings are valued at the last price you typed in —
          which can be weeks old, and makes every signal on this book unreliable.
          This book also trades in fractions, so signals act below one whole share.
        </div>
      </div>}

      {book==="INDIA"&&<div style={card}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontSize:11,color:"#888",fontWeight:700}}>ZERODHA</div>
          <span style={{fontSize:10.5,fontWeight:700,color:kite?"#2e7d32":"#c62828"}}>
            {kite?"connected":"not connected"}</span>
        </div>
        {!kite
          ? <div style={{marginTop:6}}>
              <button onClick={kiteLogin} style={{...btn,background:"#5a3a1a",color:"#fff",width:"100%",marginBottom:6}}>
                Open Zerodha login</button>
              <div style={{display:"flex",gap:5}}>
                <input value={reqTok} onChange={e=>setReqTok(e.target.value)} placeholder="paste request_token" style={{...inp,marginBottom:0}}/>
                <button onClick={exchangeToken} disabled={!!busy} style={{...btn,background:"#555",color:"#fff",flexShrink:0}}>
                  {busy==="kite"?"…":"Connect"}</button>
              </div>
              <div style={{fontSize:10.5,color:"#888",marginTop:5}}>
                Sessions expire daily, so this is a once-a-day step.</div>
            </div>
          : <div style={{display:"flex",gap:5,marginTop:6}}>
              <button onClick={refreshPrices} disabled={!!busy} style={{...btn,background:"#5a3a1a",color:"#fff",flex:1}}>
                {busy==="prices"?"…":"🔄 Live prices"}</button>
              <button onClick={loadFills} disabled={!!busy} style={{...btn,background:"#eee",color:"#333",flex:1}}>
                {busy==="fills"?"…":"⚡ Today's trades"}</button>
            </div>}
          <button onClick={showRaw} disabled={!!busy} style={{...btn,background:"#f4f4f4",
            color:"#666",width:"100%",marginTop:5,fontSize:12}}>
            {busy==="raw"?"…":"🔍 Show what is stored"}</button>
  
          {kite&&<button onClick={loadHoldings} disabled={!!busy} style={{...btn,background:"#eee",color:"#333",width:"100%",marginTop:5}}>
            {busy==="zh"?"…":"📥 Import holdings from Zerodha"}</button>}
      </div>}

      {zh&&zh.length>0&&<div style={{...card,background:"#fffdf5",borderColor:"#e0c080"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
          <div style={{fontSize:12,fontWeight:800}}>Your Zerodha holdings</div>
          <span style={{fontSize:11,color:"#5a3a1a",fontWeight:700,cursor:"pointer"}}
            onClick={()=>{const all=Object.values(zhPick).every(Boolean);
              const s={}; zh.forEach((h,i)=>s[i]=!all); setZhPick(s);}}>
            {Object.values(zhPick).every(Boolean)?"Clear all":"Select all"}</span>
        </div>
        <div style={{fontSize:10.5,color:"#8a6a1a",marginBottom:6,lineHeight:1.45}}>
          Tick only the ones you want AIM to manage. Portfolio Control is set to today's market
          value, so AIM starts from here rather than acting on gains it never took part in.
        </div>
        {zh.map((h,i)=><label key={i} style={{display:"flex",gap:7,alignItems:"flex-start",padding:"5px 0",borderBottom:i<zh.length-1?"1px solid #f0e8d8":"none",cursor:"pointer"}}>
          <input type="checkbox" checked={!!zhPick[i]} onChange={e=>setZhPick({...zhPick,[i]:e.target.checked})} style={{marginTop:2}}/>
          <span style={{fontSize:11.5,flex:1}}>
            <b>{h.tradingsymbol}</b> · {h.quantity} sh<br/>
            <span style={{color:"#666"}}>now Rs.{Number(h.last_price||0).toFixed(2)} · avg Rs.{Number(h.average_price||0).toFixed(2)}
              {" · value Rs."+Math.round(Number(h.quantity)*Number(h.last_price||h.average_price)).toLocaleString("en-IN")}</span>
          </span>
        </label>)}
        <div style={{display:"flex",gap:6,marginTop:8}}>
          <button onClick={importHoldings} disabled={!!busy} style={{...btn,background:"#5a3a1a",color:"#fff",flex:1}}>
            {busy==="zhimp"?"…":"Adopt ticked"}</button>
          <button onClick={()=>setZh(null)} style={{...btn,background:"#eee",color:"#333"}}>Cancel</button>
        </div>
      </div>}

      {fills&&fills.length>0&&<div style={{...card,background:"#fffdf5",borderColor:"#e0c080"}}>
        <div style={{fontSize:12,fontWeight:800,marginBottom:4}}>Zerodha fills — tick the AIM ones</div>
        <div style={{fontSize:10.5,color:"#8a6a1a",marginBottom:6,lineHeight:1.45}}>
          Only tick trades that belong to this AIM book. Portfolio Control is cumulative, so an
          unrelated trade imported here would distort every later signal.
        </div>
        {fills.map((o,i)=><label key={i} style={{display:"flex",gap:7,alignItems:"flex-start",padding:"5px 0",borderBottom:i<fills.length-1?"1px solid #f0e8d8":"none",cursor:"pointer"}}>
          <input type="checkbox" checked={!!picked[i]} onChange={e=>setPicked({...picked,[i]:e.target.checked})} style={{marginTop:2}}/>
          <span style={{fontSize:11.5}}>
            <b>{o.transaction_type} {o.tradingsymbol}</b><br/>
            <span style={{color:"#666"}}>{o.filled_quantity||o.quantity} @ Rs.{Number(o.average_price).toFixed(2)}</span>
          </span>
        </label>)}
        <div style={{display:"flex",gap:6,marginTop:8}}>
          <button onClick={importFills} disabled={!!busy} style={{...btn,background:"#5a3a1a",color:"#fff",flex:1}}>
            {busy==="import"?"…":"Import ticked"}</button>
          <button onClick={()=>setFills(null)} style={{...btn,background:"#eee",color:"#333"}}>Cancel</button>
        </div>
      </div>}

      <div style={card}>
        <div style={{fontSize:11,color:"#888",fontWeight:700,marginBottom:6}}>CASH IN THIS BOOK</div>
        <div style={{display:"flex",gap:6}}>
          <input value={cashEdit} onChange={e=>setCashEdit(e.target.value)} style={{...inp,marginBottom:0}} inputMode="decimal"/>
          <button onClick={saveCash} disabled={!!busy} style={{...btn,background:"#555",color:"#fff",flexShrink:0}}>
            {busy==="cash"?"…":"Save"}
          </button>
        </div>
      </div>

      {(data.holdings||[]).slice().sort((a,b)=>{
        // Sells first: a sale releases the cash that funds the buys below it.
        const rank=(h)=>{const t=String((h.signal||{}).action||"").toUpperCase();
          return t.indexOf("SELL")>=0?0:(t.indexOf("BUY")>=0?1:2);};
        const d=rank(a)-rank(b);
        return d!==0?d:Math.abs(((b.signal||{}).advice)||0)-Math.abs(((a.signal||{}).advice)||0);
      }).map(h=>{
        const s=h.signal||{};
        // AIM triggers, solved for price:
        //   SELL when MV - PC - 0.1MV > 0  ->  price > PC / (0.9 x shares)
        //   BUY  when PC - MV - 0.1MV > 0  ->  price < PC / (1.1 x shares)
        const pc=Number(h.portfolio_control)||0, sh=Number(h.shares)||0;
        const sellAt=sh>0?pc/(0.9*sh):null;
        const buyAt =sh>0?pc/(1.1*sh):null;
        // indicative size once price is 10% beyond the trigger
        const bp=buyAt?buyAt*0.9:null, sp=sellAt?sellAt*1.1:null;
        const buyAmt =bp?Math.max(0,pc-1.1*bp*sh):0;
        const sellAmt=sp?Math.max(0,0.9*sp*sh-pc):0;
        const mine=(ledger||[]).filter(t=>String(t.symbol).toUpperCase()===String(h.symbol).toUpperCase());
        const isOpen=openSym===h.symbol;
        return <div key={h.id} style={card}>
          <div onClick={()=>setOpenSym(isOpen?null:h.symbol)} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,cursor:"pointer"}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:800,fontSize:14}}>{h.symbol}</div>
              <div style={{fontSize:11,color:"#888"}}>{h.name||""}</div>
              <div style={{fontSize:11,color:"#555",marginTop:3}}>
                {fmtN(h.shares)} sh @ avg {cur}{fmtN(h.avg_cost)}
              </div>
            </div>
            <div style={{textAlign:"right",flexShrink:0}}>
              <div style={{fontWeight:800,fontSize:14}}>{cur}{fmtN(s.mv)}</div>
              <span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:8,color:"#fff",background:sigColor(s.action)}}>{s.action}</span>
            </div>
          </div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:4,marginTop:8,padding:"6px 0",borderTop:"1px solid #f0f0f0",fontSize:11}}>

          {s.action==="HOLD"&&<div style={{background:"#f7f7f5",borderRadius:6,padding:"6px 9px",marginTop:6,

            {(()=>{
              const mv=Number(s.mv)||0, pc=Number(h.portfolio_control)||0, safe=Number(s.safe)||0;
              const gap=mv-pc;
              if(Math.abs(gap)<=safe)
                return "Inside the safe zone — "+cur+fmtN(Math.abs(gap))+" from Portfolio Control, and the zone absorbs "+cur+fmtN(safe)+".";
              const beyond=Math.abs(gap)-safe;
              const px=Number(h.last_price)||0;
              const sh=px?(beyond/px):0;
              return "Signal is only "+cur+fmtN(beyond)+" — about "+sh.toFixed(3)+" shares at "+cur+fmtN(px)+", too small to trade.";

              <div style={{fontSize:9.5,color:"#1565c0",fontWeight:700}}>NEXT BUY AT</div>
              <div style={{fontSize:12.5,fontWeight:800}}>{buyAt?cur+fmtN(buyAt):"—"}</div>
              <div style={{fontSize:9.5,color:"#666"}}>{buyAmt>0?"~"+cur+fmtN(buyAmt)+" if -10%":""}</div>

          {isOpen&&<div style={{marginTop:8,paddingTop:7,borderTop:"1px solid #f0f0f0"}}>

              HISTORY · {mine.length} transaction(s)</div>
            {mine.length===0
              ? <div style={{fontSize:11,color:"#999"}}>Nothing recorded for {h.symbol} yet.</div>
              : mine.slice().reverse().map((t,i)=><div key={i} style={{fontSize:11,padding:"4px 0",borderBottom:i<mine.length-1?"1px solid #f6f6f6":"none"}}>

                  <div style={{color:"#999",fontSize:10}}>
                    PC {cur}{fmtN(t.pc_before)} → {cur}{fmtN(t.pc_after)} · cash {cur}{fmtN(t.cash_after)}

            <button onClick={()=>removeShare(h.symbol)} disabled={!!busy}

            <input defaultValue={h.last_price} placeholder="price" inputMode="decimal"

            <button onClick={()=>{setTradeFor(h);setTf({action:s.action==="SELL"?"SELL":"BUY",shares:String(s.qty||""),price:String(h.last_price||""),costs:"",note:""});}}
              style={{...btn,background:"#5a3a1a",color:"#fff",flexShrink:0}}>Record trade</button>
          </div>
        </div>;
      })}

      {!openForm&&<button onClick={()=>setOpenForm(true)} style={{...btn,background:"#eee",color:"#333",width:"100%",padding:"10px"}}>
        + Open a new position
      </button>}

      {openForm&&<div style={{...card,background:"#fafafa"}}>
        <div style={{fontSize:11,color:"#888",fontWeight:700,marginBottom:6}}>OPEN POSITION · this sets Portfolio Control</div>
        {isCrypto
          ? <div style={{display:"flex",gap:6,marginBottom:6}}>
              {["BTC","ETH"].map(c=><button key={c} onClick={()=>setF({...f,symbol:c,name:c==="BTC"?"Bitcoin":"Ethereum"})}
                style={{...btn,flex:1,background:f.symbol===c?"#5a3a1a":"#eee",color:f.symbol===c?"#fff":"#555"}}>{c}</button>)}
            </div>
          : <input value={f.symbol} onChange={e=>setF({...f,symbol:e.target.value})} placeholder="Symbol (e.g. INFY)" style={inp}/>}
        <input value={f.name} onChange={e=>setF({...f,name:e.target.value})} placeholder="Company name" style={inp}/>
        <input value={f.shares} onChange={e=>setF({...f,shares:e.target.value})} placeholder="Shares" inputMode="decimal" style={inp}/>
        <input value={f.price} onChange={e=>setF({...f,price:e.target.value})} placeholder="Price per share" inputMode="decimal" style={inp}/>
        <input value={f.costs} onChange={e=>setF({...f,costs:e.target.value})} placeholder="Brokerage + taxes (optional)" inputMode="decimal" style={inp}/>
        <div style={{display:"flex",gap:6}}>
          <button onClick={doOpen} disabled={!!busy} style={{...btn,background:"#2e7d32",color:"#fff",flex:1}}>{busy==="open"?"…":"Open"}</button>
          <button onClick={()=>setOpenForm(false)} style={{...btn,background:"#eee",color:"#333"}}>Cancel</button>
        </div>
      </div>}

      {tradeFor&&<div style={{...card,background:"#fffdf5",borderColor:"#e0c080"}}>

        <div style={{display:"flex",gap:6,marginBottom:6}}>
          {["BUY","SELL"].map(a=><button key={a} onClick={()=>setTf({...tf,action:a})}

    {tab==="screener"&&<AIMScreener/>}

    {tab==="backtest"&&<AIMBacktest/>}

    {/* COMPARE */}
    {tab==="compare"&&<div>

      </div>
      {cmp&&cmp.map(b=><div key={b.book} style={{...card,borderColor:b.book==="CRYPTO"?"#e0a0a0":"#e0d5c0"}}>

              <div style={{display:"flex",justifyContent:"space-between",padding:"2px 0"}}><span>Market value</span><b>{b.book==="USA"?"$":"Rs."}{fmtN(b.marketValue)}</b></div>
              <div style={{display:"flex",justifyContent:"space-between",padding:"2px 0"}}>
                <span>Unrealised</span>
                <b style={{color:b.unrealised>=0?"#2e7d32":"#c62828"}}>{b.unrealised>=0?"+":""}{fmtN(b.unrealised)} ({b.unrealisedPct}%)</b></div>
              <div style={{display:"flex",justifyContent:"space-between",padding:"2px 0"}}>
                <span>Realised (banked)</span>
                <b style={{color:b.realised>=0?"#2e7d32":"#c62828"}}>{b.realised>=0?"+":""}{fmtN(b.realised)}</b></div>
              <div style={{display:"flex",justifyContent:"space-between",padding:"2px 0",color:"#888"}}><span>Costs paid</span><span>{fmtN(b.costsPaid)}</span></div>
              <div style={{borderTop:"1px solid #eee",marginTop:4,paddingTop:4}}>
                {b.book==="CRYPTO"
                  ? <div style={{display:"flex",justifyContent:"space-between",padding:"2px 0"}}>
                      <span>Tax on realised (31.2% flat)</span><b style={{color:"#c62828"}}>{fmtN(b.tax.crypto)}</b></div>
                  : <div>
                      <div style={{display:"flex",justifyContent:"space-between",padding:"2px 0"}}>
                        <span>If short term (20%)</span><b>{fmtN(b.tax.stcg)}</b></div>
                      <div style={{display:"flex",justifyContent:"space-between",padding:"2px 0"}}>
                        <span>If long term (12.5%)</span><b>{fmtN(b.tax.ltcg)}</b></div>
                    </div>}
              </div>
            </div>}
      </div>)}

      {cmp&&<div style={{...card,background:"#f8f8f4"}}>
        <div style={{fontSize:11,color:"#666",lineHeight:1.6}}>
          <b>Reading this fairly.</b> A pre-tax comparison flatters crypto. Equity long-term gains are
          taxed at 12.5% above the annual exemption and losses can be set off; crypto is 31.2% flat with
          no offset at all. On identical pre-tax returns the equity book keeps materially more.
          Also note the books cover different periods, so compare percentages rather than rupees until
          both have run the same length of time.
        </div>
      </div>}
    </div>}

    {/* ─────────────────────────────── LEDGER ─────────────────────────────── */}
    {tab==="ledger"&&<div>
      <div style={{fontSize:11,color:"#888",marginBottom:8}}>
        Append-only. Corrections are entered as new adjusting rows, never by editing history.
      </div>
      <button onClick={exportLedger} style={{padding:"8px 12px",borderRadius:6,border:"none",
        background:"#eee",color:"#333",fontSize:12,fontWeight:700,cursor:"pointer",width:"100%",marginBottom:8}}>
        ⬇ Export ledger to CSV</button>
      {!ledger.length&&!loading&&<div style={{padding:20,textAlign:"center",color:"#888",fontSize:13}}>No transactions yet.</div>}
      {ledger.map(t=><div key={t.id} style={card}>
        <div style={{display:"flex",justifyContent:"space-between",gap:8}}>
          <div>
            <span style={{fontSize:10,fontWeight:700,padding:"2px 6px",borderRadius:6,color:"#fff",background:sigColor(t.action)}}>{t.action}</span>
            <b style={{fontSize:13,marginLeft:6}}>{t.symbol}</b>
          </div>
          <div style={{fontSize:11,color:"#888"}}>{t.txn_date}</div>
        </div>
        <div style={{fontSize:12,marginTop:5}}>
          {fmtN(t.shares)} @ {cur}{fmtN(t.price)} = <b>{cur}{fmtN(t.amount)}</b>
          {num(t.costs)>0?<span style={{color:"#888"}}> + {cur}{fmtN(t.costs)} costs</span>:null}
        </div>
        <div style={{fontSize:10.5,color:"#888",marginTop:3}}>
          PC {cur}{fmtN(t.pc_before)} → {cur}{fmtN(t.pc_after)} · cash after {cur}{fmtN(t.cash_after)}
        </div>
        {t.note&&<div style={{fontSize:10.5,color:"#8a6a1a",marginTop:3}}>{t.note}</div>}
      </div>)}
    </div>}

    {/* ─────────────────────────────── AUDIT ─────────────────────────────── */}
    {tab==="audit"&&<div>
      <div style={{fontSize:11,color:"#888",marginBottom:8}}>
        Portfolio Control recomputed from the entire ledger and compared against the stored value.
      </div>
      {audit&&<div style={{...card,background:audit.clean?"#e8f5e9":"#ffebee",borderColor:audit.clean?"#a0d0a0":"#e0a0a0"}}>
        <div style={{fontSize:14,fontWeight:800,color:audit.clean?"#2e7d32":"#c62828"}}>
          {audit.clean?"✓ Ledger and holdings agree":"✗ "+audit.mismatches+" mismatch(es) found"}
        </div>
        <div style={{fontSize:11,color:"#666",marginTop:3}}>{audit.checked} position(s) checked</div>
      </div>}
      {audit&&audit.results.map(r=><div key={r.symbol} style={{...card,borderColor:r.ok?"#e0d5c0":"#e0a0a0"}}>
        <div style={{display:"flex",justifyContent:"space-between"}}>
          <b style={{fontSize:13}}>{r.symbol}</b>
          <span style={{fontSize:11,fontWeight:700,color:r.ok?"#2e7d32":"#c62828"}}>{r.ok?"✓ OK":"✗ MISMATCH"}</span>
        </div>
        <div style={{fontSize:11.5,marginTop:5}}>
          <div>Stored PC <b>{cur}{fmtN(r.storedPC)}</b> · from ledger <b>{cur}{fmtN(r.ledgerPC)}</b>
            {Math.abs(num(r.pcDiff))>=1&&<span style={{color:"#c62828",fontWeight:700}}> · diff {fmtN(r.pcDiff)}</span>}</div>
          <div>Stored shares <b>{fmtN(r.storedShares)}</b> · from ledger <b>{fmtN(r.ledgerShares)}</b></div>
          <div style={{color:"#888",marginTop:2}}>{r.txnCount} transaction(s)</div>
        </div>
      </div>)}
    </div>}

    {/* ────────────────────────────── GATE CHECK ────────────────────────────── */}
    {tab==="gate"&&<div>
      <div style={{fontSize:11,color:"#888",marginBottom:8}}>
        Stage 1 of the manual. Every rule must pass — a strong number never compensates for a failure.
      </div>
      <div style={card}>
        {[["profitableYears","Profitable years, of last 3"],["opMargin","Operating margin %"],
          ["bestRoe","Best ROE in last 4 years %"],["debtEquity","Debt to equity"],
          ["interestCover","Interest cover (x)"],["cashFlow","Operating cash flow"],
          ["marketCap",book==="INDIA"?"Market cap (Rs. crore)":"Market cap ($ million)"],
          ["price",book==="INDIA"?"Share price (Rs.)":"Share price ($)"],
          ["turnover",book==="INDIA"?"Daily turnover (Rs. crore)":"Daily turnover ($ million)"],
          ["yearsListed","Years listed"],["drawdown","% below 52-week high"]].map(([k,l])=>
          <div key={k} style={{marginBottom:6}}>
            <div style={{fontSize:10.5,color:"#888",marginBottom:2}}>{l}</div>
            <input value={g[k]} onChange={e=>setG({...g,[k]:e.target.value})} inputMode="decimal" style={{...inp,marginBottom:0}}/>
          </div>)}
        {book==="INDIA"&&<div>
          <div style={{marginBottom:6}}>
            <div style={{fontSize:10.5,color:"#888",marginBottom:2}}>Promoter pledge %</div>
            <input value={g.pledge} onChange={e=>setG({...g,pledge:e.target.value})} inputMode="decimal" style={{...inp,marginBottom:0}}/>
          </div>
          {[["auditorResigned","Auditor resigned in last 24 months"],
            ["qualifiedOpinion","Qualified audit opinion"],
            ["regulatoryAction","Regulatory action pending"]].map(([k,l])=>
            <label key={k} style={{display:"flex",alignItems:"center",gap:7,fontSize:12,padding:"5px 0",cursor:"pointer"}}>
              <input type="checkbox" checked={g[k]} onChange={e=>setG({...g,[k]:e.target.checked})}/>
              <span>{l}</span>
            </label>)}
        </div>}
        <button onClick={runGate} disabled={!!busy} style={{...btn,background:"#5a3a1a",color:"#fff",width:"100%",marginTop:8}}>
          {busy==="gate"?"…":"Run gate check"}
        </button>
      </div>

      {gRes&&<div>
        <div style={{...card,background:gRes.passed?"#e8f5e9":"#ffebee",borderColor:gRes.passed?"#a0d0a0":"#e0a0a0"}}>
          <div style={{fontSize:15,fontWeight:800,color:gRes.passed?"#2e7d32":"#c62828"}}>
            {gRes.passed?"✓ PASSES the quality gate":"✗ FAILS — "+gRes.failedCount+" rule(s)"}
          </div>
          <div style={{fontSize:11.5,color:"#666",marginTop:4}}>{gRes.drawdownBand}</div>
        </div>
        <div style={card}>
          {gRes.checks.map((c,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",gap:8,fontSize:11.5,padding:"4px 0",borderBottom:i<gRes.checks.length-1?"1px solid #f4f4f4":"none"}}>
            <span style={{color:c.pass?"#333":"#c62828",fontWeight:c.pass?400:700}}>
              {c.pass?"✓":"✗"} {c.rule}
            </span>
            <span style={{color:"#888",flexShrink:0}}>{c.detail}</span>
          </div>)}
        </div>
      </div>}
    </div>}
  </div>;
}
