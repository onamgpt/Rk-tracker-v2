// ------------------------------------------------------------
// Daily allowance bands, by road distance from the person's own
// headquarters. Thresholds are fixed; the rupee rates are set by
// the office and read from storage.
//   under 10 km      HQ
//   10 to 40 km      Ex-HQ
//   over 40 km       Outstation
// ------------------------------------------------------------
const DA_HQ_MAX = 10, DA_EXHQ_MAX = 40;

function daBandFor(km) {
  if (km === null || km === undefined || isNaN(km)) return null;
  if (km < DA_HQ_MAX)   return "HQ";
  if (km <= DA_EXHQ_MAX) return "Ex-HQ";
  return "Outstation";
}

function daRateFor(km, slabs) {
  const band = daBandFor(km);
  if (!band || !slabs) return { band: band, rate: 0 };
  const map = { "HQ":"hq", "Ex-HQ":"exhq", "Outstation":"outstation" };
  return { band: band, rate: Number(slabs[map[band]]) || 0 };
}

// ------------------------------------------------------------
// Succession. The nine men who carry Kerala and Tamil Nadu are
// almost all past sixty. What they hold is not the outlet list —
// that is cheap to rebuild — but who actually runs each shop now,
// how it pays, what it promised, and in what order the town is
// walked. Karnataka was lost because that was never written down.
//
// An outlet is "held" by a person until the company knows enough
// to serve it without him. These functions measure that gap.
// ------------------------------------------------------------

// Which facts must exist before an outlet can survive a handover.
const SUCCESSION_FIELDS = [
  { k:"ownerName",        w:10, label:"Who owns it" },
  { k:"ownerPhone",       w:14, label:"Owner's phone" },
  { k:"successorName",    w:16, label:"Who runs it next" },
  { k:"gps",              w:10, label:"Where it is" },
  { k:"distributor",      w:10, label:"Who supplies it" },
  { k:"paymentBehaviour", w:14, label:"How it pays" },
  { k:"monthlyCommitment",w:10, label:"What it committed" },
  { k:"visitDay",         w:10, label:"When it is visited" },
  { k:"relationshipNotes",w:6,  label:"What to know about them" }
];

function coverageOf(outlet) {
  if (!outlet) return 0;
  let got = 0, total = 0;
  SUCCESSION_FIELDS.forEach(f => {
    total += f.w;
    const v = outlet[f.k];
    if (v !== undefined && v !== null && String(v).trim() !== "") got += f.w;
  });
  return total ? Math.round(got / total * 100) : 0;
}

function missingFor(outlet) {
  return SUCCESSION_FIELDS.filter(f => {
    const v = outlet ? outlet[f.k] : null;
    return v === undefined || v === null || String(v).trim() === "";
  });
}

// Exposure = what it would cost to lose this outlet, weighed against
// how little the company knows about it independently of one man.
function exposureOf(outlet) {
  const cov   = coverageOf(outlet);
  const value = Number(outlet.avgMonthlyValue) || 0;
  const years = Number(outlet.yearsAssociated) || 0;

  // Long-standing outlets are worth more and are usually the ones
  // most tightly bound to a single person.
  const loyalty = years >= 15 ? 1.35 : years >= 8 ? 1.2 : years >= 3 ? 1.05 : 1;
  const blind   = (100 - cov) / 100;
  const score   = value * loyalty * blind;

  let band;
  if (cov >= 85)      band = "Secured";
  else if (cov >= 60) band = "Partial";
  else if (value >= 20000) band = "Critical";
  else                band = "Exposed";

  return { coverage: cov, exposure: Math.round(score), band: band, loyalty: loyalty };
}

// The beat, reconstructed rather than asked for. Every outlet carries
// the day of month it is visited on; grouping them rebuilds the route
// without anyone ever sitting down to write it out.
function beatOf(outlets, user) {
  const mine = (outlets||[]).filter(o => !user || o.assignedTo === user);
  const byDay = {};
  mine.forEach(o => {
    const d = String(o.visitDay||"").trim();
    if (!d) return;
    (byDay[d] = byDay[d] || []).push(o);
  });
  return Object.keys(byDay).sort((a,b)=>{
    const na=parseInt(a,10), nb=parseInt(b,10);
    if(!isNaN(na)&&!isNaN(nb)) return na-nb;
    return String(a).localeCompare(String(b));
  }).map(d => ({ day: d, outlets: byDay[d] }));
}

// ------------------------------------------------------------
// Points. Deliberately legible — a person must be able to work
// out their own score in their head, or it stops motivating.
//   target        1 point per 1% achieved, capped at 150
//   new party     25 each  (the behaviour we are trying to buy)
//   order booked  5 each
//   expense       <=10% +30 | 10-15% +10 | >15% -20
//   collection    collected >= sales +20
//   commitment    on track +25 | behind -15
// ------------------------------------------------------------
const EXP_IDEAL = 10, EXP_ALERT = 15;

function pointsFor(row, suggestions, user, fairplay) {
  const p = [];
  const u = user||row.user;

  // Batting — the runs on the board
  const ach = row.achPct===null ? 0 : Math.min(150, Math.round(row.achPct));
  if (row.achPct!==null) p.push({ label:"Target "+Math.round(row.achPct)+"%", pts:ach });

  // Hunting — what we are actually trying to buy
  if (row.newParties>0)  p.push({ label:row.newParties+" new part"+(row.newParties===1?"y":"ies"), pts:row.newParties*25 });

  if (row.orders>0)      p.push({ label:row.orders+" order"+(row.orders===1?"":"s"), pts:row.orders*5 });

  // Width — selling to many parties beats one large invoice
  if (row.distinctParties>1) p.push({ label:row.distinctParties+" parties billed", pts:row.distinctParties*8 });

  // Collection, graduated. Money in the bank is not all-or-nothing.
  if (row.sales>0) {
    const cr = row.collections/row.sales;
    const cp = Math.round(Math.min(1.2, cr)*40);
    p.push({ label:"Collected "+Math.round(cr*100)+"%", pts:cp });
  }

  // Economy rate
  if (row.expPct!==null) {
    if (row.expPct<=EXP_IDEAL)      p.push({ label:"Expense "+row.expPct.toFixed(1)+"%", pts:30 });
    else if (row.expPct<=EXP_ALERT) p.push({ label:"Expense "+row.expPct.toFixed(1)+"%", pts:10 });
    else                            p.push({ label:"Expense "+row.expPct.toFixed(1)+"%", pts:-20 });
  }

  // What they chose to sell, not merely how much. Scored as a band so the
  // person never sees a margin figure.
  if (row.mixPts) p.push({ label:"Product mix "+row.mixBand, pts:row.mixPts });

  // Turning up. Missing matches costs a side more than a bad innings.
  if (row.dayCount>=20)      p.push({ label:row.dayCount+" days reported", pts:30 });
  else if (row.dayCount>=12) p.push({ label:row.dayCount+" days reported", pts:15 });

  // Commitments made on brands they themselves asked for
  (suggestions||[]).forEach(s=>{
    if (s.user!==u || s.status!=="Launched") return;
    const months = s.launchedOn ? Math.max(1,Math.round((Date.now()-new Date(s.launchedOn).getTime())/(30*864e5))) : 0;
    if (!months) return;
    const owed = months*(Number(s.commitPerMonth)||0);
    const gap  = (Number(s.actualToDate)||0)-owed;
    p.push({ label:s.brand+(gap>=0?" on track":" behind"), pts: gap>=0?25:-15 });
  });

  // Fair play — awarded by hand, for the things no formula can see
  (fairplay||[]).forEach(f=>{
    if (f.user!==u) return;
    p.push({ label:"Fair play: "+(f.reason||"awarded"), pts:Number(f.pts)||0 });
  });

  const total = p.reduce((t,x)=>t+x.pts,0);
  return { total, parts:p };
}

// Number that counts up when it changes — the small reward that
// makes a score feel earned rather than merely displayed.
function CountUp({ value, prefix, suffix, style }) {
  const [shown,setShown]=useState(0);
  const prev=useRef(0);
  useEffect(()=>{
    const from=prev.current, to=Number(value)||0, t0=Date.now(), dur=850;
    let raf;
    const step=()=>{
      const k=Math.min(1,(Date.now()-t0)/dur);
      const e=1-Math.pow(1-k,3);                 // ease-out
      setShown(Math.round(from+(to-from)*e));
      if(k<1) raf=requestAnimationFrame(step); else prev.current=to;
    };
    raf=requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  },[value]);
  return <span style={style}>{prefix||""}{shown.toLocaleString("en-IN")}{suffix||""}</span>;
}

// Bar that fills on mount.
function FillBar({ pct, color, height }) {
  const [w,setW]=useState(0);
  useEffect(()=>{ const t=setTimeout(()=>setW(Math.max(0,Math.min(100,pct||0))),60); return ()=>clearTimeout(t); },[pct]);
  return <div style={{background:"#e8eee8",borderRadius:20,height:height||7,overflow:"hidden",width:"100%"}}>
    <div style={{width:w+"%",height:"100%",background:color||"#1a7a3a",borderRadius:20,
      transition:"width 900ms cubic-bezier(.22,1,.36,1)"}}/>
  </div>;
}

function Confetti({ fire }) {
  const [on,setOn]=useState(false);
  useEffect(()=>{ if(fire){ setOn(true); const t=setTimeout(()=>setOn(false),1600); return ()=>clearTimeout(t);} },[fire]);
  if(!on) return null;
  const cols=["#d4a017","#1a7a3a","#c33","#3a6ac3","#e08030"];
  return <div className="rk-confetti" style={{position:"relative",height:0}}>
    {Array.from({length:16}).map((_,i)=>
      <span key={i} style={{left:(6+i*6)+"%",background:cols[i%cols.length],
        animationDelay:(i*45)+"ms"}}/>)}
  </div>;
}

// ------------------------------------------------------------
// Field roll-up. One place that turns raw submissions into the
// numbers both the owner report and the team's own view use, so
// the two can never disagree with each other.
// ------------------------------------------------------------
function rollupField(reports, orders, parties, days, gpOf) {
  const cut = new Date(Date.now() - days*864e5).toISOString().slice(0,10);
  const inWin = d => String(d||"") >= cut;
  const by = {};
  const seed = u => { if(!by[u]) by[u]={ user:u, officer:u, sales:0, expenses:0, collections:0,
    dayCount:0, target:0, orders:0, orderValue:0, collectedAtOrder:0, newParties:0,
    distinctParties:0, contribution:0, lastSeen:"" }; return by[u]; };

  (reports||[]).forEach(r=>{
    if(!inWin(r.date)) return;
    const b=seed(r.user||"?"); b.officer=r.officer||b.officer;
    b.sales += Number(r.sales)||0;
    b.expenses += Number(r.expenses)||0;
    b.collections += Number(r.collections)||0;
    b.target += Number(r.target)||0;
    b.dayCount += 1;
    if((r.date||"") > b.lastSeen) b.lastSeen = r.date||"";
  });
  const partySets = {};
  (orders||[]).forEach(o=>{
    if(!inWin(o.date)) return;
    const u=o.user||"?";
    const b=seed(u); b.officer=o.officer||b.officer;
    b.orders += 1;
    b.orderValue += Number(o.value)||0;
    b.collectedAtOrder += Number(o.paid)||0;
    if((o.date||"") > b.lastSeen) b.lastSeen = o.date||"";
    if(!partySets[u]) partySets[u]={};
    if(o.party) partySets[u][String(o.party).trim().toLowerCase()]=1;
    // Contribution the order earned the company. Never surfaced to the
    // person who sold it — only ever converted into points.
    if (typeof gpOf === "function") {
      (o.lines||[]).forEach(l=>{
        const g = gpOf(l.item);            // {gp per dozen, dozPerCase}
        if(!g || !g.gp) return;
        const doz = (String(l.unit)==="cases") ? (Number(l.qty)||0)*(Number(g.dozPerCase)||1)
                                               : (Number(l.qty)||0);
        b.contribution += (Number(g.gp)||0)*doz;
      });
    }
  });
  (parties||[]).forEach(p=>{
    if(!inWin(p.date)) return;
    const b=seed(p.user||"?"); b.officer=p.officer||b.officer;
    b.newParties += 1;
  });

  const rows = Object.values(by).map(b=>({
    ...b,
    distinctParties: partySets[b.user] ? Object.keys(partySets[b.user]).length : 0,
    variance: b.sales - b.target,
    achPct: b.target>0 ? (b.sales/b.target*100) : null,
    expPct: b.sales>0 ? (b.expenses/b.sales*100) : null
  }));
  // Mix quality: contribution earned per rupee sold, banded against the
  // team's own average so it self-calibrates and needs no fixed target.
  const withMargin = rows.filter(r=>r.sales>0 && r.contribution>0);
  const avgMargin = withMargin.length
    ? withMargin.reduce((s,r)=>s+r.contribution/r.sales,0)/withMargin.length : 0;
  rows.forEach(r=>{
    r.mixRatio = r.sales>0 ? r.contribution/r.sales : 0;
    if(!avgMargin || !r.contribution){ r.mixBand="—"; r.mixPts=0; return; }
    const rel = r.mixRatio/avgMargin;
    if      (rel>=1.20){ r.mixBand="Excellent"; r.mixPts=50; }
    else if (rel>=1.05){ r.mixBand="Strong";    r.mixPts=35; }
    else if (rel>=0.95){ r.mixBand="Fair";      r.mixPts=15; }
    else               { r.mixBand="Weak";      r.mixPts=0;  }
  });

  const tot = rows.reduce((t,r)=>({
    sales:t.sales+r.sales, target:t.target+r.target, expenses:t.expenses+r.expenses,
    collections:t.collections+r.collections, orders:t.orders+r.orders,
    orderValue:t.orderValue+r.orderValue, newParties:t.newParties+r.newParties,
    contribution:t.contribution+r.contribution
  }), {sales:0,target:0,expenses:0,collections:0,orders:0,orderValue:0,newParties:0,contribution:0});
  return { rows, tot };
}

// ============================================================
// FIELD CONSOLE — the sales team's own screen.
// Deliberately shows NO cost, GP or margin anywhere. Rates are
// selling rates only. Everything submitted is marked unverified
// until the office reconciles it.
// ============================================================
function FieldConsole({ onClose, rootMode }) {
  const me = (typeof URL_USER!=="undefined"?URL_USER:"main");
  const officer = me.charAt(0).toUpperCase()+me.slice(1);
  const isOwner = (typeof IS_OWNER!=="undefined") ? IS_OWNER : (me==="main");
  const today = new Date().toISOString().slice(0,10);

  const [tab,setTab]=useState("order");
  const [busy,setBusy]=useState("");
  const [msg,setMsg]=useState("");

  const [rates,setRates]=useState([]);        // [{name, rate}] selling rate per dozen
  const [target,setTarget]=useState(null);    // {user: dailyTarget}
  const [feed,setFeed]=useState([]);          // recent team activity
  const [allOrders,setAllOrders]=useState([]);
  const [allReports,setAllReports]=useState([]);
  const [allParties,setAllParties]=useState([]);
  const [mySugg,setMySugg]=useState([]);
  const [mDays,setMDays]=useState(30);
  const [fair,setFair]=useState([]);
  const [claims,setClaims]=useState([]);
  const [incent,setIncent]=useState({rupeesPerPoint:0,minPoints:0});
  const [homeAddr,setHomeAddr]=useState("");
  const [pmaster,setPmaster]=useState([]);
  const [contacts,setContacts]=useState({prakashEmail:""});
  const [slabs,setSlabs]=useState({hq:"",exhq:"",outstation:""});
  const [locs,setLocs]=useState([]);
  const [gps,setGps]=useState(null);        // {lat,lng}
  const [daKm,setDaKm]=useState(null);
  const [daBusy,setDaBusy]=useState(false);
  const [daErr,setDaErr]=useState("");
  const [outlets,setOutlets]=useState([]);
  const [stock,setStock]=useState([]);
  const [askOutlet,setAskOutlet]=useState(null);   // today's single question
  const [askVal,setAskVal]=useState("");
  const [oForm,setOForm]=useState(null);           // outlet being added or edited
  const [daConfirm,setDaConfirm]=useState(null);   // pending claim awaiting his yes
  const [daClaimed,setDaClaimed]=useState(null);   // what he actually agreed to
  const [remindOpen,setRemindOpen]=useState("");
  const [remindNote,setRemindNote]=useState("");

  // ---- order entry
  const [party,setParty]=useState("");
  const [town,setTown]=useState("");
  const [lines,setLines]=useState([{item:"",qty:"",unit:"cases"}]);
  const [cart,setCart]=useState({});          // {itemName: {qty, unit}}
  const [catSearch,setCatSearch]=useState("");
  const [partyPick,setPartyPick]=useState(true);     // choose a known shop, or type a new one
  const [otherOpen,setOtherOpen]=useState(false);
  const [otherName,setOtherName]=useState(""), [otherRate,setOtherRate]=useState("");
  const [paid,setPaid]=useState("");
  const [orderNote,setOrderNote]=useState("");

  // ---- day figures
  const [sales,setSales]=useState("");
  const [expenses,setExpenses]=useState("");
  const [collections,setCollections]=useState("");

  // ---- new party
  const [npName,setNpName]=useState(""), [npTown,setNpTown]=useState(""),
        [npPhone,setNpPhone]=useState(""), [npStocks,setNpStocks]=useState(""),
        [npPot,setNpPot]=useState("");

  // ---- competitor
  const [cpParty,setCpParty]=useState(""), [cpBrand,setCpBrand]=useState(""),
        [cpLifting,setCpLifting]=useState(""), [cpOurBrand,setCpOurBrand]=useState(""),
        [cpCommit,setCpCommit]=useState("");

  // ---- suggestion
  const [sgBrand,setSgBrand]=useState(""), [sgWhy,setSgWhy]=useState(""),
        [sgCommit,setSgCommit]=useState("");

  // ---- recruitment
  const [rcName,setRcName]=useState(""), [rcArea,setRcArea]=useState(""),
        [rcStage,setRcStage]=useState("Identified");

  const store = async (key, rec) => {
    let cur=[];
    try{ const r=await sheetsAPI("getPortfolio",{key:key,user:"main"}); if(r&&r.data&&Array.isArray(r.data)) cur=r.data; }catch(e){}
    cur.unshift(rec);
    await sheetsAPI("savePortfolio",{key:key,user:"main",data:cur});
    return cur;
  };

  // One tap to nudge Prakash about a specific order. Telegram always,
  // plus email when an address is on file.
  const remindPrakash = async (order, note) => {
    const paidSoFar=(order.payments&&order.payments.length)
      ? order.payments.reduce((s,p)=>s+(Number(p.amount)||0),0) : (Number(order.paid)||0);
    const due=Math.max(0,(Number(order.value)||0)-paidSoFar);
    const items=(order.lines||[]).map(l=>l.qty+" "+l.unit+" "+l.item).join(", ");
    const body=
      "🔔 <b>"+officer+"</b> is asking Prakash about an order\n"+
      "<b>"+order.party+"</b>"+(order.town?(" · "+order.town):"")+"\n"+
      items+"\n"+
      "Booked "+order.date+" · ₹"+Number(order.value||0).toLocaleString("en-IN")+
      "\nStatus: "+(order.status||"Placed")+
      (due>0?("\nBalance ₹"+due.toLocaleString("en-IN")):"\nFully paid")+
      (note?("\n\n\""+note+"\""):"");
    await broadcast(body);
    if(contacts.prakashEmail){
      try{
        await fetch("/.netlify/functions/mail",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            to:[contacts.prakashEmail],
            subject:"Reminder from "+officer+" — "+order.party+" ("+(order.status||"Placed")+")",
            html:"<h3>"+officer+" is asking about this order</h3>"+
              "<p><b>Party:</b> "+order.party+(order.town?(" · "+order.town):"")+
              "<br><b>Booked:</b> "+order.date+
              "<br><b>Status:</b> "+(order.status||"Placed")+
              "<br><b>Value:</b> ₹"+Number(order.value||0).toLocaleString("en-IN")+
              (due>0?("<br><b>Balance:</b> ₹"+due.toLocaleString("en-IN")):"<br><b>Fully paid</b>")+
              "</p><p><b>Items:</b> "+items+"</p>"+
              (note?("<p><b>Message:</b> "+note+"</p>"):"")
          })});
      }catch(e){}
    }
    try{
      let cur=[]; const r=await sheetsAPI("getPortfolio",{key:"field_orders",user:"main"});
      if(r&&r.data&&Array.isArray(r.data)) cur=r.data;
      const n=cur.map(o=>o.id===order.id
        ? {...o, lastReminded:new Date().toISOString().slice(0,10),
           reminderCount:(Number(o.reminderCount)||0)+1} : o);
      await sheetsAPI("savePortfolio",{key:"field_orders",user:"main",data:n});
      setAllOrders(n);
    }catch(e){}
  };

  // Ask for exactly one thing a day, and ask for the thing whose absence
  // would hurt most. A man will answer one question between two shops.
  // He will never sit down and fill a form about his own territory.
  const pickQuestion = (list) => {
    const mine=(list||[]).filter(o=>o.assignedTo===me);
    if(!mine.length) return null;
    const stamp=new Date().toISOString().slice(0,10);
    let best=null, bestScore=-1;
    mine.forEach(o=>{
      if(o.askedOn===stamp) return;              // already asked today
      const gaps=missingFor(o);
      if(!gaps.length) return;
      const gap=gaps.sort((a,b)=>b.w-a.w)[0];    // the heaviest missing fact
      const value=Number(o.avgMonthlyValue)||0;
      const score=gap.w*100 + value/100;
      if(score>bestScore){ bestScore=score; best={outlet:o,field:gap}; }
    });
    return best;
  };

  React.useEffect(()=>{ if(outlets.length) setAskOutlet(pickQuestion(outlets)); },[outlets]);

  const answerQuestion = async () => {
    if(!askOutlet||!askVal.trim()) return;
    setBusy("ask");
    try{
      let cur=[]; const r=await sheetsAPI("getPortfolio",{key:"field_outlets",user:"main"});
      if(r&&r.data&&Array.isArray(r.data)) cur=r.data;
      const stamp=new Date().toISOString().slice(0,10);
      const n=cur.map(o=>o.id===askOutlet.outlet.id
        ? {...o,[askOutlet.field.k]:askVal.trim(),askedOn:stamp,
           answeredCount:(Number(o.answeredCount)||0)+1,
           lastDocumentedBy:me,lastDocumentedOn:stamp}
        : o);
      await sheetsAPI("savePortfolio",{key:"field_outlets",user:"main",data:n});
      setOutlets(n); setAskVal(""); setMsg("✓ Thank you — that is now recorded");
      setAskOutlet(pickQuestion(n));
    }catch(e){ setMsg("✗ Could not save"); }
    setBusy("");
  };

  const skipQuestion = async () => {
    if(!askOutlet) return;
    const stamp=new Date().toISOString().slice(0,10);
    const n=outlets.map(o=>o.id===askOutlet.outlet.id?{...o,askedOn:stamp}:o);
    setOutlets(n); setAskVal("");
    try{ await sheetsAPI("savePortfolio",{key:"field_outlets",user:"main",data:n}); }catch(e){}
    setAskOutlet(pickQuestion(n));
  };

  // My own headquarters, as registered by the office.
  const myHQ = () => {
    const rec=(locs||[]).find(l=>String(l.name||"").toLowerCase()===me.toLowerCase());
    return rec ? (rec.coordinates||rec.address||"") : "";
  };

  // Read the phone's position, then ask Google for the ROAD distance back to
  // headquarters. Straight-line would understate Kerala journeys badly.
  const captureLocation = async () => {
    setDaErr(""); setDaBusy(true); setDaKm(null);
    const hq=myHQ();
    if(!hq){ setDaErr("Your headquarters is not on file yet — ask the office to add it."); setDaBusy(false); return; }
    if(!navigator.geolocation){ setDaErr("This phone cannot report its position."); setDaBusy(false); return; }
    navigator.geolocation.getCurrentPosition(async pos=>{
      const here=pos.coords.latitude.toFixed(6)+","+pos.coords.longitude.toFixed(6);
      setGps({lat:pos.coords.latitude,lng:pos.coords.longitude});
      try{
        const r=await fetch("/.netlify/functions/distance",{method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({origin:hq,destination:here})});
        const j=await r.json();
        if(j&&j.ok){
          setDaKm(j.km);
          if(j.destinationText&&!town) setTown(j.destinationText);
          const d=daRateFor(j.km,slabs);
          setDaConfirm({ km:j.km, band:d.band, rate:d.rate,
            where:j.destinationText||here, minutes:j.durationMin });
        } else {
          setDaErr("Could not work out the road distance"+(j&&j.status?(" ("+j.status+")"):"")+".");
        }
      }catch(e){ setDaErr("Could not reach the distance service."); }
      setDaBusy(false);
    }, err=>{
      setDaErr(err.code===1?"Location permission was refused.":"Could not read your position.");
      setDaBusy(false);
    }, {enableHighAccuracy:true,timeout:15000,maximumAge:60000});
  };

  const broadcast = async (text) => {
    try{
      await fetch("/.netlify/functions/telegram",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({action:"send",chatId:"-5372910186",message:text})});
    }catch(e){}
  };

  useEffect(()=>{ (async()=>{
    try{ const r=await sheetsAPI("getPortfolio",{key:"field_rates",user:"main"}); if(r&&r.data&&Array.isArray(r.data)) setRates(r.data); }catch(e){}
    try{ const t=await sheetsAPI("getPortfolio",{key:"field_targets",user:"main"}); if(t&&t.data) setTarget(t.data); }catch(e){}
    try{ const f=await sheetsAPI("getPortfolio",{key:"field_orders",user:"main"}); if(f&&f.data&&Array.isArray(f.data)) setFeed(f.data.slice(0,25)); }catch(e){}
    try{ const a=await sheetsAPI("getPortfolio",{key:"field_orders",user:"main"}); if(a&&a.data&&Array.isArray(a.data)) setAllOrders(a.data); }catch(e){}
    try{ const p=await sheetsAPI("getPortfolio",{key:"field_reports",user:"main"}); if(p&&p.data&&Array.isArray(p.data)) setAllReports(p.data); }catch(e){}
    try{ const q=await sheetsAPI("getPortfolio",{key:"field_newparties",user:"main"}); if(q&&q.data&&Array.isArray(q.data)) setAllParties(q.data); }catch(e){}
    try{ const g=await sheetsAPI("getPortfolio",{key:"field_suggestions",user:"main"}); if(g&&g.data&&Array.isArray(g.data)) setMySugg(g.data); }catch(e){}
    try{ const fp=await sheetsAPI("getPortfolio",{key:"field_fairplay",user:"main"}); if(fp&&fp.data&&Array.isArray(fp.data)) setFair(fp.data); }catch(e){}
    try{ const cl=await sheetsAPI("getPortfolio",{key:"field_claims",user:"main"}); if(cl&&cl.data&&Array.isArray(cl.data)) setClaims(cl.data); }catch(e){}
    try{ const ic=await sheetsAPI("getPortfolio",{key:"field_incentive",user:"main"}); if(ic&&ic.data) setIncent(ic.data); }catch(e){}
    try{ const pm=await sheetsAPI("getPortfolio",{key:"spectrum_master",user:"main"}); if(pm&&pm.data&&Array.isArray(pm.data)) setPmaster(pm.data); }catch(e){}
    try{ const ct=await sheetsAPI("getPortfolio",{key:"field_contacts",user:"main"}); if(ct&&ct.data) setContacts(ct.data); }catch(e){}
    try{ const sl=await sheetsAPI("getPortfolio",{key:"field_da_slabs",user:"main"}); if(sl&&sl.data) setSlabs(sl.data); }catch(e){}
    try{ const lc=await sheetsAPI("getPortfolio",{key:"field_locations",user:"main"}); if(lc&&lc.data&&Array.isArray(lc.data)) setLocs(lc.data); }catch(e){}
    try{ const ou=await sheetsAPI("getPortfolio",{key:"field_outlets",user:"main"}); if(ou&&ou.data&&Array.isArray(ou.data)) setOutlets(ou.data); }catch(e){}
    try{ const sk=await sheetsAPI("getPortfolio",{key:"field_stock",user:"main"}); if(sk&&sk.data&&Array.isArray(sk.data)) setStock(sk.data); }catch(e){}
  })(); },[]);

  const rateOf = n => {
    const c=cart&&cart[n];
    if(c&&Number(c.rate)>0) return Number(c.rate);   // item entered by hand
    const r=rates.find(x=>x.name===n); return r?Number(r.rate)||0:0;
  };
  // Used only to place the person in a mix band. Deliberately never displayed.
  const gpOf = n => {
    const r=rates.find(x=>x.name===n); if(!r||!r.sku) return null;
    const m=(pmaster||[]).find(x=>x.sku===r.sku); if(!m) return null;
    return { gp:Number(m.gp)||0, dozPerCase:Number(r.dozPerCase)||1 };
  };
  const lineVal = l => rateOf(l.item)*(Number(l.qty)||0);
  const orderTotal = lines.reduce((s,l)=>s+lineVal(l),0);

  const submitOrder=async()=>{
    if(!party.trim()) { setMsg("✗ Party name needed"); return; }
    const good=Object.entries(cart).map(([n,c])=>({item:n,qty:Number(c.qty)||0,
                      unit:c.unit||"cases", rate:rateOf(n), offList:!!c.offList}))
                    .filter(l=>l.qty>0);
    if(!good.length){ setMsg("✗ Add at least one item"); return; }
    setBusy("order"); setMsg("");
    try{
      const cartTotal=good.reduce((s,l)=>s+rateOf(l.item)*l.qty,0);
      const rec={ id:"fo_"+Date.now(), officer:officer, user:me, date:today, time:new Date().toISOString(),
        party:party.trim(), town:town.trim(), lines:good, value:cartTotal,
        paid:Number(paid)||0, payments:(Number(paid)>0?[{date:today,amount:Number(paid),mode:"on order"}]:[]),
        note:orderNote, status:"Placed", invoiceNo:"", transporter:"", lrNumber:"",
        expectedDelivery:"", verified:false };
      await store("field_orders", rec);
      const items=good.map(l=>l.qty+" "+l.unit+" "+l.item).join(", ");
      await broadcast("🛒 <b>"+officer+"</b> booked an order\n"+
        party.trim()+(town.trim()?(" · "+town.trim()):"")+"\n"+items+
        "\nValue ₹"+cartTotal.toLocaleString("en-IN")+
        (Number(paid)>0?("\nCollected ₹"+Number(paid).toLocaleString("en-IN")):""));
      // Email is best effort — the order is already saved either way.
      try{
        await fetch("/.netlify/functions/mail",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            to:["onamgpt@gmail.com"],
            subject:"Order — "+party.trim()+" — ₹"+cartTotal.toLocaleString("en-IN")+" ("+officer+")",
            html:"<h3>Order booked by "+officer+"</h3>"+
              "<p><b>Party:</b> "+party.trim()+"<br><b>Town:</b> "+(town.trim()||"—")+
              "<br><b>Date:</b> "+today+"</p><table border=1 cellpadding=6 cellspacing=0>"+
              "<tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>"+
              good.map(l=>"<tr><td>"+l.item+"</td><td>"+l.qty+" "+l.unit+"</td><td>₹"+
                rateOf(l.item)+"</td><td>₹"+(rateOf(l.item)*l.qty).toLocaleString("en-IN")+"</td></tr>").join("")+
              "<tr><td colspan=3 align=right><b>Total</b></td><td><b>₹"+cartTotal.toLocaleString("en-IN")+
              "</b></td></tr></table>"+
              (Number(paid)>0?"<p><b>Collected on order:</b> ₹"+Number(paid).toLocaleString("en-IN")+"</p>":"")+
              (orderNote?"<p><b>Note:</b> "+orderNote+"</p>":"")
          })});
      }catch(e){}
      setMsg("✓ Order booked and sent to the group");
      setParty("");setTown("");setCart({});setCatSearch("");setPaid("");setOrderNote("");
      try{ const f=await sheetsAPI("getPortfolio",{key:"field_orders",user:"main"}); if(f&&f.data) setFeed(f.data.slice(0,25)); }catch(e){}
    }catch(e){ setMsg("✗ Could not submit — try again"); }
    setBusy("");
  };

  const myTarget = target && target[me] ? Number(target[me]) : 0;
  const variance = (Number(sales)||0) - myTarget;

  const submitDay=async()=>{
    setBusy("day"); setMsg("");
    try{
      const da=daClaimed ? {band:daClaimed.band,rate:daClaimed.rate} : {band:"",rate:0};
      await store("field_reports", { id:"fr_"+Date.now(), officer:officer, user:me, date:today,
        time:new Date().toISOString(), location:town.trim(), sales:sales, expenses:expenses,
        collections:collections, target:myTarget, variance:variance,
        gps:gps?(gps.lat.toFixed(6)+","+gps.lng.toFixed(6)):"", km:daClaimed?daClaimed.km:null,
        daBand:da.band||"", daRate:da.rate||0,
        daConfirmedBy:daClaimed?me:"", daConfirmedAt:daClaimed?new Date().toISOString():"",
        daPlace:daClaimed?daClaimed.where:"", verified:false });
      setMsg("✓ Day figures submitted");
      setSales("");setExpenses("");setCollections("");
      setDaClaimed(null);setDaKm(null);setGps(null);
    }catch(e){ setMsg("✗ Could not submit"); }
    setBusy("");
  };

  const submitNewParty=async()=>{
    if(!npName.trim()){ setMsg("✗ Name needed"); return; }
    setBusy("np"); setMsg("");
    try{
      await store("field_newparties", { id:"np_"+Date.now(), officer:officer, user:me, date:today,
        name:npName.trim(), town:npTown.trim(), phone:npPhone.trim(),
        stocks:npStocks.trim(), potential:npPot, converted:false });
      await broadcast("🆕 <b>"+officer+"</b> met a new party\n"+npName.trim()+(npTown.trim()?(" · "+npTown.trim()):""));
      setMsg("✓ New party recorded");
      setNpName("");setNpTown("");setNpPhone("");setNpStocks("");setNpPot("");
    }catch(e){ setMsg("✗ Could not submit"); }
    setBusy("");
  };

  const submitCompetitor=async()=>{
    if(!cpParty.trim()||!cpBrand.trim()){ setMsg("✗ Party and competitor brand needed"); return; }
    setBusy("cp"); setMsg("");
    try{
      await store("field_competitor", { id:"cp_"+Date.now(), officer:officer, user:me, date:today,
        party:cpParty.trim(), competitorBrand:cpBrand.trim(), theirLifting:cpLifting,
        ourBrand:cpOurBrand.trim(), commitment:cpCommit, delivered:null, closed:false });
      setMsg("✓ Recorded — commitment will be tracked");
      setCpParty("");setCpBrand("");setCpLifting("");setCpOurBrand("");setCpCommit("");
    }catch(e){ setMsg("✗ Could not submit"); }
    setBusy("");
  };

  const submitSuggestion=async()=>{
    if(!sgBrand.trim()){ setMsg("✗ Brand idea needed"); return; }
    if(!(Number(sgCommit)>0)){ setMsg("✗ State how many dozens a month you will move"); return; }
    setBusy("sg"); setMsg("");
    try{
      await store("field_suggestions", { id:"sg_"+Date.now(), officer:officer, user:me, date:today,
        brand:sgBrand.trim(), why:sgWhy.trim(), commitPerMonth:Number(sgCommit),
        status:"Proposed", launchedOn:null, actualToDate:0, closed:false });
      await broadcast("💡 <b>"+officer+"</b> proposes a new brand: "+sgBrand.trim()+
        "\nCommitted to move "+sgCommit+" doz/month if introduced");
      setMsg("✓ Suggestion recorded with your commitment");
      setSgBrand("");setSgWhy("");setSgCommit("");
    }catch(e){ setMsg("✗ Could not submit"); }
    setBusy("");
  };

  const submitRecruit=async()=>{
    if(!rcName.trim()){ setMsg("✗ Candidate name needed"); return; }
    setBusy("rc"); setMsg("");
    try{
      await store("field_recruits", { id:"rc_"+Date.now(), officer:officer, user:me, date:today,
        candidate:rcName.trim(), area:rcArea.trim(), stage:rcStage, joined:false });
      setMsg("✓ Candidate recorded");
      setRcName("");setRcArea("");setRcStage("Identified");
    }catch(e){ setMsg("✗ Could not submit"); }
    setBusy("");
  };

  const inp={width:"100%",padding:"10px",borderRadius:8,border:"1.5px solid #cfd8cf",fontSize:14,marginBottom:9,boxSizing:"border-box"};
  const lab={fontSize:11.5,fontWeight:700,color:"#1a5a3a",display:"block",marginBottom:3};
  const btn={width:"100%",padding:"12px",borderRadius:10,border:"none",
    background:"linear-gradient(135deg,#1a7a4a,#0a5a2a)",color:"#fff",fontWeight:700,fontSize:15,cursor:"pointer"};
  const tabBtn=(k,l)=>(<button key={k} onClick={()=>{setTab(k);setMsg("");}} style={{padding:"7px 11px",borderRadius:8,border:"none",
    background:tab===k?"#1a5a3a":"#e8f0e8",color:tab===k?"#fff":"#3a5a3a",fontWeight:700,fontSize:11.5,cursor:"pointer"}}>{l}</button>);

  return (
    <div style={{padding:rootMode?"14px 13px 44px":4,maxWidth:rootMode?560:"none",margin:"0 auto"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
        <span style={{fontSize:26}}>🧭</span>
        <div style={{flex:1}}>
          <h2 style={{margin:0,fontSize:18,color:"#1a5a3a"}}>Field Console</h2>
          <div style={{fontSize:11,color:"#6a7a6a"}}>{officer} · {new Date().toLocaleDateString()}</div>
        </div>
        {rootMode&&<span style={{fontSize:9,color:"#c0c8c0",marginRight:6}}>{BUILD_STAMP}</span>}
        {rootMode&&<button onClick={()=>window.location.reload()} title="Refresh"
          style={{border:"1px solid #d8e0d8",background:"#fff",borderRadius:8,
          padding:"6px 10px",fontSize:13,cursor:"pointer",color:"#5a7a5a"}}>↻</button>}
      </div>

      <div style={{display:"flex",gap:6,marginBottom:8}}>
        <button onClick={()=>{setTab("order");setMsg("");}} style={{flex:1,padding:"13px 10px",borderRadius:11,border:"none",
          background:tab==="order"?"linear-gradient(135deg,#1a7a4a,#0a5a2a)":"#e8f0e8",

          <div style={{fontSize:12,fontWeight:800,color:"#1a5a3a",marginBottom:5}}>Saved locations</div>

            ? <div style={{fontSize:12,color:"#999",textAlign:"center",padding:"14px 0"}}>None yet.</div>

                <div style={{flex:1}}>
                  <b style={{fontSize:12.5,color:"#1a5a3a",display:"block"}}>{l.name}</b>
                  {l.address&&<div style={{fontSize:11,color:"#666"}}>{l.address}</div>}

      })()}

      {tab==="rates"&&<div>
        <div style={{fontSize:11.5,color:"#5a7a5a",marginBottom:9}}>
          Selling rate per unit as the team should quote it. They never see cost or margin.

        {(pmaster||[]).length>0&&<div style={{background:"#eef4fb",border:"1px solid #c8daea",
          borderRadius:10,padding:"11px 12px",marginBottom:11}}>
          <div style={{fontSize:11.5,color:"#1a3a7a",marginBottom:7,lineHeight:1.5}}>
            <b>{pmaster.length} products</b> are already in your product master. Pull them in as rates

          <button onClick={()=>{
            const have=new Set((rates||[]).map(r=>String(r.sku||"")).filter(Boolean));
            const add=(pmaster||[]).filter(m=>m.sku&&!have.has(String(m.sku)))
              .map(m=>({name:m.name||m.sku, rate:Number(m.sp)||"", sku:m.sku, dozPerCase:12}));

      {tab==="orders"&&<div>
        {orders.length===0?<div style={{fontSize:12,color:"#999",textAlign:"center",padding:"18px 0"}}>No field orders yet.</div>

          <div style={{fontSize:11.5,color:"#555"}}>{(o.lines||[]).map(l=>l.qty+" "+l.unit+" "+l.item).join(", ")}</div>

          <select value={o.status||"Placed"} onChange={e=>setOrderStatus(o.id,e.target.value)} style={{...inp,fontSize:12,padding:"6px",marginBottom:5}}>
            {STATUSES.map(s=><option key={s} value={s}>{s}</option>)}

          <details>

            <div style={{display:"flex",gap:5,marginBottom:5}}>
              <input value={o.invoiceNo||""} placeholder="invoice no"
                onChange={e=>patchOrder(o.id,{invoiceNo:e.target.value})}

              <input value={o.expectedDelivery||""} placeholder="expected date" type="date"
                onChange={e=>patchOrder(o.id,{expectedDelivery:e.target.value})}

            </div>
            <div style={{display:"flex",gap:5,marginBottom:6}}>
              <input value={o.transporter||""} placeholder="transporter"
                onChange={e=>patchOrder(o.id,{transporter:e.target.value})}
                style={{...inp,fontSize:11.5,padding:"6px",flex:1}}/>
              <input value={o.lrNumber||""} placeholder="LR / docket no"
                onChange={e=>patchOrder(o.id,{lrNumber:e.target.value})}
                style={{...inp,fontSize:11.5,padding:"6px",flex:1}}/>
            </div>
            {(()=>{
              const pd=(o.payments||[]).reduce((s,p)=>s+(Number(p.amount)||0),0)||Number(o.paid)||0;
              const due=Math.max(0,(Number(o.value)||0)-pd);
              return <div>
                <div style={{fontSize:11.5,marginBottom:5,color:due===0?"#1a7a3a":"#a0661a",fontWeight:700}}>
                  Paid ₹{pd.toLocaleString("en-IN")} · {due===0?"settled":"balance ₹"+due.toLocaleString("en-IN")}</div>
                <div style={{display:"flex",gap:5}}>
                  <input id={"pay_"+o.id} type="number" placeholder="add payment ₹" inputMode="decimal"
                    style={{...inp,fontSize:11.5,padding:"6px",flex:1}}/>
                  <button onClick={()=>{
                    const el=document.getElementById("pay_"+o.id);
                    const amt=Number(el&&el.value); if(!amt) return;
                    const ps=[...(o.payments||[]),{date:new Date().toISOString().slice(0,10),amount:amt,mode:"received"}];
                    patchOrder(o.id,{payments:ps}); if(el) el.value="";
                  }} style={{padding:"6px 12px",borderRadius:7,border:"none",background:"#1a5a3a",
                    color:"#fff",fontWeight:700,fontSize:11.5,cursor:"pointer"}}>+ Pay</button>
                </div>
              </div>;
            })()}
          </details>
        </div>)}
      </div>}

      {tab==="sugg"&&<div>
        <div style={{fontSize:11.5,color:"#8a6a2a",background:"#fdf8e8",padding:"9px 11px",borderRadius:8,marginBottom:10}}>
          Every suggestion carries the person's own monthly commitment. Once launched, actual against
          commitment is the accountability.</div>
        {sugg.length===0?<div style={{fontSize:12,color:"#999",textAlign:"center",padding:"18px 0"}}>No suggestions yet.</div>
        :sugg.map((s,i)=>{
          const months=s.launchedOn?Math.max(1,Math.round((Date.now()-new Date(s.launchedOn).getTime())/(30*864e5))):0;
          const owed=months*(Number(s.commitPerMonth)||0);
          const gap=(Number(s.actualToDate)||0)-owed;
          return <div key={s.id||i} style={{padding:"10px 0",borderBottom:"1px solid #eef2ee"}}>
            <div style={{display:"flex",justifyContent:"space-between",gap:8}}>
              <b style={{fontSize:13.5,color:"#1a5a3a"}}>{s.brand}</b>
              <span style={{fontSize:10.5,color:"#999"}}>{s.officer} · {s.date}</span>
            </div>
            {s.why&&<div style={{fontSize:11.5,color:"#666",marginBottom:3}}>{s.why}</div>}
            <div style={{fontSize:11.5,color:"#444"}}>Committed <b>{s.commitPerMonth} doz/month</b></div>
            <details style={{marginTop:5}}>
              <summary style={{fontSize:10.5,color:"#5a7a5a",cursor:"pointer"}}>edit</summary>
              <div style={{marginTop:6}}>
                <input value={s.brand||""} placeholder="brand name"
                  onChange={e=>patchSugg(s.id,{brand:e.target.value})}
                  style={{...inp,fontSize:12,padding:"6px",marginBottom:5}}/>
                <textarea value={s.why||""} rows={2} placeholder="why this brand"
                  onChange={e=>patchSugg(s.id,{why:e.target.value})}
                  style={{...inp,fontSize:12,padding:"6px",marginBottom:5,resize:"vertical",fontFamily:"inherit"}}/>
                <div style={{display:"flex",gap:5}}>
                  <input type="number" value={s.commitPerMonth||""} inputMode="numeric"
                    placeholder="doz/month committed"
                    onChange={e=>patchSugg(s.id,{commitPerMonth:Number(e.target.value)||0})}
                    style={{...inp,fontSize:12,padding:"6px",flex:1}}/>
                  <button onClick={()=>deleteSugg(s.id,s.brand)}
                    style={{padding:"6px 12px",borderRadius:7,border:"1px solid #e8c0c0",
                    background:"#fff5f5",color:"#c33",fontWeight:700,fontSize:11.5,cursor:"pointer"}}>
                    Delete</button>
                </div>
              </div>
            </details>
            <div style={{display:"flex",gap:5,marginTop:5,alignItems:"center"}}>
              <select value={s.status||"Proposed"} onChange={e=>setSuggStatus(s.id,e.target.value)} style={{...inp,fontSize:12,padding:"6px",flex:1}}>
                <option>Proposed</option><option>Rejected</option><option>Launched</option><option>Closed</option>
              </select>
              {s.status==="Launched"&&<input type="number" value={s.actualToDate||""} onChange={e=>setSuggActual(s.id,e.target.value)}
                placeholder="actual doz" inputMode="numeric" style={{...inp,width:100,flex:"0 0 100px",fontSize:12,padding:"6px"}}/>}
            </div>
            {s.status==="Launched"&&months>0&&<div style={{marginTop:5,fontSize:11.5,
              background:gap>=0?"#e8f5e9":"#fdecea",padding:"6px 9px",borderRadius:7,
              color:gap>=0?"#1a7a3a":"#c33",fontWeight:700}}>
              {months} month(s) live · owed {owed} doz · actual {s.actualToDate||0} doz · {gap>=0?"+":""}{gap} doz
            </div>}
          </div>;
        })}
      </div>}

      {tab==="market"&&<div>
        {comp.length===0?<div style={{fontSize:12,color:"#999",textAlign:"center",padding:"18px 0"}}>Nothing recorded yet.</div>
        :comp.map((c,i)=><div key={c.id||i} style={{padding:"9px 0",borderBottom:"1px solid #eef2ee"}}>
          <div style={{display:"flex",justifyContent:"space-between",gap:8}}>
            <b style={{fontSize:13,color:"#1a5a3a"}}>{c.party}</b>
            <span style={{fontSize:10.5,color:"#999"}}>{c.officer} · {c.date}</span>
          </div>
          <div style={{fontSize:11.5,color:"#666"}}>Competitor: <b>{c.competitorBrand}</b>
            {c.theirLifting?(" · "+c.theirLifting+" doz/mo"):""}</div>
          {c.ourBrand&&<div style={{fontSize:11.5,color:"#1a5a3a"}}>
            Committed to us: <b>{c.ourBrand}</b> {c.commitment?("· "+c.commitment+" doz/mo"):""}</div>}
        </div>)}
      </div>}

      {tab==="parties"&&<div>
        {parties.length===0?<div style={{fontSize:12,color:"#999",textAlign:"center",padding:"18px 0"}}>No new parties yet.</div>
        :parties.map((p,i)=><div key={p.id||i} style={{padding:"9px 0",borderBottom:"1px solid #eef2ee"}}>
          <div style={{display:"flex",justifyContent:"space-between",gap:8}}>
            <b style={{fontSize:13,color:"#1a5a3a"}}>{p.name}</b>
            <span style={{fontSize:10.5,color:"#999"}}>{p.officer} · {p.date}</span>
          </div>
          <div style={{fontSize:11.5,color:"#666"}}>{p.town}{p.phone?(" · "+p.phone):""}</div>
          {p.stocks&&<div style={{fontSize:11.5,color:"#666"}}>Stocks: {p.stocks}</div>}
          {p.potential&&<div style={{fontSize:11.5,color:"#1a5a3a"}}>Potential {p.potential} doz/mo</div>}
        </div>)}
      </div>}

      {tab==="team"&&<div>
        {recruits.length===0?<div style={{fontSize:12,color:"#999",textAlign:"center",padding:"18px 0"}}>No candidates recorded yet.</div>
        :recruits.map((r,i)=><div key={r.id||i} style={{padding:"9px 0",borderBottom:"1px solid #eef2ee"}}>
          <div style={{display:"flex",justifyContent:"space-between",gap:8}}>
            <b style={{fontSize:13,color:"#1a5a3a"}}>{r.candidate}</b>
            <span style={{fontSize:10.5,color:"#999"}}>under {r.officer}</span>

          <div style={{fontSize:11.5,color:"#666"}}>{r.area} · {r.stage}</div>
        </div>)}
      </div>}
    </div>
  );
}

function PurchaseSalesCapture({ mode, onSaveEntry, onClose }) {
  const isPurchase = mode === "purchase";
  const label = isPurchase ? "Purchase" : "Sales";
  const accent = isPurchase ? "#c0392b" : "#1a7a4a";
  const [photo, setPhoto] = useState(null);
  const [busy, setBusy] = useState(false);
  const [parsed, setParsed] = useState(null);
  const [msg, setMsg] = useState("");
  const camRef = useRef(null);
  const galRef = useRef(null);

  const onPick = ev => {
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => setPhoto({ dataUrl: r.result, type: f.type || "image/jpeg", name: f.name || "" });
    r.readAsDataURL(f);
    setParsed(null); setMsg("");
  };

  const scan = async () => {
    if (!photo) return;
    setBusy(true); setMsg("📄 Reading the " + label.toLowerCase() + " bill…");
    try {
      const b64 = String(photo.dataUrl).split(",")[1];
      const who = isPurchase ? "supplier/vendor you are buying from" : "customer you are selling to";
      const prompt =
"Read this " + label + " bill/invoice/order image. Extract the key details for a business ledger entry.\\n" +
"Return ONLY JSON: {\\\"party\\\":\\\"<" + who + ">\\\",\\\"date\\\":\\\"<YYYY-MM-DD or blank>\\\",\\\"invoiceNo\\\":\\\"<number or blank>\\\",\\\"amount\\\":<total amount as number>,\\\"items\\\":\\\"<short summary of items>\\\",\\\"notes\\\":\\\"<anything useful like GST, terms>\\\"}. Use numbers only for amount (no currency symbol). If unclear, leave blank/0.";
      const isPdf = (photo.type||"").indexOf("pdf") > -1;
      const txt = await claudeAPI(prompt, "Return ONLY valid JSON. Extract accurately from the bill.", isPdf ? "" : b64, isPdf ? "" : photo.type, isPdf ? b64 : "");
      const clean = String(txt || "").replace(/```json/g, "").replace(/```/g, "").trim();
      const s = clean.indexOf("{"), e = clean.lastIndexOf("}");
      const obj = JSON.parse(s >= 0 ? clean.substring(s, e + 1) : clean);
      setParsed({
        party: obj.party || "", date: obj.date || new Date().toISOString().slice(0, 10),
        invoiceNo: obj.invoiceNo || "", amount: obj.amount || "", items: obj.items || "", notes: obj.notes || ""
      });
      setMsg("");
    } catch (e) { setMsg("❌ Couldn't read it clearly. Try a sharper photo, or edit the fields below."); setParsed({ party: "", date: new Date().toISOString().slice(0,10), invoiceNo: "", amount: "", items: "", notes: "" }); }
    setBusy(false);
  };

  const save = async () => {
    if (!parsed) return;
    setBusy(true);
    const entry = {
      id: genId(),
      title: label + (parsed.party ? " — " + parsed.party : "") + (parsed.invoiceNo ? " #" + parsed.invoiceNo : ""),
      date: parsed.date || new Date().toISOString().slice(0, 10),
      category: isPurchase ? "Purchase" : "Sales",
      taskType: isPurchase ? "Purchase" : "Sales",
      [isPurchase ? "vendor" : "person"]: parsed.party || "",
      amount: parsed.amount || "",
      paymentStatus: "Pending",
      notes: (parsed.items ? parsed.items : "") + (parsed.notes ? " | " + parsed.notes : ""),
      tags: [label],
      createdAt: new Date().toISOString()
    };
    try { await onSaveEntry(entry); setMsg("✓ " + label + " entry saved"); setTimeout(() => { onClose && onClose(); }, 1000); }
    catch (e) { setMsg("Save failed — try again."); }
    setBusy(false);
  };

  const inp = { width: "100%", padding: "9px", borderRadius: 8, border: "1px solid #ccd", fontSize: 13, marginBottom: 8 };
  const bigBtn = (bg) => ({ flex: 1, padding: "14px 8px", borderRadius: 10, border: "none", background: bg, color: "#fff", fontWeight: 700, fontSize: 13, cursor: "pointer" });

  return (
    <div style={{ padding: 4 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
        <span style={{ fontSize: 26 }}>📷</span>
        <div><h2 style={{ margin: 0, fontSize: 18, color: accent }}>{label} Entry</h2>
        <div style={{ fontSize: 11, color: "#777" }}>Snap or upload the {label.toLowerCase()} bill — details filled automatically</div></div>
      </div>

      {/* Hidden inputs: camera + gallery/file */}
      <input ref={camRef} type="file" accept="image/*" capture="environment" onChange={onPick} style={{ display: "none" }} />
      <input ref={galRef} type="file" accept="image/*,application/pdf" onChange={onPick} style={{ display: "none" }} />

      {!photo && (
        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
          <button onClick={() => camRef.current && camRef.current.click()} style={bigBtn("linear-gradient(135deg," + accent + ",#333)")}>📸 Camera</button>
          <button onClick={() => galRef.current && galRef.current.click()} style={bigBtn("linear-gradient(135deg,#555,#333)")}>🖼️ Gallery / 📄 PDF / File</button>
        </div>
      )}

      {photo && (
        <div style={{ textAlign: "center", marginBottom: 12 }}>
          {(photo.type||"").indexOf("pdf")>-1
            ? <div style={{ padding:"18px", background:"#f4f0fa", borderRadius:8, border:"1px solid #d8c8f0", fontSize:13, color:"#5a3a9a", fontWeight:700 }}>📄 PDF ready — {photo.name || "document"}</div>
            : <img src={photo.dataUrl} alt="bill" style={{ maxWidth: "100%", maxHeight: 180, borderRadius: 8, border: "1px solid #ddd" }} />}
          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
            {!parsed && <button onClick={scan} disabled={busy} style={bigBtn(accent)}>{busy ? "⏳ Reading…" : "🔍 Read the bill"}</button>}
            <button onClick={() => { setPhoto(null); setParsed(null); setMsg(""); }} style={{ ...bigBtn("#888"), flex: parsed ? 1 : 0.4 }}>↺ Retake</button>
          </div>
        </div>
      )}

      {msg && <div style={{ fontSize: 12.5, color: msg[0] === "✓" ? "#1a7a3a" : "#a33", marginBottom: 10, textAlign: "center" }}>{msg}</div>}

      {parsed && (
        <div style={{ background: "#fafafa", border: "1px solid #eee", borderRadius: 10, padding: 12 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: accent, marginBottom: 8 }}>Review & edit before saving:</div>
          <label style={{ fontSize: 11, color: "#555" }}>{isPurchase ? "Supplier / Vendor" : "Customer"}</label>
          <input value={parsed.party} onChange={e => setParsed({ ...parsed, party: e.target.value })} style={inp} />
          <div style={{ display: "flex", gap: 8 }}>
            <div style={{ flex: 1 }}><label style={{ fontSize: 11, color: "#555" }}>Amount ₹</label>
              <input value={parsed.amount} onChange={e => setParsed({ ...parsed, amount: e.target.value })} style={inp} /></div>
            <div style={{ flex: 1 }}><label style={{ fontSize: 11, color: "#555" }}>Date</label>
              <input value={parsed.date} onChange={e => setParsed({ ...parsed, date: e.target.value })} style={inp} /></div>
          </div>
          <label style={{ fontSize: 11, color: "#555" }}>Invoice No.</label>
          <input value={parsed.invoiceNo} onChange={e => setParsed({ ...parsed, invoiceNo: e.target.value })} style={inp} />
          <label style={{ fontSize: 11, color: "#555" }}>Items / Notes</label>
          <textarea value={parsed.items + (parsed.notes ? " | " + parsed.notes : "")} onChange={e => setParsed({ ...parsed, items: e.target.value, notes: "" })} rows={2} style={{ ...inp, resize: "vertical" }} />
          <button onClick={save} disabled={busy} style={{ width: "100%", padding: "12px", borderRadius: 10, border: "none", background: accent, color: "#fff", fontWeight: 700, fontSize: 15, cursor: "pointer" }}>
            {busy ? "Saving…" : "💾 Save " + label + " entry"}
          </button>
        </div>
      )}

      <div style={{ fontSize: 10, color: "#999", marginTop: 10, fontStyle: "italic" }}>
        Saved as a {label} entry, marked Pending. Your rules & reminders apply as usual.
      </div>
    </div>
  );
}


function Receivables({ entries, onSaveEntry, onClose }) {
  const [payFor, setPayFor] = useState(null);   // entry being paid
  const [payAmt, setPayAmt] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");

  const num = v => { const n = parseFloat(String(v ?? "").replace(/[^0-9.]/g, "")); return isNaN(n) ? 0 : n; };
  const fmt = n => "₹" + Math.round(n).toLocaleString("en-IN");
  const daysOld = d => { const t = Date.parse(d); return isNaN(t) ? 0 : Math.floor((Date.now() - t) / 86400000); };

  // Sales entries that still have money outstanding
  const open = (entries || []).filter(e => {
    if (!e) return false;
    const cat = String(e.category || "");
    const tt  = String(e.taskType || "");
    const tags = (e.tags || []).map(t => String(t).toLowerCase());
    // Only true customer sales invoices — money owed TO us
    const isSale = /^\s*sales\s*$/i.test(cat) || /^\s*sales\s*$/i.test(tt);
    if (!isSale) return false;
    // Exclude officer visits / travel allowance / field reports — money we PAY OUT
    const notInvoice =
      /visit|allowance|travel|field|expense|report|salary/i.test(cat) ||
      /visit|allowance|travel|field|expense|report|salary/i.test(tt) ||
      tags.some(t => /visit|allowance|travel|field report|expense/.test(t));
    if (notInvoice) return false;
    const total = num(e.amount);
    if (total <= 0) return false;
    const paid = num(e.amountPaid);
    return paid < total - 0.5;   // still something owed
  });

  const withCalc = open.map(e => {
    const total = num(e.amount), paid = num(e.amountPaid);
    return { e, total, paid, due: total - paid, age: daysOld(e.date) };
  }).sort((a, b) => b.age - a.age);   // oldest first

  const totalDue = withCalc.reduce((s, x) => s + x.due, 0);
  const overdue60 = withCalc.filter(x => x.age >= 60);
  const overdueDue = overdue60.reduce((s, x) => s + x.due, 0);

  const openPay = (x) => { setPayFor(x); setPayAmt(String(Math.round(x.due))); setMsg(""); };

  const record = async (full) => {
    if (!payFor) return;
    const amt = full ? payFor.due : num(payAmt);
    if (amt <= 0) { setMsg("Enter an amount."); return; }
    if (amt > payFor.due + 0.5) { setMsg("That's more than the outstanding amount."); return; }
    setBusy(true);
    const newPaid = payFor.paid + amt;
    const settled = newPaid >= payFor.total - 0.5;
    const upd = {
      ...payFor.e,
      amountPaid: newPaid,
      paymentStatus: settled ? "Paid" : "Partially Paid",
      notes: (payFor.e.notes ? payFor.e.notes + " | " : "") +
             "Received " + fmt(amt) + " on " + new Date().toISOString().slice(0, 10) +
             (settled ? " — settled in full" : (" — " + fmt(payFor.total - newPaid) + " still due")),
      tags: Array.from(new Set([...(payFor.e.tags || []).filter(t => t !== "Payment Due"),
                                settled ? "Payment Received" : "Partially Paid"]))
    };
    try {
      await onSaveEntry(upd);
      setMsg("✓ Recorded " + fmt(amt) + (settled ? " — fully settled" : " — " + fmt(payFor.total - newPaid) + " still due"));
      setPayFor(null); setPayAmt("");
      setTimeout(() => setMsg(""), 3000);
    } catch (err) { setMsg("Couldn't save — try again."); }
    setBusy(false);
  };

  const inp = { width: "100%", padding: "10px", borderRadius: 8, border: "1.5px solid #cfd8cf", fontSize: 15, marginBottom: 10 };

  return (
    <div style={{ padding: 4 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
        <span style={{ fontSize: 26 }}>📥</span>
        <div><h2 style={{ margin: 0, fontSize: 18, color: "#1a5a3a" }}>Receivables</h2>
        <div style={{ fontSize: 11, color: "#6a7a6a" }}>Who owes you, how much, how long</div></div>
      </div>

      {/* Headline */}
      <div style={{ background: totalDue > 0 ? "linear-gradient(135deg,#1a7a4a,#0a5a2a)" : "#888", borderRadius: 12, padding: "14px 16px", color: "#fff", marginBottom: 12 }}>
        <div style={{ fontSize: 11, opacity: .9, letterSpacing: ".05em" }}>TOTAL OUTSTANDING</div>
        <div style={{ fontSize: 28, fontWeight: 800, lineHeight: 1.1 }}>{fmt(totalDue)}</div>
        <div style={{ fontSize: 10.5, opacity: .85, marginTop: 3 }}>
          {withCalc.length} invoice{withCalc.length === 1 ? "" : "s"}
          {overdue60.length > 0 && <span> · <b>{fmt(overdueDue)} over 60 days</b></span>}
        </div>
      </div>

      {msg && <div style={{ fontSize: 12.5, color: msg[0] === "✓" ? "#1a7a3a" : "#a33", marginBottom: 10 }}>{msg}</div>}

      {/* Payment entry */}
      {payFor && (
        <div style={{ background: "#f2f9f2", border: "2px solid #1a7a4a", borderRadius: 10, padding: 12, marginBottom: 12 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: "#1a5a3a" }}>{payFor.e.person || payFor.e.title}</div>
          <div style={{ fontSize: 11, color: "#666", marginBottom: 8 }}>
            Invoice {fmt(payFor.total)} · already paid {fmt(payFor.paid)} · <b>{fmt(payFor.due)} due</b>
          </div>
          <label style={{ fontSize: 12, fontWeight: 700, color: "#1a5a3a" }}>Amount received ₹</label>
          <input type="number" value={payAmt} onChange={e => setPayAmt(e.target.value)} style={inp} autoFocus />
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={() => { setPayFor(null); setMsg(""); }} style={{ flex: 1, padding: "10px", borderRadius: 8, border: "1px solid #ccc", background: "#fff", cursor: "pointer", fontSize: 13 }}>Cancel</button>
            <button onClick={() => record(false)} disabled={busy} style={{ flex: 1, padding: "10px", borderRadius: 8, border: "1px solid #1a7a4a", background: "#eafaf0", color: "#1a5a3a", fontWeight: 700, cursor: "pointer", fontSize: 13 }}>Record part</button>
            <button onClick={() => record(true)} disabled={busy} style={{ flex: 1.2, padding: "10px", borderRadius: 8, border: "none", background: "#1a7a4a", color: "#fff", fontWeight: 700, cursor: "pointer", fontSize: 13 }}>✓ Paid in full</button>
          </div>
        </div>
      )}

      {/* List */}
      {withCalc.length === 0 && <div style={{ fontSize: 12.5, color: "#777", fontStyle: "italic", textAlign: "center", padding: 20 }}>
        Nothing outstanding. Every sales invoice is settled.
      </div>}

      {withCalc.map((x, i) => {
        const red = x.age >= 60, amber = x.age >= 30 && x.age < 60;
        return (
          <div key={i} style={{
            border: "1px solid " + (red ? "#e0a0a0" : amber ? "#e0c890" : "#dde0dd"),
            background: red ? "#fdf5f5" : amber ? "#fdfaf2" : "#fafafa",
            borderRadius: 10, padding: 10, marginBottom: 8
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: "#1a1a2a" }}>{x.e.person || x.e.title || "—"}</div>
                <div style={{ fontSize: 10.5, color: "#777", marginTop: 2 }}>
                  {x.e.date} · {x.age} days old
                  {x.paid > 0 && <span style={{ color: "#1a7a4a" }}> · part-paid {fmt(x.paid)} of {fmt(x.total)}</span>}
                </div>
                {red && <div style={{ display: "inline-block", marginTop: 4, fontSize: 9.5, color: "#fff", background: "#c33", padding: "1px 7px", borderRadius: 10 }}>60+ DAYS</div>}
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ fontSize: 15, fontWeight: 800, color: red ? "#c33" : "#1a5a3a" }}>{fmt(x.due)}</div>
                <button onClick={() => openPay(x)} style={{ marginTop: 4, fontSize: 11, padding: "5px 12px", borderRadius: 7, border: "1px solid #1a7a4a", background: "#eafaf0", color: "#1a5a3a", fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}>₹ Received</button>
              </div>
            </div>
          </div>
        );
      })}

      <div style={{ fontSize: 10, color: "#999", marginTop: 12, fontStyle: "italic" }}>
        Part-payments are supported — record what came in, and the balance stays outstanding until settled.
      </div>
    </div>
  );
}


function TelegramShare({ entry, onClose }) {
  const [contacts, setContacts] = useState([]);
  const [selected, setSelected] = useState([]);
  const [text, setText] = useState("");
  const [when, setWhen] = useState("");
  const [mode, setMode] = useState("now"); // now | schedule
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");

  // Build a clean summary from the entry
  useEffect(() => {
    if (!entry) return;
    const L = [];
    L.push("📋 " + (entry.title || "Entry"));
    if (entry.date) L.push("📅 " + entry.date);
    if (entry.person) L.push("👤 " + entry.person);
    if (entry.vendor) L.push("🏭 " + entry.vendor);
    if (entry.amount) L.push("💰 ₹" + entry.amount);
    if (entry.paymentStatus) L.push("💳 " + entry.paymentStatus);
    if (entry.notes) L.push("\n📝 " + String(entry.notes).slice(0, 300));
    setText(L.join("\n"));
  }, [entry]);

  useEffect(() => { (async () => {
    try { const r = await sheetsAPI("getPortfolio", { key: "tg_contacts" }); if (r && r.data && Array.isArray(r.data)) setContacts(r.data); } catch(e) {}
  })(); }, []);

  const toggle = (id) => setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);

  const sendNow = async () => {
    if (!selected.length) { setMsg("Pick at least one person."); return; }
    setBusy(true); setMsg("📤 Sending…");
    try {
      const r = await fetch("/.netlify/functions/telegram", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "send", message: text, chatIds: selected })
      });
      const d = await r.json();
      if (d && d.ok) { setMsg("✓ Sent to " + d.sent); setTimeout(() => onClose && onClose(), 1200); }
      else setMsg("Failed: " + (d.error || "unknown"));
    } catch(e) { setMsg("Error: " + e.message); }
    setBusy(false);
  };

  const schedule = async () => {
    if (!selected.length) { setMsg("Pick at least one person."); return; }
    if (!when) { setMsg("Pick a date & time."); return; }
    setBusy(true);
    try {
      const cur = await sheetsAPI("getPortfolio", { key: "tg_scheduled" });
      const list = (cur && cur.data && Array.isArray(cur.data.scheduled)) ? cur.data.scheduled : [];
      list.push({ id: "tg_" + Date.now(), text, chatIds: [...selected], when: new Date(when).toISOString(), repeat: "once", created: new Date().toISOString() });
      await sheetsAPI("savePortfolio", { key: "tg_scheduled", data: { scheduled: list } });
      setMsg("✓ Scheduled"); setTimeout(() => onClose && onClose(), 1200);
    } catch(e) { setMsg("Couldn't schedule: " + e.message); }
    setBusy(false);
  };

  // Quick presets for chasing payment
  const preset = (days) => {
    const d = new Date(); d.setDate(d.getDate() + days); d.setHours(10, 0, 0, 0);
    const pad = n => String(n).padStart(2, "0");
    setWhen(d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()));
    setMode("schedule");
  };

  const inp = { width: "100%", padding: "9px", borderRadius: 8, border: "1px solid #ccd", fontSize: 13, marginBottom: 8 };
  if (!entry) return null;

  return (
    <div style={{ padding: 4 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
        <span style={{ fontSize: 24 }}>✈️</span>
        <div><h2 style={{ margin: 0, fontSize: 17, color: "#0088cc" }}>Send via Telegram</h2>
        <div style={{ fontSize: 11, color: "#6a8a9a" }}>Now, or schedule it for later</div></div>
      </div>

      <label style={{ fontSize: 12, fontWeight: 700, color: "#0a5a7a" }}>Message (edit as you like)</label>
      <textarea value={text} onChange={e => setText(e.target.value)} rows={6} style={{ ...inp, resize: "vertical", fontFamily: "inherit" }} />

      <label style={{ fontSize: 12, fontWeight: 700, color: "#0a5a7a" }}>Send to ({selected.length})</label>
      <div style={{ maxHeight: 110, overflowY: "auto", border: "1px solid #dde", borderRadius: 8, padding: 6, marginBottom: 10 }}>
        {contacts.length === 0 && <div style={{ fontSize: 11, color: "#999", fontStyle: "italic", padding: 4 }}>No contacts yet — sync them in Menu → Telegram.</div>}
        {contacts.map(c => (
          <label key={c.chatId} style={{ display: "flex", alignItems: "center", gap: 8, padding: "3px 2px", fontSize: 12.5, cursor: "pointer" }}>
            <input type="checkbox" checked={selected.includes(c.chatId)} onChange={() => toggle(c.chatId)} />
            {c.label || c.name}
          </label>
        ))}
      </div>

      <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
        <button onClick={() => setMode("now")} style={{ flex: 1, padding: "8px", borderRadius: 8, border: mode === "now" ? "2px solid #0088cc" : "1px solid #ccc", background: mode === "now" ? "#e8f5fc" : "#fff", color: "#0a5a7a", fontWeight: 700, cursor: "pointer", fontSize: 12 }}>📤 Send now</button>
        <button onClick={() => setMode("schedule")} style={{ flex: 1, padding: "8px", borderRadius: 8, border: mode === "schedule" ? "2px solid #0088cc" : "1px solid #ccc", background: mode === "schedule" ? "#e8f5fc" : "#fff", color: "#0a5a7a", fontWeight: 700, cursor: "pointer", fontSize: 12 }}>⏰ Schedule</button>
      </div>

      {mode === "schedule" && (
        <div style={{ marginBottom: 10 }}>
          <div style={{ display: "flex", gap: 6, marginBottom: 8, flexWrap: "wrap" }}>
            <span style={{ fontSize: 11, color: "#666", alignSelf: "center" }}>Remind in:</span>
            {[3, 7, 15, 30, 60].map(d => (
              <button key={d} onClick={() => preset(d)} style={{ fontSize: 11, padding: "4px 10px", borderRadius: 20, border: "1px solid #0088cc", background: "#fff", color: "#0088cc", cursor: "pointer" }}>{d}d</button>
            ))}
          </div>
          <input type="datetime-local" value={when} onChange={e => setWhen(e.target.value)} style={inp} />
        </div>
      )}

      {msg && <div style={{ fontSize: 12, color: msg[0] === "✓" ? "#1a7a3a" : "#a33", marginBottom: 8 }}>{msg}</div>}

      <button onClick={mode === "now" ? sendNow : schedule} disabled={busy} style={{ width: "100%", padding: "12px", borderRadius: 10, border: "none", background: "linear-gradient(135deg,#0088cc,#005f8f)", color: "#fff", fontWeight: 700, fontSize: 14, cursor: "pointer" }}>
        {busy ? "Working…" : (mode === "now" ? "📤 Send now" : "⏰ Schedule it")}
      </button>
    </div>
  );
}

            </div>
